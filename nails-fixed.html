<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nails — LMV Studio</title><style>body{font-family:system-ui;margin:0;background:#fff7fb;color:#24151f}.wrap{max-width:1100px;margin:auto;padding:24px}.card{background:white;border-radius:20px;padding:22px;margin:18px 0}.btn{background:#d14b91;color:#fff;border:0;border-radius:999px;padding:12px 18px;font-weight:800}.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}.day,.slot{border:1px solid #efdce7;background:#fff;border-radius:11px;padding:10px;text-align:center;cursor:pointer}.active{background:#d14b91!important;color:#fff}.closed{opacity:.35}.slots{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:10px}@media(max-width:650px){.days{grid-template-columns:repeat(4,1fr)}.slots{grid-template-columns:repeat(2,1fr)}}</style></head><body><main class="wrap"><h1 id="nombre">Nails Studio</h1><p id="descripcion">Cargando...</p><section class="card"><h2>💎 Principales</h2><div id="principales">Cargando...</div><h2>✨ Complementarios</h2><div id="complementarios">Cargando...</div><h3 id="total">Total: $0 · 0 min</h3></section><section class="card"><h2>📅 Agenda</h2><p id="agendaStatus">Cargando horarios...</p><div id="days" class="days"></div><div id="slots" class="slots"></div><p id="selectedDate">Elegí un día.</p><input id="cliente" placeholder="Tu nombre"><button class="btn" id="reservarBtn">Reservar turno</button><p id="msg"></p></section><section class="card"><h2>🕐 Horarios de atención</h2><div id="hours">Cargando...</div></section></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const sb=window.supabase.createClient('https://cqelidpshitntewsktwx.supabase.co','sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD');const negocioId=new URLSearchParams(location.search).get('negocio');let servicios=[],sel=[],horarios=[],dia=null,hora=null,ocupados=[];const $=x=>document.getElementById(x);const principal=x=>String(x.tipo_servicio||'').toLowerCase()==='principal';const money=x=>'$'+Number(x||0).toLocaleString('es-AR');const dur=()=>sel.reduce((a,x)=>a+Number(x.duracion_minutos||0),0);const total=()=>sel.reduce((a,x)=>a+Number(x.precio||0),0);const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function renderServices(){const card=x=>{const on=sel.some(s=>s.id===x.id);return `<div class="card"><b>${esc(x.nombre)}</b> · ${money(x.precio)}<p>${esc(x.descripcion||'')}</p><small>${x.duracion_minutos||0} min</small><br><button class="btn" data-id="${x.id}">${on?'✓ Agregado':'Agregar'}</button></div>`};$('principales').innerHTML=servicios.filter(principal).map(card).join('')||'<p>No hay principales activos.</p>';$('complementarios').innerHTML=servicios.filter(x=>!principal(x)).map(card).join('')||'<p>No hay complementarios activos.</p>';document.querySelectorAll('[data-id]').forEach(b=>b.onclick=()=>{const x=servicios.find(s=>s.id===b.dataset.id);if(sel.some(s=>s.id===x.id))sel=sel.filter(s=>s.id!==x.id);else{if(principal(x))sel=sel.filter(v=>!principal(v));sel.push(x)}$('total').textContent=`Total: ${money(total())} · ${dur()} min`;renderServices();renderDays();renderSlots()})}function dateStr(d){return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}function dayNum(s){const n=new Date(s+'T12:00:00').getDay();return n===0?7:n}function schedule(s){return horarios.filter(h=>Number(h.dia_semana)===dayNum(s)&&h.abierto!==false)}function renderDays(){const box=$('days');box.innerHTML='';const now=new Date();for(let i=0;i<14;i++){const d=new Date(now);d.setHours(12,0,0,0);d.setDate(now.getDate()+i);const ds=dateStr(d),ok=schedule(ds).length,b=document.createElement('button');b.className='day'+(ds===dia?' active':'')+(ok?'':' closed');b.disabled=!ok;b.innerHTML=`${d.toLocaleDateString('es-AR',{weekday:'short'})}<br><b>${d.getDate()}</b>`;b.onclick=()=>{dia=ds;hora=null;renderDays();renderSlots()};box.appendChild(b)}}function overlap(a,b){return ocupados.some(o=>{const x=new Date(o.fecha_hora_inicio).getTime(),y=new Date(o.fecha_hora_fin).getTime();return a<y&&b>x})}async function renderSlots(){const box=$('slots');if(!dia||!sel.some(principal)){box.innerHTML='<span>Elegí un principal y un día.</span>';return}const q=await sb.from('turnos').select('fecha_hora_inicio,fecha_hora_fin').eq('negocios_id',negocioId).gte('fecha_hora_inicio',dia+'T00:00:00').lt('fecha_hora_inicio',dia+'T23:59:59').neq('estado','cancelado');ocupados=q.data||[];let html='';for(const h of schedule(dia)){const a=Number(String(h.hora_inicio).slice(0,2))*60+Number(String(h.hora_inicio).slice(3,5)),z=Number(String(h.hora_fin).slice(0,2))*60+Number(String(h.hora_fin).slice(3,5));for(let m=a;m+dur()<=z;m+=30){const t=String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0'),st=new Date(dia+'T'+t+':00').getTime(),en=st+dur()*60000,busy=overlap(st,en);html+=`<button class="slot ${hora===t?'active':''}" ${busy?'disabled':''} data-time="${t}">${t}</button>`}}box.innerHTML=html||'<span>No hay horarios disponibles.</span>';box.querySelectorAll('.slot:not([disabled])').forEach(b=>b.onclick=()=>{hora=b.dataset.time;renderSlots();$('selectedDate').textContent=new Date(dia+'T12:00:00').toLocaleDateString('es-AR',{weekday:'long',day:'numeric',month:'long'})+' · '+hora})}async function loadSchedule(){const r=await sb.from('horarios_negocio').select('id,negocio_id,dia_semana,abierto,hora_inicio,hora_fin').eq('negocio_id',negocioId).order('dia_semana');if(r.error){$('agendaStatus').textContent='Error cargando horarios: '+r.error.message;$('hours').textContent=r.error.message;return}horarios=r.data||[];const abiertos=horarios.filter(h=>h.abierto===true&&h.hora_inicio&&h.hora_fin);const names=['','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'];$('hours').innerHTML=abiertos.map(h=>`<div><b>${names[Number(h.dia_semana)]}</b> · ${String(h.hora_inicio).slice(0,5)} — ${String(h.hora_fin).slice(0,5)}</div>`).join('')||'<div>No hay días abiertos configurados.</div>';$('agendaStatus').textContent=abiertos.length?`Hay ${abiertos.length} días de atención configurados.`:'No hay días abiertos configurados.';renderDays();renderSlots()}async function init(){if(!negocioId)return;$('agendaStatus').textContent='Cargando...';const b=await sb.from('negocios').select('nombre,descripcion').eq('id',negocioId).maybeSingle();if(b.data){$('nombre').textContent=b.data.nombre||'Nails Studio';$('descripcion').textContent=b.data.descripcion||'Manicura, diseño y detalles pensados para vos.'}const s=await sb.from('servicios').select('id,nombre,descripcion,precio,duracion_minutos,tipo_servicio').eq('negocio_id',negocioId).eq('activo',true).order('nombre');if(s.error){$('principales').textContent=s.error.message;$('complementarios').textContent=s.error.message}else{servicios=s.data||[];renderServices();renderDays()}await loadSchedule()}$('reservarBtn').onclick=async()=>{if(!sel.some(principal))return $('msg').textContent='Elegí un principal.';if(!dia||!hora)return $('msg').textContent='Elegí día y horario.';const name=$('cliente').value.trim();if(!name)return $('msg').textContent='Completá tu nombre.';const s=await sb.auth.getSession();if(!s.data.session){await sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});return}const start=new Date(dia+'T'+hora+':00'),end=new Date(start.getTime()+dur()*60000);const q=await sb.from('turnos').select('id').eq('negocios_id',negocioId).lt('fecha_hora_inicio',end.toISOString()).gt('fecha_hora_fin',start.toISOString()).neq('estado','cancelado');if(q.data?.length)return $('msg').textContent='Ese horario ya está ocupado.';const t=await sb.from('turnos').insert({negocios_id:negocioId,cliente_id:s.data.session.user.id,fecha_hora_inicio:start.toISOString(),fecha_hora_fin:end.toISOString(),precio_reservado_total:total(),estado:'pendiente',nombre_cliente:name,cliente_nombre:name}).select('id').single();if(t.error)return $('msg').textContent=t.error.message;const x=await sb.from('turno_servicios').insert(sel.map(v=>({turno_id:t.data.id,servicio_id:v.id,precio_reservado:Number(v.precio||0),duracion_minutos:Number(v.duracion_minutos||0)})));$('msg').textContent=x.error?x.error.message:'Turno reservado correctamente.'};init();</script></body></html>
