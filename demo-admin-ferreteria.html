<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>LMV Studio — Admin Ferretería Demo</title>
<style>
:root{--blue:#1769ff;--deep:#082d78;--ink:#10213d;--muted:#66758d;--bg:#f4f8ff;--card:#fff;--line:#dce7f6;--soft:#eaf2ff;--green:#159b62;--red:#d64b55;--amber:#b77900;--shadow:0 14px 40px rgba(24,73,150,.08)}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,Arial;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:linear-gradient(180deg,var(--deep),#0b49bd);color:#fff;padding:18px 12px;position:sticky;top:0;height:100vh}.brand{font-weight:950;letter-spacing:1px;padding:4px 9px 16px}.demo{background:rgba(255,255,255,.13);padding:9px 10px;border-radius:12px;font-size:10px;font-weight:900;margin-bottom:12px}.nav{display:grid;gap:3px}.nav button{border:0;background:transparent;color:#dbe8ff;text-align:left;padding:11px 12px;border-radius:11px;font-weight:850}.nav button:hover,.nav button.active{background:rgba(255,255,255,.15);color:#fff}.main{padding:24px;min-width:0;max-width:1500px;width:100%}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:18px}.top h1{margin:0;font-size:27px}.badge{background:#dff8eb;color:#08784a;padding:7px 10px;border-radius:999px;font-size:10px;font-weight:950}.view{display:none}.view.show{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.card{padding:17px}.card span{display:block;color:var(--muted);font-size:11px}.card b{display:block;font-size:25px;margin-top:6px}.panel{padding:19px;margin-top:15px}.panel h2{margin:0 0 13px;font-size:18px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:13px}.toolbar h2{margin:0}.btn{border:0;border-radius:999px;padding:10px 14px;background:var(--blue);color:#fff;font-weight:900}.btn.sec{background:var(--soft);color:var(--deep)}.filters{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:13px}.filters>*{border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 10px;color:var(--muted);font-weight:800}.filters button.active{background:var(--soft);color:var(--blue);border-color:#bcd3ff}.tablewrap{overflow:auto;border:1px solid #edf2f8;border-radius:14px}table{width:100%;border-collapse:collapse;font-size:12px;min-width:720px}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf2f8;white-space:nowrap}th{font-size:9px;text-transform:uppercase;color:var(--muted)}.pill{display:inline-block;padding:5px 8px;border-radius:999px;background:var(--soft);color:var(--deep);font-size:9px;font-weight:950}.ok{background:#dff8eb;color:#08784a}.warn{background:#fff2cf;color:#8c6400}.bad{background:#ffe9eb;color:#a82e38}.positive{color:var(--green);font-weight:900}.negative{color:var(--red);font-weight:900}.alert{padding:11px;border-radius:12px;background:#fff2cf;color:#8c6400;font-size:12px;font-weight:800;margin:7px 0}.bars{height:170px;display:flex;align-items:end;gap:8px;padding:12px 0}.bar{flex:1;background:linear-gradient(180deg,#1769ff,#a9c8ff);border-radius:7px 7px 2px 2px;min-width:12px;position:relative}.bar small{position:absolute;bottom:-19px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--muted)}.control{border:1px solid var(--line);border-radius:15px;padding:14px;margin:8px 0}.controlHead{display:flex;justify-content:space-between;gap:10px;align-items:center}.controlHead b{font-size:13px}.controlHead span{display:block;color:var(--muted);font-size:10px;margin-top:3px;line-height:1.4}.switch{width:46px;height:25px;position:relative;flex:none}.switch input{display:none}.slider{position:absolute;inset:0;background:#cbd5e1;border-radius:99px}.slider:before{content:"";position:absolute;width:19px;height:19px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.2s}.switch input:checked+.slider{background:var(--blue)}.switch input:checked+.slider:before{transform:translateX(21px)}.toast{position:fixed;right:15px;bottom:15px;background:var(--ink);color:#fff;padding:12px 15px;border-radius:13px;z-index:99;font-size:11px}.mobileHint{display:none}
@media(max-width:900px){.app{grid-template-columns:1fr}.side{position:sticky;top:0;height:auto;z-index:20;padding:10px}.brand{display:inline-block;padding:4px 8px 8px}.demo{display:inline-block;margin:0 0 8px 5px}.nav{display:flex;overflow:auto}.nav button{min-width:max-content}.main{padding:16px}.cards{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.mobileHint{display:block;color:var(--muted);font-size:10px;margin:8px 0}.panel{padding:15px}}
@media(max-width:520px){.cards{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.top h1{font-size:23px}.badge{font-size:9px}.toolbar{align-items:flex-start;flex-direction:column}.toolbar .btn{width:100%}.filters{display:grid;grid-template-columns:1fr 1fr}.filters input,.filters select{grid-column:1/-1;width:100%}.tablewrap{border:0;border-radius:0}.tablewrap:after{content:'← Deslizá horizontalmente para ver toda la tabla →';display:block;color:var(--muted);font-size:9px;text-align:center;padding:7px}table{min-width:700px}.controlHead{align-items:flex-start}.btn{width:100%}}
</style></head>
<body><div class="app"><aside class="side"><div class="brand">LMV STUDIO · FERRETERÍA</div><span class="demo">● DEMO PÚBLICA · SIN LOGIN · SIN DATOS REALES</span><nav class="nav" id="nav"></nav></aside><main class="main"><div class="top"><h1 id="title">Resumen general</h1><span class="badge">● CONTROLES ACTIVOS</span></div><div id="content"></div></main></div>
<script>
const nav=[['inicio','📊 Resumen'],['ventas','💰 Ventas'],['stock','📦 Stock'],['clientes','👥 Clientes'],['proveedores','🏭 Proveedores'],['caja','💵 Caja'],['balance','📈 Balance'],['movimientos','🔄 Movimientos'],['controles','🔐 Controles']];const products=[['FER-001','Taladro percutor','Herramientas',85000,32,8],['FER-002','Amoladora 4 1/2','Herramientas',62000,18,6],['FER-003','Tornillos x100','Fijaciones',8500,74,20],['FER-004','Tarugos x100','Fijaciones',6500,120,30],['FER-005','Pintura 20L','Pintura',48000,9,10],['FER-006','Kit herramientas','Herramientas',120000,14,5],['FER-007','Cinta métrica','Herramientas',7500,45,12],['FER-008','Silicona','Fijaciones',4200,27,10]];let view='inicio';
nav.forEach(([id,label])=>{const b=document.createElement('button');b.textContent=label;b.dataset.v=id;b.onclick=()=>{view=id;render()};document.getElementById('nav').appendChild(b)});
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.dataset.v===view));document.getElementById('title').textContent=nav.find(x=>x[0]===view)[1].replace(/^[^ ]+ /,'');const c=document.getElementById('content');if(view==='inicio')c.innerHTML=`<div class="cards"><div class="card"><span>Ventas del período</span><b>$1.284.500</b></div><div class="card"><span>Ganancia estimada</span><b class="positive">$382.700</b></div><div class="card"><span>Productos en stock</span><b>339</b></div><div class="card"><span>Alertas</span><b class="negative">3</b></div></div><div class="grid2"><div class="panel"><h2>⚠️ Alertas importantes</h2><div class="alert">Pintura 20L: stock por debajo del mínimo.</div><div class="alert">2 cuentas corrientes tienen saldo pendiente.</div><div class="alert">Hay 1 proveedor con pago próximo.</div></div><div class="panel"><h2>📈 Ventas semanales</h2><div class="bars">${[55,72,64,88,75,96,68].map((n,i)=>`<div class="bar" style="height:${n}%"><small>${['L','M','X','J','V','S','D'][i]}</small></div>`).join('')}</div></div></div><div class="panel"><h2>🔎 Control rápido</h2><p class="mobileHint">En celular, las tablas se pueden desplazar horizontalmente.</p><div class="filters"><button onclick="toast('Filtro semanal aplicado')">Semana</button><button onclick="toast('Filtro quincenal aplicado')">Quincena</button><button onclick="toast('Filtro mensual aplicado')">Mes</button><button onclick="toast('Balance actualizado')">Actualizar</button></div></div>`;
else if(view==='ventas')c.innerHTML=`<div class="panel"><div class="toolbar"><h2>Ventas</h2><button class="btn" onclick="toast('Nueva venta de demostración creada')">+ Nueva venta</button></div><div class="filters"><button class="active">Hoy</button><button>Semana</button><button>Quincena</button><button>Mes</button><button>3 meses</button><input placeholder="Buscar cliente o Nº..."></div><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Nº</th><th>Cliente</th><th>Items</th><th>Total</th><th>Costo</th><th>Ganancia</th><th>Pago</th></tr></thead><tbody>${[['27/08','V-1042','Comercial Norte','6','$185.000','$124.000','$61.000','Transferencia'],['27/08','V-1041','Ferretería Sur','3','$92.500','$61.000','$31.500','Efectivo'],['26/08','V-1040','Obra Demo','9','$310.000','$208.000','$102.000','Cuenta corriente'],['25/08','V-1039','Juan Demo','2','$48.000','$31.500','$16.500','Tarjeta']].map(r=>`<tr>${r.map((x,i)=>`<td class="${i===6?'positive':''}">${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
else if(view==='stock')c.innerHTML=`<div class="panel"><div class="toolbar"><h2>Control de stock</h2><button class="btn" onclick="toast('Movimiento de stock de demostración creado')">+ Movimiento</button></div><div class="filters"><button class="active">Todos</button><button>Stock bajo</button><button>Más vendidos</button><input placeholder="Buscar producto o SKU..."></div><div class="tablewrap"><table><thead><tr><th>SKU</th><th>Producto</th><th>Categoría</th><th>Precio</th><th>Stock</th><th>Mínimo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${products.map(p=>`<tr><td>${p[0]}</td><td><b>${p[1]}</b></td><td>${p[2]}</td><td>$${p[3].toLocaleString('es-AR')}</td><td>${p[4]}</td><td>${p[5]}</td><td><span class="pill ${p[4]<=p[5]?'warn':'ok'}">${p[4]<=p[5]?'STOCK BAJO':'OK'}</span></td><td><button class="btn sec" onclick="toast('Producto editado en la demo')">Editar</button></td></tr>`).join('')}</tbody></table></div></div>`;
else if(view==='clientes')c.innerHTML=`<div class="panel"><div class="toolbar"><h2>Clientes · Debe / Haber</h2><button class="btn" onclick="toast('Cliente demo agregado')">+ Cliente</button></div><div class="tablewrap"><table><thead><tr><th>Cliente</th><th>Debe</th><th>Haber</th><th>Saldo</th><th>Estado</th><th>Acciones</th></tr></thead><tbody>${[['Comercial Norte','$320.000','$250.000','$70.000','Pendiente'],['Ferretería Sur','$180.000','$180.000','$0','Al día'],['Obra Demo','$450.000','$300.000','$150.000','Pendiente'],['Juan Demo','$50.000','$50.000','$0','Al día']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td class="${r[3]!='$0'?'negative':'positive'}">${r[3]}</td><td><span class="pill ${r[4]==='Al día'?'ok':'warn'}">${r[4]}</span></td><td><button class="btn sec" onclick="toast('Cuenta corriente de demo')">Ver cuenta</button></td></tr>`).join('')}</tbody></table></div></div>`;
else if(view==='proveedores')c.innerHTML=`<div class="panel"><div class="toolbar"><h2>Proveedores · Compras y deuda</h2><button class="btn" onclick="toast('Proveedor demo agregado')">+ Proveedor</button></div><div class="tablewrap"><table><thead><tr><th>Proveedor</th><th>Compras</th><th>Pagado</th><th>Saldo</th><th>Estado</th></tr></thead><tbody>${[['Distribuidora Demo','$720.000','$600.000','$120.000'],['Pinturas Demo','$310.000','$310.000','$0'],['Herramientas Demo','$480.000','$390.000','$90.000']].map(r=>`<tr><td><b>${r[0]}</b></td><td>${r[1]}</td><td>${r[2]}</td><td>${r[3]}</td><td><span class="pill ${r[3]==='$0'?'ok':'warn'}">${r[3]==='$0'?'AL DÍA':'PENDIENTE'}</span></td></tr>`).join('')}</tbody></table></div></div>`;
else if(view==='caja')c.innerHTML=`<div class="cards"><div class="card"><span>Ingresos</span><b class="positive">$1.284.500</b></div><div class="card"><span>Egresos</span><b class="negative">$901.800</b></div><div class="card"><span>Saldo</span><b>$382.700</b></div><div class="card"><span>Movimientos</span><b>47</b></div></div><div class="panel"><div class="toolbar"><h2>💵 Caja</h2><button class="btn" onclick="toast('Movimiento de caja demo agregado')">+ Movimiento</button></div><div class="filters"><button class="active">Hoy</button><button>Semana</button><button>Quincena</button><button>Mes</button></div><div class="tablewrap"><table><thead><tr><th>Hora</th><th>Concepto</th><th>Tipo</th><th>Monto</th></tr></thead><tbody>${[['09:15','Venta V-1042','Ingreso','$185.000'],['11:20','Compra proveedor','Egreso','$92.000'],['13:40','Venta V-1041','Ingreso','$92.500'],['16:10','Gasto operativo','Egreso','$18.000']].map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><span class="pill ${r[2]==='Ingreso'?'ok':'bad'}">${r[2]}</span></td><td class="${r[2]==='Ingreso'?'positive':'negative'}">${r[3]}</td></tr>`).join('')}</tbody></table></div></div>`;
else if(view==='balance')c.innerHTML=`<div class="cards"><div class="card"><span>Ventas</span><b>$1.284.500</b></div><div class="card"><span>Costos</span><b>$901.800</b></div><div class="card"><span>Ganancia</span><b class="positive">$382.700</b></div><div class="card"><span>Margen</span><b>29,8%</b></div></div><div class="panel"><div class="toolbar"><h2>📈 Balance</h2><div class="filters"><button class="active">Mes</button><button>Semana</button><button>Quincena</button><button>3 meses</button><button>Año</button></div></div><div class="bars">${[45,62,55,78,71,90,84,96].map((n,i)=>`<div class="bar" style="height:${n}%"><small>${i+1}</small></div>`).join('')}</div></div>`;
else if(view==='movimientos')c.innerHTML=`<div class="panel"><div class="toolbar"><h2>Historial de movimientos</h2><button class="btn sec" onclick="toast('Movimiento demo agregado')">+ Movimiento demo</button></div><div class="filters"><input placeholder="Buscar área, detalle o usuario..."><select><option>Todas las áreas</option><option>Stock</option><option>Venta</option><option>Caja</option><option>Cuenta corriente</option></select></div><div class="tablewrap"><table><thead><tr><th>Fecha</th><th>Área</th><th>Movimiento</th><th>Detalle</th><th>Usuario</th></tr></thead><tbody>${[['27/08 16:20','Stock','Ajuste','Ingreso de 10 unidades','Demo'],['27/08 15:42','Venta','Nueva venta','V-1042 · Comercial Norte','Demo'],['27/08 13:40','Caja','Ingreso','Venta V-1041','Demo'],['27/08 11:20','Proveedor','Pago','Distribuidora Demo','Demo']].map(r=>`<tr>${r.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div></div>`;
else c.innerHTML=`<div class="panel"><div class="toolbar"><div><h2>🔐 Controles</h2><p style="color:var(--muted);font-size:11px">En el sistema real estos controles se aplicarían sobre los datos del negocio.</p></div><button class="btn" onclick="toast('Configuración demo guardada')">Guardar</button></div>${[['Alertas de stock','Avisar cuando un producto quede debajo del mínimo.'],['Control de caja','Detectar diferencias entre ingresos y egresos.'],['Debe / Haber','Controlar saldos de clientes y proveedores.'],['Bloqueo de stock negativo','Evitar ventas por encima del stock disponible.'],['Registro de movimientos','Guardar quién realizó cada cambio.'],['Períodos de análisis','Comparar semana, quincena, mes, 3 meses y año.'],['Copias de seguridad','Preparar respaldo periódico de la información.']].map((x,i)=>`<div class="control"><div class="controlHead"><div><b>${x[0]}</b><span>${x[1]}</span></div><label class="switch"><input type="checkbox" ${i!==4?'checked':''} onchange="toast('${x[0]} actualizado')"><span class="slider"></span></label></div></div>`).join('')}</div>`}
function toast(t){const e=document.createElement('div');e.className='toast';e.textContent='✓ '+t;document.body.appendChild(e);setTimeout(()=>e.remove(),2200)}render();
</script></body></html>
