<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LMV Studio — Multirubro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background:#090909;color:#fff}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;padding-bottom:18px;margin-bottom:22px}.brand{color:#d4af37;font-size:24px;font-weight:800}.user{color:#aaa;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:20px}.campo{margin-bottom:13px}.campo label{display:block;color:#ddd;font-size:13px;font-weight:700;margin-bottom:6px}.campo input,.campo select{width:100%;padding:11px;border-radius:8px;border:1px solid #333;background:#0d0d0d;color:#fff;box-sizing:border-box}.btn{display:inline-block;border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer;background:#d4af37;color:#111;text-decoration:none}.btn.sec{background:#252525;color:#fff;border:1px solid #333}.btn.salir{background:#321515;color:#ff9999}.lista{display:grid;gap:10px}.negocio{border:1px solid #292929;border-radius:10px;padding:14px}.meta{font-size:12px;color:#aaa;margin:5px 0 10px;word-break:break-all}.estado{display:inline-block;padding:5px 9px;border-radius:20px;font-size:11px;font-weight:700;margin-bottom:10px}.ok{background:#173317;color:#8be58b}.pendiente{background:#332b13;color:#e8c95d}.acciones{display:flex;gap:8px;flex-wrap:wrap}.msg{display:none;padding:11px;border-radius:8px;margin-bottom:15px}.msg.ok{display:block;background:#173317;color:#8be58b}.msg.err{display:block;background:#241212;color:#ff9999}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{max-width:430px;width:100%;text-align:center;background:#151515;border:1px solid #292929;border-radius:15px;padding:30px}
@media(max-width:750px){.wrap{padding:15px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column;gap:15px}.acciones{display:grid;grid-template-columns:1fr 1fr}.acciones .btn{text-align:center}}
</style>
</head>
<body>
<div id="login" class="login">
  <div class="loginbox">
    <h1>LMV STUDIO</h1>
    <p>Panel central multirubro</p>
    <button id="loginBtn" class="btn" type="button">🔐 Acceder con Google</button>
    <div id="loginMsg"></div>
  </div>
</div>
<div id="app" style="display:none">
  <div class="wrap">
    <div class="top">
      <div><div class="brand">LMV STUDIO</div><div class="user" id="userInfo"></div></div>
      <button id="logoutBtn" class="btn salir" type="button">Cerrar sesión</button>
    </div>
    <div id="msg" class="msg"></div>
    <div class="grid">
      <section class="card">
        <h2>➕ Crear negocio</h2>
        <form id="form">
          <div class="campo"><label>Tipo de negocio</label><select id="tipo" required>
            <option value="barberia">💈 Barbería</option>
            <option value="comida">🍔 Comida</option>
            <option value="ropa">👕 Tienda de ropa</option>
            <option value="cosmetologia">✨ Cosmetología</option>
            <option value="depilacion_laser">⚡ Depilación láser</option>
            <option value="nails">💅 Nails</option>
            <option value="lashes">👁️ Lashes</option>
            <option value="lashes_nails">💅 Lashes & Nails</option>
          </select></div>
          <div class="campo"><label>Nombre</label><input id="nombre" required></div>
          <div class="campo"><label>Teléfono</label><input id="telefono"></div>
          <div class="campo"><label>Dirección</label><input id="direccion"></div>
          <div class="campo"><label>Instagram</label><input id="instagram"></div>
          <div class="campo"><label>Correo Google del dueño</label><input id="duenoEmail" type="email" required></div>
          <button class="btn" type="submit">Crear negocio</button>
        </form>
        <div id="entrega" style="margin-top:12px;color:#aaa;font-size:12px;word-break:break-all"></div>
      </section>
      <section class="card"><h2>🏪 Negocios</h2><div id="lista" class="lista">Cargando...</div></section>
    </div>
  </div>
</div>
<script>
const U='https://cqelidpshitntewsktwx.supabase.co';
const K='sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD';
const s=window.supabase.createClient(U,K);
const BASE='https://lmv-studio.github.io/Nova-shop/';
const PUBLICAS={
  barberia:BASE+'barberia.html',
  comida:BASE+'comida.html',
  ropa:BASE+'ropa.html',
  cosmetologia:BASE+'estetica.html',
  depilacion_laser:BASE+'estetica.html',
  nails:BASE+'nails.html',
  lashes:BASE+'lashes.html',
  lashes_nails:BASE+'estetica.html'
};
const ADMINS={
  barberia:BASE+'admin.barberia_reutilizable.html',
  comida:BASE+'admin.comida.html',
  ropa:BASE+'admin.ropa.html',
  cosmetologia:BASE+'admin.estetica.html',
  depilacion_laser:BASE+'admin.estetica.html',
  nails:BASE+'admin.nails.html',
  lashes:BASE+'admin.lashes.html',
  lashes_nails:BASE+'admin.estetica.html'
};
const LABELS={
  barberia:'💈 Barbería', comida:'🍔 Comida', ropa:'👕 Tienda de ropa',
  cosmetologia:'✨ Cosmetología', depilacion_laser:'⚡ Depilación láser',
  nails:'💅 Nails', lashes:'👁️ Lashes', lashes_nails:'💅 Lashes & Nails'
};
const $=id=>document.getElementById(id);
const esc=value=>String(value??'').replace(/[&<>"']/g, char=>({
  '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'
})[char]);

function mostrarMsg(texto,ok=false){
  const m=$('msg');
  m.textContent=texto;
  m.className='msg '+(ok?'ok':'err');
  setTimeout(()=>m.className='msg',4000);
}

async function loginGoogle(){
  const button=$('loginBtn');
  const message=$('loginMsg');
  button.disabled=true;
  button.textContent='Conectando con Google...';
  message.textContent='';
  const redirectTo=window.location.origin+window.location.pathname;
  const result=await s.auth.signInWithOAuth({provider:'google',options:{redirectTo}});
  if(result.error){
    button.disabled=false;
    button.textContent='🔐 Acceder con Google';
    message.textContent='Error al iniciar sesión: '+result.error.message;
  }
}

async function salir(){
  await s.auth.signOut();
  location.href=window.location.origin+window.location.pathname;
}

function tarjeta(n){
  const tipo=n.tipo_negocio||'barberia';
  const q=encodeURIComponent(n.id);
  const extra=['cosmetologia','depilacion_laser','lashes_nails'].includes(tipo)?'&rubro='+encodeURIComponent(tipo):'';
  const pub=(PUBLICAS[tipo]||PUBLICAS.barberia)+'?negocio='+q+extra;
  const adm=(ADMINS[tipo]||ADMINS.barberia)+'?negocio='+q+extra;
  const vinculado=!!n.dueño_id;
  return '<div class="negocio"><strong>'+ (LABELS[tipo]||tipo) +' — '+esc(n.nombre)+'</strong>'+
    '<div class="meta">ID: '+esc(n.id)+'<br>Email dueño: '+esc(n.dueño_email||'sin asignar')+'</div>'+
    '<div class="estado '+(vinculado?'ok':'pendiente')+'">'+(vinculado?'✓ Dueño vinculado':'⏳ Esperando ingreso del dueño')+'</div>'+
    '<div class="acciones"><a class="btn" href="'+pub+'" target="_blank" rel="noopener">🌐 Página</a><a class="btn sec" href="'+adm+'" target="_blank" rel="noopener">⚙️ Acceder al Admin</a></div></div>';
}

async function cargarNegocios(){
  const result=await s.from('negocios').select('id,nombre,dueño_id,dueño_email,telefono,tipo_negocio,created_at').order('created_at',{ascending:false});
  if(result.error){$('lista').textContent='No se pudieron cargar: '+result.error.message;return;}
  $('lista').innerHTML=result.data?.length?result.data.map(tarjeta).join(''):'Todavía no hay negocios.';
}

async function iniciar(){
  const sessionResult=await s.auth.getSession();
  const session=sessionResult.data.session;
  if(!session){$('login').style.display='flex';$('app').style.display='none';return;}
  const adminResult=await s.rpc('es_lmv_studio_admin');
  if(adminResult.error||!adminResult.data){
    $('login').innerHTML='<div class="loginbox"><h1>Acceso denegado</h1><p>Esta cuenta de Google no está autorizada como administrador de LMV Studio.</p></div>';
    return;
  }
  $('login').style.display='none';
  $('app').style.display='block';
  $('userInfo').textContent=session.user.email||session.user.id;
  await cargarNegocios();
}

$('loginBtn').addEventListener('click',loginGoogle);
$('logoutBtn').addEventListener('click',salir);
$('form').addEventListener('submit',async event=>{
  event.preventDefault();
  const email=$('duenoEmail').value.trim().toLowerCase();
  const tipo=$('tipo').value;
  const payload={
    nombre:$('nombre').value.trim(),
    telefono:$('telefono').value.trim()||null,
    'dirección':$('direccion').value.trim()||null,
    instagram:$('instagram').value.trim()||null,
    dueño_id:null,
    dueño_email:email,
    tipo_negocio:tipo
  };
  const result=await s.from('negocios').insert(payload).select('id,nombre,tipo_negocio,dueño_email,dueño_id').single();
  if(result.error){mostrarMsg('No se pudo crear: '+result.error.message);return;}
  const extra=['cosmetologia','depilacion_laser','lashes_nails'].includes(tipo)?'&rubro='+encodeURIComponent(tipo):'';
  $('entrega').innerHTML='<b>Negocio creado.</b><br>Admin: '+esc(ADMINS[tipo]+'?negocio='+encodeURIComponent(result.data.id)+extra)+'<br>Página: '+esc(PUBLICAS[tipo]+'?negocio='+encodeURIComponent(result.data.id)+extra);
  mostrarMsg('Negocio creado correctamente.',true);
  event.target.reset();
  await cargarNegocios();
});
s.auth.onAuthStateChange(()=>setTimeout(iniciar,0));
iniciar();
</script>
</body>
</html>
