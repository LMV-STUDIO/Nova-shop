<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LMV Studio — Multirubro</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background:#090909;color:#fff}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;padding-bottom:18px;margin-bottom:22px}.brand{color:#d4af37;font-size:24px;font-weight:800}.user{color:#aaa;font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:20px}.card h2{margin:0 0 16px}.campo{margin-bottom:13px}.campo label{display:block;color:#ddd;font-size:13px;font-weight:700;margin-bottom:6px}.campo input,.campo select{width:100%;padding:11px;border-radius:8px;border:1px solid #333;background:#0d0d0d;color:#fff;box-sizing:border-box}.btn{display:inline-block;border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer;background:#d4af37;color:#111;text-decoration:none}.btn.sec{background:#252525;color:#fff;border:1px solid #333}.btn.salir{background:#321515;color:#ff9999}.lista{display:grid;gap:10px}.negocio{border:1px solid #292929;border-radius:10px;padding:14px}.negocio strong{display:block;margin-bottom:5px}.meta{font-size:12px;color:#aaa;margin-bottom:10px;word-break:break-all}.acciones{display:flex;gap:8px;flex-wrap:wrap}.msg{display:none;padding:11px;border-radius:8px;margin-bottom:15px}.msg.ok{display:block;background:#142514;color:#8be58b}.msg.err{display:block;background:#241212;color:#ff9999}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{max-width:430px;width:100%;text-align:center;background:#151515;border:1px solid #292929;border-radius:15px;padding:30px}.loginbox h1{color:#d4af37}@media(max-width:750px){.wrap{padding:15px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column;gap:15px}.acciones{display:grid;grid-template-columns:1fr 1fr}.acciones .btn{text-align:center}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><h1>LMV STUDIO</h1><p>Panel central multirubro</p><button class="btn" onclick="loginGoogle()">🔐 Entrar con Google</button></div></div>
<div id="app" style="display:none"><div class="wrap"><div class="top"><div><div class="brand">LMV STUDIO</div><div class="user" id="userInfo"></div></div><button class="btn salir" onclick="salir()">Cerrar sesión</button></div><div id="msg" class="msg"></div><div class="grid"><section class="card"><h2>➕ Crear negocio</h2><form id="form"><div class="campo"><label>Tipo de negocio</label><select id="tipo" required><option value="barberia">💈 Barbería</option><option value="comida">🍔 Comida</option><option value="ropa">👕 Tienda de ropa</option></select></div><div class="campo"><label>Nombre</label><input id="nombre" required placeholder="Nombre del negocio"></div><div class="campo"><label>Teléfono</label><input id="telefono"></div><div class="campo"><label>Dirección</label><input id="direccion"></div><div class="campo"><label>Instagram</label><input id="instagram"></div><div class="campo"><label>Correo Google del dueño</label><input id="duenoEmail" type="email" required></div><button class="btn" type="submit">Crear negocio</button></form></section><section class="card"><h2>🏪 Negocios</h2><div id="lista" class="lista">Cargando...</div></section></div></div></div>
<script>
const SUPABASE_URL='https://cqelidpshitntewsktwx.supabase.co';const SUPABASE_KEY='sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD';const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);const MI_ID='61237a18-0393-4308-98ba-a9891f1d5582';const PUBLICAS={barberia:'https://lmv-studio.github.io/Nova-shop/barberia.html',comida:'https://lmv-studio.github.io/Nova-shop/comida.html',ropa:'https://lmv-studio.github.io/Nova-shop/ropa.html'};const ADMINS={barberia:'https://lmv-studio.github.io/Nova-shop/admin.barberia_reutilizable.html',comida:'https://lmv-studio.github.io/Nova-shop/admin.comida.html',ropa:'https://lmv-studio.github.io/Nova-shop/admin.ropa.html'};
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function mostrarMsg(t,ok=false){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');setTimeout(()=>m.className='msg',4000)}async function loginGoogle(){const{error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)mostrarMsg(error.message)}async function salir(){await supabaseClient.auth.signOut();location.reload()}
function tipoTexto(t){return t==='comida'?'🍔 Comida':t==='ropa'?'👕 Tienda de ropa':'💈 Barbería'}function tarjeta(n){const tipo=n.tipo_negocio||n.tipo||'barberia';const q=encodeURIComponent(n.id);return `<div class="negocio"><strong>${tipoTexto(tipo)} — ${esc(n.nombre)}</strong><div class="meta">ID: ${esc(n.id)}<br>Dueño: ${esc(n.dueño_email||'pendiente')}</div><div class="acciones"><a class="btn" href="${PUBLICAS[tipo]||PUBLICAS.barberia}?negocio=${q}" target="_blank">🌐 Página</a><a class="btn sec" href="${ADMINS[tipo]||ADMINS.barberia}?negocio=${q}" target="_blank">⚙️ Administración</a></div></div>`}
async function cargarNegocios(){const{data,error}=await supabaseClient.from('negocios').select('id,nombre,dueño_id,dueño_email,telefono,tipo_negocio').order('created_at',{ascending:false});const l=document.getElementById('lista');if(error){l.textContent='No se pudieron cargar: '+error.message;return}if(!data?.length){l.textContent='Todavía no hay negocios.';return}l.innerHTML=data.map(tarjeta).join('')}
async function iniciar(){const{data:{session}}=await supabaseClient.auth.getSession();if(!session){document.getElementById('login').style.display='flex';return}if(session.user.id!==MI_ID){document.getElementById('login').innerHTML='<div class="loginbox"><h1>Acceso denegado</h1><p>Este panel es privado de LMV Studio.</p><button class="btn" onclick="salir()">Salir</button></div>';return}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('userInfo').textContent=session.user.email||session.user.id;await cargarNegocios()}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const payload={nombre:document.getElementById('nombre').value.trim(),telefono:document.getElementById('telefono').value.trim()||null,'dirección':document.getElementById('direccion').value.trim()||null,instagram:document.getElementById('instagram').value.trim()||null,dueño_id:null,dueño_email:document.getElementById('duenoEmail').value.trim().toLowerCase(),tipo_negocio:document.getElementById('tipo').value};const{error}=await supabaseClient.from('negocios').insert(payload);if(error){mostrarMsg('No se pudo crear: '+error.message);return}mostrarMsg('Negocio creado correctamente.',true);e.target.reset();await cargarNegocios()});supabaseClient.auth.onAuthStateChange(()=>iniciar());iniciar();
</script>
</body>
</html>
