<!DOCTYPE html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LMV Studio — Administración</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;background:#090909;color:#fff}.wrap{max-width:1200px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;padding-bottom:16px;margin-bottom:20px}.brand{color:#d4af37;font-size:24px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:20px}.campo{margin-bottom:12px}.campo label{display:block;color:#bbb;font-size:13px;font-weight:700;margin-bottom:5px}.campo input,.campo select{width:100%;padding:11px;border-radius:8px;border:1px solid #333;background:#0d0d0d;color:#fff;box-sizing:border-box}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer;background:#d4af37;color:#111}.btn.sec{background:#252525;color:#fff}.lista{display:grid;gap:9px}.item{border:1px solid #292929;border-radius:10px;padding:12px}.muted{color:#aaa;font-size:13px}.danger{background:#321515;color:#ff9999}.msg{padding:10px;border-radius:8px;margin-bottom:15px;background:#142514;color:#8be58b}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:18px}.tabs button.active{background:#d4af37;color:#111}.hidden{display:none}@media(max-width:750px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column;gap:10px}}</style></head>
<body><div class="wrap"><div class="top"><div><div class="brand">LMV STUDIO</div><div id="negocioNombre" class="muted">Cargando negocio...</div></div><button class="btn danger" onclick="salir()">Cerrar sesión</button></div><div id="msg" class="msg hidden"></div><div class="tabs"><button class="btn active" data-tab="productos">📦 Productos</button><button class="btn sec" data-tab="categorias">🏷️ Categorías</button><button class="btn sec" data-tab="variantes">🎨 Variantes</button><button class="btn sec" data-tab="pedidos">🛒 Pedidos</button></div>
<section id="productos" class="tab"><div class="grid"><div class="card"><h2>Nuevo producto</h2><form id="productoForm"><div class="campo"><label>Nombre</label><input id="pNombre" required></div><div class="campo"><label>Categoría</label><input id="pCategoria" placeholder="Ej. Remeras"></div><div class="campo"><label>Precio</label><input id="pPrecio" type="number" min="0" step="0.01" required></div><div class="campo"><label>Stock</label><input id="pStock" type="number" min="0" value="0"></div><div class="campo"><label>Imagen URL</label><input id="pImagen" type="url"></div><div class="campo"><label>Descripción</label><input id="pDescripcion"></div><button class="btn">Guardar producto</button></form></div><div class="card"><h2>Productos</h2><div id="productosLista" class="lista"></div></div></div></section>
<section id="categorias" class="tab hidden"><div class="grid"><div class="card"><h2>Nueva categoría</h2><form id="categoriaForm"><div class="campo"><label>Nombre</label><input id="cNombre" required></div><button class="btn">Crear categoría</button></form></div><div class="card"><h2>Categorías</h2><div id="categoriasLista" class="lista"></div></div></div></section>
<section id="variantes" class="tab hidden"><div class="grid"><div class="card"><h2>Nueva variante</h2><form id="varianteForm"><div class="campo"><label>Producto</label><select id="vProducto"></select></div><div class="campo"><label>Nombre</label><input id="vNombre" required placeholder="Ej. Remera básica M negra"></div><div class="campo"><label>Talle</label><input id="vTalle"></div><div class="campo"><label>Color</label><input id="vColor"></div><div class="campo"><label>Stock</label><input id="vStock" type="number" min="0" value="0"></div><div class="campo"><label>Precio opcional</label><input id="vPrecio" type="number" min="0" step="0.01"></div><button class="btn">Guardar variante</button></form></div><div class="card"><h2>Variantes</h2><div id="variantesLista" class="lista"></div></div></div></section>
<section id="pedidos" class="tab hidden"><div class="card"><h2>Pedidos</h2><div id="pedidosLista" class="lista"></div></div></section></div>
<script>const URL='https://cqelidpshitntewsktwx.supabase.co',KEY='sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD',sb=window.supabase.createClient(URL,KEY),id=new URLSearchParams(location.search).get('negocio');let negocio=null,productos=[];function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}function msg(t){const e=document.getElementById('msg');e.textContent=t;e.classList.remove('hidden');setTimeout(()=>e.classList.add('hidden'),3500)}async function salir(){await sb.auth.signOut();location.href='lmv-studio.html'}async function init(){const{data:{session}}=await sb.auth.getSession();if(!session){location.href='lmv-studio.html';return}const r=await sb.from('negocios').select('*').eq('id',id).eq('dueño_id',session.user.id).single();if(r.error){document.body.innerHTML='<div class="wrap"><h2>Acceso no autorizado</h2><p>Este negocio no pertenece al usuario conectado.</p></div>';return}negocio=r.data;document.getElementById('negocioNombre').textContent=negocio.nombre+' · '+(negocio.tipo_negocio||'negocio');if(negocio.tipo_negocio==='barberia'){location.href='admin.barberia_reutilizable.html?negocio='+encodeURIComponent(id);return}await cargarTodo()}async function cargarTodo(){await Promise.all([cargarProductos(),cargarCategorias(),cargarVariantes(),cargarPedidos()])}async function cargarProductos(){const r=await sb.from('productos').select('*').eq('negocio_id',id).order('created_at',{ascending:false});productos=r.data||[];document.getElementById('productosLista').innerHTML=productos.map(p=>`<div class="item"><strong>${esc(p.nombre)}</strong><div class="muted">${esc(p.categoria||'Sin categoría')} · $${Number(p.precio||0).toLocaleString('es-AR')} · stock ${p.stock??0}</div><div>${esc(p.descripcion||'')}</div></div>`).join('')||'<div class="muted">Todavía no hay productos.</div>';const s=document.getElementById('vProducto');s.innerHTML=productos.map(p=>`<option value="${p.id}">${esc(p.nombre)}</option>`).join('')}async function cargarCategorias(){const r=await sb.from('categorias_producto').select('*').eq('negocio_id',id).order('nombre');document.getElementById('categoriasLista').innerHTML=(r.data||[]).map(c=>`<div class="item">${esc(c.nombre)}</div>`).join('')||'<div class="muted">Sin categorías.</div>'}async function cargarVariantes(){const r=await sb.from('producto_variantes').select('*').order('created_at',{ascending:false});document.getElementById('variantesLista').innerHTML=(r.data||[]).filter(v=>productos.some(p=>p.id===v.producto_id)).map(v=>`<div class="item"><strong>${esc(v.nombre)}</strong><div class="muted">${esc(v.talle||'')} ${esc(v.color||'')} · stock ${v.stock}</div></div>`).join('')||'<div class="muted">Sin variantes.</div>'}async function cargarPedidos(){const r=await sb.from('pedidos').select('*').eq('negocio_id',id).order('created_at',{ascending:false});document.getElementById('pedidosLista').innerHTML=(r.data||[]).map(p=>`<div class="item"><strong>#${p.id} · ${esc(p.cliente||'Cliente')}</strong><div class="muted">${esc(p.estado||'pendiente')} · $${Number(p.total||0).toLocaleString('es-AR')} · ${new Date(p.created_at).toLocaleString('es-AR')}</div><button class="btn sec" onclick="estadoPedido(${p.id},'preparando')">Preparando</button> <button class="btn" onclick="estadoPedido(${p.id},'listo')">Listo</button> <button class="btn danger" onclick="estadoPedido(${p.id},'cancelado')">Cancelar</button></div>`).join('')||'<div class="muted">No hay pedidos.</div>'}async function estadoPedido(pid,estado){const r=await sb.from('pedidos').update({estado}).eq('id',pid).eq('negocio_id',id);if(r.error)msg(r.error.message);else{msg('Pedido actualizado');cargarPedidos()}}document.getElementById('productoForm').onsubmit=async e=>{e.preventDefault();const r=await sb.from('productos').insert({negocio_id:id,nombre:pNombre.value.trim(),categoria:pCategoria.value.trim()||null,precio:Number(pPrecio.value),stock:Number(pStock.value||0),imagen:pImagen.value.trim()||null,descripcion:pDescripcion.value.trim()||null,activo:true});if(r.error)msg(r.error.message);else{e.target.reset();msg('Producto guardado');cargarProductos()}};document.getElementById('categoriaForm').onsubmit=async e=>{e.preventDefault();const r=await sb.from('categorias_producto').insert({negocio_id:id,nombre:cNombre.value.trim(),activo:true});if(r.error)msg(r.error.message);else{e.target.reset();msg('Categoría creada');cargarCategorias()}};document.getElementById('varianteForm').onsubmit=async e=>{e.preventDefault();const r=await sb.from('producto_variantes').insert({producto_id:Number(vProducto.value),nombre:vNombre.value.trim(),talle:vTalle.value.trim()||null,color:vColor.value.trim()||null,stock:Number(vStock.value||0),precio:vPrecio.value?Number(vPrecio.value):null,activo:true});if(r.error)msg(r.error.message);else{e.target.reset();msg('Variante guardada');cargarVariantes()}};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.tab').forEach(x=>x.classList.add('hidden'));document.getElementById(b.dataset.tab).classList.remove('hidden')});init();</script></body></html>
