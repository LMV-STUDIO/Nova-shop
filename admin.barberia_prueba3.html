<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Barbería Prueba 3</title><style>@media(max-width:600px){.p3-add{margin:12px 0;padding:14px;border:1px solid #292929;border-radius:12px;background:#121212}.p3-add-row{display:flex;gap:8px;align-items:center}.p3-add input{flex:1;min-width:0;padding:12px;border-radius:8px;border:1px solid #333;background:#0b0b0b;color:#fff;font-size:15px}.p3-add button{padding:12px 14px;border:0;border-radius:8px;cursor:pointer;font-weight:700;white-space:nowrap}}@media(max-width:430px){.p3-add-row{display:grid;grid-template-columns:1fr}.p3-add button{width:100%}}</style></head><body><div style="font-family:Arial;background:#090909;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">Cargando panel...</div><script>(async()=>{try{let html=await(await fetch('./admin.barberia_reutilizable.html'+location.search,{cache:'no-store'})).text();html=html.replaceAll('admin.barberia_reutilizable.html','admin.barberia_prueba3.html');html=html.replace(/<p\s+style="\s*color:var\(--gris\);\s*font-size:13px;\s*margin-bottom:20px;\s*">\s*Estos horarios son los que utiliza la agenda para mostrar\s*los turnos disponibles\.\s*<\/p>/,'');const addHtml='<div class="p3-add" id="p3-add"><div style="font-weight:700;margin-bottom:8px">Agregar barbero</div><div class="p3-add-row"><input id="p3-name" type="text" maxlength="80" placeholder="Nombre del barbero"><button type="button" id="p3-add-btn">+ Agregar</button></div><div id="p3-msg" style="font-size:12px;margin-top:7px;min-height:16px"></div></div>';html=html.replace(/(<h[1-6][^>]*>\s*Horarios por barbero\s*<\/h[1-6]>)/i,addHtml+'$1');const js='<script>(function(){function cfg(){const s=document.documentElement.innerHTML;const m=s.match(/https:\\/\\/([A-Za-z0-9.-]+)\\.supabase\\.co/);const k=s.match(/eyJ[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+/);return m&&k?{url:"https://"+m[1]+".supabase.co",key:k[0]}:null}async function add(){const i=document.getElementById("p3-name"),msg=document.getElementById("p3-msg"),nombre=(i.value||"").trim();if(!nombre){msg.textContent="Escribí el nombre del barbero.";return}const c=cfg();if(!c){msg.textContent="No se pudo detectar Supabase.";return}try{const client=window.supabase.createClient(c.url,c.key),r=await client.auth.getSession();if(!r.data.session){msg.textContent="Iniciá sesión primero.";return}const negocio=new URLSearchParams(location.search).get("negocio");if(!negocio)throw new Error("Falta el negocio en la URL.");const x=await client.from("barberos").insert({negocio_id:negocio,nombre:nombre,activo:true});if(x.error)throw x.error;msg.textContent="Barbero agregado correctamente.";i.value="";setTimeout(()=>location.reload(),600)}catch(e){msg.textContent="No se pudo agregar: "+(e.message||e)}}function init(){const b=document.getElementById("p3-add-btn"),i=document.getElementById("p3-name");if(!b)return;b.onclick=add;i.addEventListener("keydown",e=>{if(e.key==="Enter")add()})}setTimeout(init,300)})();<\/script>';html=html.replace('</body>',js+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="color:red">No se pudo cargar el panel: '+String(e)+'</pre>'}})();</script></body></html>
