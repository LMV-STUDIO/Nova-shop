<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Barbería Prueba 3</title><style>
.p3-add{margin:0 0 18px;padding:16px;border:1px solid #303030;border-radius:16px;background:linear-gradient(135deg,#181818,#0f0f0f);box-shadow:0 8px 24px rgba(0,0,0,.18)}
.p3-add-title{display:flex;align-items:center;gap:8px;color:#fff;font-weight:800;font-size:15px;margin-bottom:10px}.p3-add-title span{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:9px;background:#242424;border:1px solid #363636}
.p3-add-row{display:flex;gap:9px}.p3-add input{flex:1;min-width:0;background:#0b0b0b!important;color:#fff!important;border:1px solid #353535!important;border-radius:10px!important;padding:12px 13px!important;outline:none}.p3-add input:focus{border-color:#777!important;box-shadow:0 0 0 3px rgba(255,255,255,.04)}.p3-add button{border:1px solid #444;border-radius:10px;background:#252525;color:#fff;padding:0 17px;font-weight:800;cursor:pointer;transition:.15s}.p3-add button:hover{background:#303030;transform:translateY(-1px)}.p3-add-msg{min-height:16px;margin-top:7px;font-size:12px;color:#aaa}
#agenda-navegacion{display:flex!important;align-items:center;justify-content:center;gap:5px;width:max-content;padding:4px!important;margin-top:8px!important;border:1px solid #303030!important;border-radius:12px!important;background:#111!important;box-shadow:0 6px 18px rgba(0,0,0,.16)}#agenda-navegacion button{height:36px!important;min-width:38px!important;padding:0 11px!important;border:1px solid #353535!important;border-radius:9px!important;background:#1a1a1a!important;color:#ddd!important;font-weight:800!important;cursor:pointer!important}#agenda-navegacion button:hover{background:#292929!important;color:#fff!important;border-color:#555!important}.agenda-nav-btn{font-size:18px!important}.agenda-nav-hoy{min-width:58px!important;color:#fff!important}
#agendaFecha{background:#0d0d0d!important;color:#fff!important;border:1px solid #353535!important;border-radius:10px!important;padding:11px 12px!important}
@media(max-width:750px){.p3-add{padding:14px;border-radius:14px}.p3-add-row{display:grid;grid-template-columns:1fr 105px}.p3-add button{padding:0 10px}.p3-add-title{font-size:14px}#agenda-navegacion{width:100%!important}.agenda-nav-btn{flex:1}.agenda-nav-hoy{flex:1!important;min-width:0!important}}
@media(max-width:430px){.p3-add-row{grid-template-columns:1fr}.p3-add button{height:42px;margin-top:2px}#agenda-navegacion button{height:34px!important}}
</style></head><body><div style="font-family:Arial;background:#090909;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">Cargando panel...</div><script>(async()=>{try{let html=await(await fetch('./admin.barberia_reutilizable.html'+location.search,{cache:'no-store'})).text();html=html.replaceAll('admin.barberia_reutilizable.html','admin.barberia_prueba3.html');const injected=`<script>(function(){function instalar(){if(document.getElementById('p3-add'))return;const tabla=document.getElementById('tablaBarberos');if(!tabla)return;const alvo=tabla.closest('.tabla-wrapper')||tabla.parentElement;if(!alvo)return;const box=document.createElement('div');box.className='p3-add';box.id='p3-add';box.innerHTML='<div class="p3-add-title"><span>👤</span>Agregar barbero</div><div class="p3-add-row"><input id="p3-name" maxlength="80" placeholder="Nombre del barbero"><button type="button" id="p3-add-btn">+ Agregar</button></div><div class="p3-add-msg" id="p3-add-msg"></div>';alvo.parentNode.insertBefore(box,alvo);const btn=document.getElementById('p3-add-btn'),input=document.getElementById('p3-name'),msg=document.getElementById('p3-add-msg');async function agregar(){const nombre=input.value.trim();if(!nombre){msg.textContent='Escribí el nombre del barbero.';return}if(typeof supabaseClient==='undefined'){msg.textContent='Supabase todavía no está disponible.';return}const negocio=new URLSearchParams(location.search).get('negocio');if(!negocio){msg.textContent='Falta el negocio en la URL.';return}btn.disabled=true;msg.textContent='Agregando...';const {error}=await supabaseClient.from('barberos').insert({negocio_id:negocio,nombre,activo:true});if(error){msg.textContent='No se pudo agregar: '+error.message;btn.disabled=false;return}msg.textContent='Barbero agregado correctamente.';input.value='';btn.disabled=false;if(typeof cargarBarberos==='function')await cargarBarberos();if(typeof cargarHorariosBarberos==='function')await cargarHorariosBarberos()}btn.onclick=agregar;input.addEventListener('keydown',e=>{if(e.key==='Enter')agregar()})}function init(){instalar();setTimeout(instalar,300);setTimeout(instalar,1000)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();new MutationObserver(instalar).observe(document.body,{childList:true,subtree:true})})();<\/script>`;html=html.replace('</body>',injected+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="color:red">No se pudo cargar el panel: '+String(e)+'</pre>'}})();</script></body></html>
