<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Barbería Prueba 3</title><style>
.p3-add{margin:14px 0 20px;padding:16px 18px;border:1px solid #292929;border-radius:16px;background:linear-gradient(135deg,#171717 0%,#101010 100%);box-shadow:0 8px 24px rgba(0,0,0,.16)}
.p3-add>div:first-child{font-size:15px;font-weight:800;color:#fff;margin-bottom:10px;display:flex;align-items:center;gap:8px}.p3-add>div:first-child:before{content:'👤';font-size:15px}
.p3-add-row{display:flex;gap:9px;align-items:center}.p3-add input{flex:1;min-width:0;padding:12px 13px;border-radius:10px;border:1px solid #333;background:#0b0b0b;color:#fff;font-size:14px;outline:none;transition:.15s}.p3-add input:focus{border-color:#777;box-shadow:0 0 0 3px rgba(255,255,255,.04)}.p3-add input::placeholder{color:#777}.p3-add button{padding:12px 16px;border:1px solid #3a3a3a;border-radius:10px;cursor:pointer;font-weight:800;white-space:nowrap;background:#242424;color:#fff;transition:.15s}.p3-add button:hover{background:#303030;border-color:#555;transform:translateY(-1px)}
#agenda-navegacion{display:flex!important;align-items:center;justify-content:center;gap:6px;margin-top:9px;padding:4px;border:1px solid #292929;border-radius:12px;background:#111;width:max-content;box-shadow:0 5px 18px rgba(0,0,0,.15)}#agenda-navegacion button{font-family:inherit;cursor:pointer;border:1px solid #303030!important;border-radius:9px!important;background:#181818!important;color:#ddd!important;height:36px;min-width:38px;padding:0 12px;font-weight:800;font-size:13px;transition:.15s}#agenda-navegacion button:hover{background:#242424!important;border-color:#555!important;color:#fff!important;transform:translateY(-1px)}#agenda-navegacion .agenda-nav-hoy{min-width:58px!important;color:#fff!important}#agenda-navegacion .agenda-nav-btn{font-size:18px!important;padding:0 10px!important}#agendaFecha{background:#0d0d0d!important;color:#fff!important;border:1px solid #333!important;border-radius:10px!important;padding:11px 12px!important;outline:none}#agendaFecha:focus{border-color:#666!important}
#horariosBarberos{display:grid;gap:16px}#horariosBarberos>.card{margin:0;padding:18px;border:1px solid #292929;border-radius:16px;background:linear-gradient(180deg,#151515 0%,#101010 100%);box-shadow:0 8px 24px rgba(0,0,0,.18)}#horariosBarberos>.card h3{margin:0 0 16px;font-size:18px;display:flex;align-items:center;gap:8px}#horariosBarberos>.card>div[style*="grid-template-columns"]{grid-template-columns:minmax(95px,1fr) minmax(105px,1fr) minmax(105px,1fr) auto!important;gap:8px!important;margin-bottom:8px!important;padding:9px 10px;border:1px solid #252525;border-radius:12px;background:#0c0c0c}#horariosBarberos>.card>div[style*="grid-template-columns"]>strong{font-size:13px;color:#eee}#horariosBarberos input[type="time"]{box-sizing:border-box!important;padding:9px 8px!important;border:1px solid #303030!important;border-radius:9px!important;background:#171717!important;color:#fff!important;font-size:13px!important;min-width:0!important}#horariosBarberos input[type="time"]:focus{outline:none;border-color:#666!important;box-shadow:0 0 0 2px rgba(255,255,255,.05)}#horariosBarberos label{height:36px;padding:0 10px!important;border:1px solid #333;border-radius:9px;background:#181818;color:#999!important;display:flex!important;justify-content:center;align-items:center;gap:6px!important;cursor:pointer;white-space:nowrap;transition:.15s}#horariosBarberos label input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:30px;height:17px;border-radius:999px;background:#3a3a3a;position:relative;margin:0;cursor:pointer;transition:.18s}#horariosBarberos label input[type="checkbox"]:before{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:#aaa;transition:.18s}#horariosBarberos label:has(input[type="checkbox"]:checked){border-color:#396b4a;background:#122218;color:#b7e8c6!important}#horariosBarberos label input[type="checkbox"]:checked{background:#2d8a4b}#horariosBarberos label input[type="checkbox"]:checked:before{left:15px;background:#fff}#horariosBarberos>.card>.btn{margin-top:8px;width:100%;border-radius:10px;padding:11px;font-weight:700}
@media(max-width:750px){.p3-add{margin:12px 0;padding:14px;border-radius:14px}.p3-add-row{display:flex;gap:8px}.p3-add input{padding:11px;font-size:14px}.p3-add button{padding:11px 13px}.p3-add>div:first-child{font-size:14px}#agenda-navegacion{margin-top:8px;gap:5px}#agenda-navegacion button{height:34px;min-width:36px;padding:0 10px}.agenda-fecha{min-width:0!important;width:100%}#horariosBarberos{gap:12px}#horariosBarberos>.card{padding:13px;border-radius:14px}#horariosBarberos>.card h3{font-size:16px;margin-bottom:10px}#horariosBarberos>.card>div[style*="grid-template-columns"]{grid-template-columns:1fr auto!important;grid-template-areas:"dia atiende" "inicio fin"!important;align-items:center!important;padding:9px!important;gap:7px!important}#horariosBarberos>.card>div[style*="grid-template-columns"]>strong{grid-area:dia}#horariosBarberos>.card>div[style*="grid-template-columns"]>input[type="time"]:first-of-type{grid-area:inicio}#horariosBarberos>.card>div[style*="grid-template-columns"]>input[type="time"]:last-of-type{grid-area:fin}#horariosBarberos>.card>div[style*="grid-template-columns"]>label{grid-area:atiende;font-size:11px;padding:0 7px!important}#horariosBarberos>.card>.btn{margin-top:5px}}
@media(max-width:430px){.p3-add-row{display:grid;grid-template-columns:1fr}.p3-add button{width:100%}#agenda-navegacion{width:100%;justify-content:stretch}#agenda-navegacion button{flex:1}#agenda-navegacion .agenda-nav-hoy{min-width:0!important}#horariosBarberos>.card>div[style*="grid-template-columns"]{grid-template-columns:1fr auto!important}#horariosBarberos>.card>div[style*="grid-template-columns"]>input[type="time"]{font-size:12px!important}}
</style></head><body><div style="font-family:Arial;background:#090909;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">Cargando panel...</div><script>(async()=>{try{let html=await(await fetch('./admin.barberia_reutilizable.html'+location.search,{cache:'no-store'})).text();html=html.replaceAll('admin.barberia_reutilizable.html','admin.barberia_prueba3.html');html=html.replace(/<p\s+style="\s*color:var\(--gris\);\s*font-size:13px;\s*margin-bottom:20px;\s*">\s*Estos horarios son los que utiliza la agenda para mostrar\s*los turnos disponibles\.\s*<\/p>/,'');const addHtml='<div class="p3-add" id="p3-add"><div>Agregar barbero</div><div class="p3-add-row"><input id="p3-name" type="text" maxlength="80" placeholder="Nombre del barbero"><button type="button" id="p3-add-btn">+ Agregar</button></div><div id="p3-msg" style="font-size:12px;margin-top:7px;min-height:16px"></div></div>';html=html.replace(/(<h[1-6][^>]*>\s*Horarios por barbero\s*<\/h[1-6]>)/i,addHtml+'$1');const js='<script>(function(){function cfg(){const s=document.documentElement.innerHTML;const m=s.match(/https:\\/\\/([A-Za-z0-9.-]+)\\.supabase\\.co/);const k=s.match(/eyJ[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+/);return m&&k?{url:"https://"+m[1]+".supabase.co",key:k[0]}:null}async function add(){const i=document.getElementById("p3-name"),msg=document.getElementById("p3-msg"),nombre=(i.value||"").trim();if(!nombre){msg.textContent="Escribí el nombre del barbero.";return}const c=cfg();if(!c){msg.textContent="No se pudo detectar Supabase.";return}try{const client=window.supabase.createClient(c.url,c.key),r=await client.auth.getSession();if(!r.data.session){msg.textContent="Iniciá sesión primero.";return}const negocio=new URLSearchParams(location.search).get("negocio");if(!negocio)throw new Error("Falta el negocio en la URL.");const x=await client.from("barberos").insert({negocio_id:negocio,nombre:nombre,activo:true});if(x.error)throw x.error;msg.textContent="Barbero agregado correctamente.";i.value="";setTimeout(()=>location.reload(),600)}catch(e){msg.textContent="No se pudo agregar: "+(e.message||e)}}function init(){const b=document.getElementById("p3-add-btn"),i=document.getElementById("p3-name");if(!b)return;b.onclick=add;i.addEventListener("keydown",e=>{if(e.key==="Enter")add()})}setTimeout(init,300)})();<\/script>';html=html.replace('</body>',js+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="color:red">No se pudo cargar el panel: '+String(e)+'</pre>'}})();</script></body></html>
