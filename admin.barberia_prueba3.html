<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Barbería Prueba 3</title>
</head>
<body>
<div style="font-family:Arial;background:#090909;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">Cargando panel...</div>
<script>
(async()=>{
  try {
    const url='./admin.barberia_reutilizable.html'+location.search;
    let html=await (await fetch(url,{cache:'no-store'})).text();

    html=html.replaceAll('admin.barberia_reutilizable.html','admin.barberia_prueba3.html');

    const css=`<style id="prueba3-barberos-compacto">
@media(max-width:750px){
#seccion-barberos .card{padding:14px!important;margin-bottom:12px!important;border-radius:12px!important}
#seccion-barberos .card h3{font-size:17px!important;margin-bottom:12px!important}
#seccion-barberos #horariosBarberos>.card{background:#141414!important}
#seccion-barberos #horariosBarberos>.card>div[style*="display:grid"]{grid-template-columns:72px minmax(0,1fr) minmax(0,1fr) 54px!important;gap:6px!important;margin-bottom:7px!important;padding:6px 0!important;border-bottom:1px solid #242424}
#seccion-barberos #horariosBarberos>.card>div[style*="display:grid"]>strong{font-size:11px!important;color:#ddd!important;line-height:1.1!important}
#seccion-barberos #horariosBarberos input[type="time"]{min-width:0!important;padding:8px 5px!important;font-size:12px!important;height:36px!important}
#seccion-barberos #horariosBarberos label{justify-content:center!important;font-size:0!important;white-space:nowrap!important}
#seccion-barberos #horariosBarberos label input[type="checkbox"]{width:18px!important;height:18px!important;margin:0!important;accent-color:#d4af37}
#seccion-barberos #horariosBarberos .btn{width:100%!important;min-height:42px!important;margin-top:8px!important}
.prueba3-addbarbero{display:flex;gap:8px;align-items:end;margin-bottom:14px}
.prueba3-addbarbero input{width:100%;padding:11px;border-radius:7px;border:1px solid #333;background:#0d0d0d;color:#fff}
.prueba3-addbarbero button{white-space:nowrap}
}
@media(max-width:480px){
.prueba3-addbarbero{display:grid;grid-template-columns:1fr;gap:8px}
.prueba3-addbarbero button{width:100%;min-height:42px}
}
@media(max-width:390px){
#seccion-barberos #horariosBarberos>.card>div[style*="display:grid"]{grid-template-columns:62px minmax(0,1fr) minmax(0,1fr) 44px!important;gap:5px!important}
#seccion-barberos #horariosBarberos>.card>div[style*="display:grid"]>strong{font-size:10px!important}
}
</style>`;

    html=html.replace('</head>',css+'</head>');
    html=html.replace(/<p\s+style="\s*color:var\(--gris\);\s*font-size:13px;\s*margin-bottom:20px;\s*">\s*Estos horarios son los que utiliza la agenda para mostrar\s*los turnos disponibles\.\s*<\/p>/,'');

    const js=`
(()=>{
  function findSection(){
    return document.getElementById('seccion-barberos') || [...document.querySelectorAll('.seccion-admin')].find(x=>/barberos/i.test(x.innerText));
  }

  function getConfig(){
    const scripts=[...document.scripts].map(s=>s.textContent||'').join('\n');
    const u=(scripts.match(/https:\\/\\/[^'"\\s]+\\.supabase\\.co/)||[])[0];
    const k=(scripts.match(/eyJ[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+\\.[A-Za-z0-9_\\-]+/)||[])[0];
    return u&&k?{u,k}:null;
  }

  async function addBarbero(){
    const input=document.getElementById('prueba3-nombre-barbero');
    const msg=document.getElementById('prueba3-add-msg');
    const nombre=input.value.trim();
    if(!nombre){msg.textContent='Escribí el nombre del barbero.';msg.style.color='#ff9999';return;}
    const config=getConfig();
    if(!config){msg.textContent='No se pudo detectar la configuración de Supabase.';msg.style.color='#ff9999';return;}
    try{
      const client=window.supabase.createClient(config.u,config.k);
      const {data:{session}}=await client.auth.getSession();
      if(!session){msg.textContent='Iniciá sesión para agregar un barbero.';msg.style.color='#ff9999';return;}
      const negocio=new URLSearchParams(location.search).get('negocio');
      if(!negocio){throw new Error('Falta el ID del negocio.');}
      const {error}=await client.from('barberos').insert({negocio_id:negocio,nombre:nombre,activo:true});
      if(error)throw error;
      msg.textContent='Barbero agregado correctamente.';
      msg.style.color='#8be58b';
      input.value='';
      setTimeout(()=>location.reload(),700);
    }catch(e){
      msg.textContent='No se pudo agregar: '+(e.message||e);
      msg.style.color='#ff9999';
    }
  }

  function init(){
    const s=findSection();
    if(!s||document.getElementById('prueba3-addbarbero'))return;
    const box=document.createElement('div');
    box.id='prueba3-addbarbero';
    box.className='prueba3-addbarbero';
    box.innerHTML='<div style="flex:1"><label style="display:block;color:#ddd;font-size:13px;font-weight:700;margin-bottom:7px">Nuevo barbero</label><input id="prueba3-nombre-barbero" placeholder="Nombre del barbero" maxlength="80"><div id="prueba3-add-msg" style="font-size:12px;margin-top:6px;min-height:15px"></div></div><button class="btn" type="button" id="prueba3-add-btn">+ Agregar barbero</button>';
    const title=[...s.querySelectorAll('h1,h2,h3')].find(x=>x.textContent.trim()==='Barberos');
    if(title&&title.parentElement)title.parentElement.insertAdjacentElement('afterend',box);else s.prepend(box);
    document.getElementById('prueba3-add-btn').onclick=addBarbero;
    document.getElementById('prueba3-nombre-barbero').addEventListener('keydown',e=>{if(e.key==='Enter')addBarbero();});
  }

  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else setTimeout(init,300);
})();`;

    html=html.replace('</body>', '<script id="prueba3-addbarbero-js">'+js+'<\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(e){
    document.body.innerHTML='<pre style="white-space:pre-wrap;color:red">No se pudo cargar el panel: '+String(e)+'</pre>';
  }
})();
</script>
</body>
</html>
