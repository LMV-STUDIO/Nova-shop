<!DOCTYPE html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Negocio de comida</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font-family:Arial;background:#111;color:#fff}.hero{padding:80px 20px;text-align:center;background:linear-gradient(#0008,#000d),url('https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=1800&q=85') center/cover}.hero h1{font-size:clamp(42px,8vw,80px);margin:0 0 15px}.hero p{color:#ddd}.wrap{max-width:1100px;margin:auto;padding:60px 20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:20px}.card{background:#1a1a1a;border:1px solid #303030;border-radius:14px;overflow:hidden}.card img{width:100%;height:190px;object-fit:cover}.info{padding:20px}.precio{font-size:23px;font-weight:800;margin-top:12px}.btn{display:inline-block;padding:12px 18px;border-radius:8px;background:#d4af37;color:#111;text-decoration:none;font-weight:800}footer{text-align:center;padding:30px;color:#aaa;border-top:1px solid #292929}.estado{text-align:center;color:#aaa}</style></head><body><section class="hero"><h1 id="nombre">Negocio</h1><p id="descripcion">Productos y sabores para vos.</p><a class="btn" href="#catalogo">Ver catálogo</a></section><main class="wrap" id="catalogo"><h2>Catálogo</h2><div id="productos" class="grid"><div class="estado">Cargando...</div></div></main><footer>© 2026 <span id="footer"></span></footer><script>const sb=window.supabase.createClient('https://cqelidpshitntewsktwx.supabase.co','sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD');const id=new URLSearchParams(location.search).get('negocio');const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function init(){if(!id)return;const n=await sb.from('negocios').select('nombre,descripcion').eq('id',id).single();if(n.data){nombre.textContent=n.data.nombre;footer.textContent=n.data.nombre;if(n.data.descripcion)descripcion.textContent=n.data.descripcion}const r=await sb.from('productos').select('nombre,categoria,precio,descripcion,imagen,stock').eq('negocio_id',id).eq('activo',true).order('created_at',{ascending:false});productos.innerHTML=(r.data||[]).map(p=>`<article class="card"><img src="${esc(p.imagen||'https://images.unsplash.com/photo-1504674900247-0877df9cc836?auto=format&fit=crop&w=900&q=80')}" alt="${esc(p.nombre)}"><div class="info"><h3>${esc(p.nombre)}</h3><p>${esc(p.descripcion||'')}</p><small>${esc(p.categoria||'')}</small><div class="precio">$${Number(p.precio||0).toLocaleString('es-AR')}</div></div></article>`).join('')||'<div class="estado">No hay productos disponibles.</div>'}init();</script></body></html>
