<!doctype html><html lang="es" data-lmv-rubro="ropa" data-lmv-premium="1"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tienda — LMV Studio</title><style>body{font-family:Arial;background:#111;color:#fff;max-width:1000px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #333;padding-bottom:18px}.brand,h1{color:#d4af37}.grid{display:grid;grid-template-columns:2fr 1fr;gap:18px}.card,.item{background:#1b1b1b;padding:18px;border-radius:12px;margin-top:18px}.item{border:1px solid #333}.muted{color:#aaa;font-size:13px}.campo{margin:10px 0}.campo input,.campo select{width:100%;box-sizing:border-box;padding:11px;background:#111;color:#fff;border:1px solid #444;border-radius:8px}.btn{border:0;border-radius:8px;padding:11px 14px;background:#d4af37;color:#111;font-weight:800;cursor:pointer}.precio{font-weight:800}.msg{margin-top:12px;color:#9ee79e}.carrito-linea{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid #333}@media(max-width:750px){body{padding:15px}.grid{grid-template-columns:1fr}.top{flex-direction:column;align-items:flex-start}}</style><link rel="stylesheet" href="lmv-premium-clientes.css"></head><body><div class="top"><div><div class="brand">LMV STUDIO · 👕 ROPA</div><h1 id="nombre">Cargando tienda...</h1><div id="info" class="muted"></div></div></div><div class="grid"><main><div class="card"><h2>👕 Catálogo</h2><div id="productos">Cargando productos...</div></div></main><aside><div class="card"><h2>🛒 Pedido</h2><div id="carrito">Todavía no agregaste productos.</div><hr><div class="campo"><label>Nombre</label><input id="cliente" required></div><div class="campo"><label>Teléfono</label><input id="telefono" required></div><button class="btn" onclick="enviarPedido()">Confirmar pedido</button><div id="msg" class="msg"></div></div></aside></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="demo-client-mode.js"></script><script>const s=window.supabase.createClient('https://cqelidpshitntewsktwx.supabase.co','sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD');const id=new URLSearchParams(location.search).get('negocio');let productos=[];let carrito=[];const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function renderCarrito(){const box=$('carrito');if(!carrito.length){box.innerHTML='Todavía no agregaste productos.';return}box.innerHTML=carrito.map((x,i)=>`<div class="carrito-linea"><span>${esc(x.nombre)}${x.variante?' · '+esc(x.variante):''} × ${x.cantidad}</span><b>$${(x.precio*x.cantidad).toLocaleString('es-AR')}</b><button class="btn" onclick="quitar(${i})">×</button></div>`).join('')}function agregar(pid){const p=productos.find(x=>x.id===pid);if(!p)return;const sel=$(('v'+pid));const variante=p.producto_variantes.find(v=>v.id===sel.value);if(!variante){$('msg').textContent='Elegí una variante.';return}if(Number(variante.stock||0)<=0){$('msg').textContent='Esa variante no tiene stock.';return}const key=pid+'-'+variante.id;const x=carrito.find(x=>x.key===key);if(x){if(x.cantidad>=Number(variante.stock)){$('msg').textContent='No hay más stock de esa variante.';return}x.cantidad++}else carrito.push({key,id:p.id,variante_id:variante.id,nombre:p.nombre,variante:variante.nombre,precio:Number(variante.precio??p.precio??0),cantidad:1});$('msg').textContent='';renderCarrito()}function quitar(i){carrito.splice(i,1);renderCarrito()}async function init(){if(!id){$('nombre').textContent='Falta el negocio';return}const b=await s.from('negocios').select('nombre,telefono,dirección,instagram,descripcion').eq('id',id).single();if(b.error){$('nombre').textContent='No se pudo cargar la tienda';return}const n=b.data;$('nombre').textContent=n.nombre;$('info').textContent=[n.descripcion,n.dirección,n.telefono].filter(Boolean).join(' · ');const r=await s.from('productos').select('id,nombre,categoria,precio,descripcion,imagen,producto_variantes(id,nombre,talle,color,stock,precio,activo)').eq('negocio_id',id).eq('activo',true).order('categoria').order('nombre');if(r.error){$('productos').textContent=r.error.message;return}productos=(r.data||[]).map(p=>({...p,producto_variantes:(p.producto_variantes||[]).filter(v=>v.activo!==false)}));$('productos').innerHTML=productos.map(p=>`<div class="item"><b>${esc(p.nombre)}</b><div class="muted">${esc(p.categoria||'')}</div><p>${esc(p.descripcion||'')}</p><div class="precio">$${Number(p.precio||0).toLocaleString('es-AR')}</div><div class="campo"><label>Variante</label><select id="v${p.id}">${p.producto_variantes.map(v=>`<option value="${v.id}" ${Number(v.stock||0)<=0?'disabled':''}>${esc(v.nombre||[v.talle,v.color].filter(Boolean).join(' / ')||'Variante')} · stock ${Number(v.stock||0)} · $${Number(v.precio??p.precio??0).toLocaleString('es-AR')}</option>`).join('')}</select></div><button class="btn" onclick="agregar(${p.id})">Agregar</button></div>`).join('')||'<div class="muted">No hay productos disponibles.</div>'}async function enviarPedido(){if(!carrito.length){$('msg').textContent='Agregá al menos un producto.';return}const cliente=$('cliente').value.trim(),telefono=$('telefono').value.trim();if(!cliente||!telefono){$('msg').textContent='Completá nombre y teléfono.';return}const total=carrito.reduce((a,x)=>a+x.precio*x.cantidad,0);const p=await s.from('pedidos').insert({cliente,telefono,total,estado:'pendiente',negocio_id:id}).select('id').single();if(p.error){$('msg').textContent=p.error.message;return}const items=carrito.map(x=>({pedido_id:p.data.id,producto_id:x.id,variante_id:x.variante_id,cantidad:x.cantidad,precio_unitario:x.precio,subtotal:x.precio*x.cantidad}));const r=await s.from('pedido_items').insert(items);if(r.error){$('msg').textContent=r.error.message;return}$('msg').textContent='Pedido enviado correctamente. Número #'+p.data.id;carrito=[];renderCarrito()}init();</script><script>/* LMV: reintento de carga inicial */
(function(){
  function retryLoad(){
    try{
      var n=document.getElementById('nombre');
      if(n && String(n.textContent||'').trim()==='Cargando...' && typeof loadBusiness==='function') loadBusiness();
      var p=document.getElementById('principales');
      if(p && String(p.textContent||'').trim()==='Cargando...' && typeof loadServices==='function') loadServices();
      var d=document.getElementById('days');
      if(d && !d.children.length && typeof loadHours==='function') loadHours();
    }catch(e){}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){setTimeout(retryLoad,700);});
  else setTimeout(retryLoad,700);
  setTimeout(retryLoad,1800);
})();</script></body></html>
