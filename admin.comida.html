<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin comida — LMV Studio</title><style>body{font-family:Arial;background:#090909;color:#fff;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #292929;padding-bottom:18px;margin-bottom:20px}.brand{color:#d4af37;font-size:24px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:20px;margin-bottom:18px}.campo{margin-bottom:12px}.campo label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.campo input,.campo textarea,.campo select{width:100%;box-sizing:border-box;padding:11px;background:#0d0d0d;color:#fff;border:1px solid #333;border-radius:8px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#d4af37;color:#111;font-weight:800;cursor:pointer}.btn.red{background:#351515;color:#ffaaa0}.item{border:1px solid #292929;border-radius:10px;padding:12px;margin:8px 0}.muted{color:#aaa;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{padding:15px}.top{flex-direction:column;align-items:flex-start}}</style></head><body><div class="wrap"><div class="top"><div><div class="brand">LMV STUDIO · 🍔 COMIDA</div><div class="muted" id="negocioNombre">Cargando negocio...</div></div><a class="btn" href="javascript:history.back()">Volver</a></div><div id="msg" class="muted"></div><div class="grid"><section><div class="card"><h2>🍔 Producto</h2><form id="productoForm"><div class="campo"><label>Nombre</label><input id="nombre" required></div><div class="campo"><label>Categoría</label><input id="categoria" placeholder="Hamburguesas, pizzas..."></div><div class="campo"><label>Precio</label><input id="precio" type="number" min="0" step="0.01" required></div><div class="campo"><label>Descripción</label><textarea id="descripcion"></textarea></div><div class="campo"><label>Imagen URL</label><input id="imagen" type="url"></div><div class="campo"><label>Disponible</label><select id="activo"><option value="true">Sí</option><option value="false">No</option></select></div><button class="btn">Guardar producto</button></form></div><div class="card"><h2>📦 Pedidos</h2><div id="pedidos">Cargando...</div></div></section><section><div class="card"><h2>📋 Catálogo</h2><div id="productos">Cargando...</div></div></section></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const s=window.supabase.createClient('https://cqelidpshitntewsktwx.supabase.co','sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD');const id=new URLSearchParams(location.search).get('negocio');let edit=null;const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function msg(t){$('msg').textContent=t;setTimeout(()=>$('msg').textContent='',3500)}async function init(){if(!id){msg('Falta ?negocio=ID');return}const{data,error}=await s.from('negocios').select('nombre,tipo_negocio').eq('id',id).single();if(error){msg(error.message);return}if(data.tipo_negocio&&data.tipo_negocio!=='comida'){msg('Este negocio no está configurado como comida.')}$('negocioNombre').textContent=data.nombre;await cargarProductos();await cargarPedidos()}async function cargarProductos(){const{data,error}=await s.from('productos').select('*').eq('negocio_id',id).order('created_at',{ascending:false});if(error){$('productos').textContent=error.message;return}$('productos').innerHTML=(data||[]).map(p=>`<div class="item"><b>${esc(p.nombre)}</b><div class="muted">${esc(p.categoria||'Sin categoría')} · $${Number(p.precio||0).toLocaleString('es-AR')} · ${p.activo?'Disponible':'Oculto'}</div><div class="row"><button class="btn" onclick="editar(${p.id})">Editar</button><button class="btn red" onclick="borrar(${p.id})">Eliminar</button></div></div>`).join('')||'<div class="muted">Sin productos.</div>';window.productos=data||[]}async function editar(pid){const p=window.productos.find(x=>x.id===pid);if(!p)return;edit=pid;$('nombre').value=p.nombre||'';$('categoria').value=p.categoria||'';$('precio').value=p.precio||0;$('descripcion').value=p.descripcion||'';$('imagen').value=p.imagen||'';$('activo').value=String(p.activo!==false);window.scrollTo({top:0,behavior:'smooth'})}async function borrar(pid){if(!confirm('¿Eliminar producto?'))return;const{error}=await s.from('productos').delete().eq('id',pid).eq('negocio_id',id);if(error)msg(error.message);else{msg('Producto eliminado');cargarProductos()}}$('productoForm').onsubmit=async e=>{e.preventDefault();const p={nombre:$('nombre').value.trim(),categoria:$('categoria').value.trim()||null,precio:Number($('precio').value),descripcion:$('descripcion').value.trim()||null,imagen:$('imagen').value.trim()||null,activo:$('activo').value==='true',negocio_id:id};let r=edit?await s.from('productos').update(p).eq('id',edit).eq('negocio_id',id):await s.from('productos').insert(p);if(r.error)msg(r.error.message);else{msg(edit?'Producto actualizado':'Producto creado');edit=null;e.target.reset();cargarProductos()}};async function cargarPedidos(){const{data,error}=await s.from('pedidos').select('*').eq('negocio_id',id).order('created_at',{ascending:false}).limit(30);if(error){$('pedidos').textContent=error.message;return}$('pedidos').innerHTML=(data||[]).map(p=>`<div class="item"><b>#${p.id} · ${esc(p.cliente||'Cliente')}</b><div class="muted">${esc(p.telefono||'')} · $${Number(p.total||0).toLocaleString('es-AR')} · ${esc(p.estado||'pendiente')}</div><div class="row"><button class="btn" onclick="estado(${p.id},'preparando')">Preparando</button><button class="btn" onclick="estado(${p.id},'listo')">Listo</button><button class="btn red" onclick="estado(${p.id},'cancelado')">Cancelar</button></div></div>`).join('')||'<div class="muted">Sin pedidos.</div>'}async function estado(pid,e){const{error}=await s.from('pedidos').update({estado:e}).eq('id',pid).eq('negocio_id',id);if(error)msg(error.message);else{msg('Estado actualizado');cargarPedidos()}}init();</script></body></html>
