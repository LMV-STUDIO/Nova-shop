<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin comida — LMV Studio</title><style>body{font-family:Arial;background:#090909;color:#fff;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #292929;padding-bottom:18px;margin-bottom:20px}.brand{color:#d4af37;font-size:24px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:20px;margin-bottom:18px}.campo{margin-bottom:12px}.campo label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.campo input,.campo textarea,.campo select{width:100%;box-sizing:border-box;padding:11px;background:#0d0d0d;color:#fff;border:1px solid #333;border-radius:8px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#d4af37;color:#111;font-weight:800;cursor:pointer}.btn.red{background:#351515;color:#ffaaa0}.btn.sec{background:#252525;color:#fff;border:1px solid #333}.item{border:1px solid #292929;border-radius:10px;padding:12px;margin:8px 0}.muted{color:#aaa;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.msg{margin-bottom:15px;color:#aaa}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{padding:15px}.top{flex-direction:column;align-items:flex-start}}</style></head><body><div id="app"><div class="wrap"><div class="top"><div><div class="brand">LMV STUDIO · 🍔 COMIDA</div><div class="muted" id="negocioNombre">Cargando negocio...</div></div><div class="row"><a id="pagina" class="btn sec" target="_blank">🌐 Página</a></div></div><div id="msg" class="msg"></div><div class="grid"><section><div class="card"><h2>🏪 Datos del negocio</h2><form id="negocioForm"><div class="campo"><label>Nombre</label><input id="bnombre" required></div><div class="campo"><label>Teléfono</label><input id="btelefono"></div><div class="campo"><label>Dirección</label><input id="bdireccion"></div><div class="campo"><label>Instagram</label><input id="binstagram"></div><div class="campo"><label>Logo URL</label><input id="blogo" type="url"></div><div class="campo"><label>Descripción</label><textarea id="bdescripcion"></textarea></div><button class="btn">Guardar datos</button></form></div><div class="card"><h2>🍔 Producto</h2><form id="productoForm"><div class="campo"><label>Nombre</label><input id="nombre" required></div><div class="campo"><label>Categoría</label><input id="categoria" placeholder="Hamburguesas, pizzas..."></div><div class="campo"><label>Precio</label><input id="precio" type="number" min="0" step="0.01" required></div><div class="campo"><label>Descripción</label><textarea id="descripcion"></textarea></div><div class="campo"><label>Imagen URL</label><input id="imagen" type="url"></div><div class="campo"><label>Disponible</label><select id="activo"><option value="true">Sí</option><option value="false">No</option></select></div><button class="btn">Guardar producto</button></form></div><div class="card"><h2>📦 Pedidos</h2><div id="pedidos">Cargando...</div></div></section><section><div class="card"><h2>📋 Catálogo</h2><div id="productos">Cargando...</div></div></section></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const s=window.supabase.createClient('https://cqelidpshitntewsktwx.supabase.co','sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD');const id=new URLSearchParams(location.search).get('negocio');let edit=null,negocio=null,productosData=[];const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function msg(t){$('msg').textContent=t;clearTimeout(window.mt);window.mt=setTimeout(()=>$('msg').textContent='',3500)}function limpiar(){edit=null;$('productoForm').reset()}async function init(){if(!id){$('negocioNombre').textContent='Falta ?negocio=ID';return}const r=await s.from('negocios').select('id,nombre,telefono,dirección,instagram,logo,descripcion,tipo_negocio').eq('id',id).maybeSingle();if(r.error||!r.data){msg(r.error?.message||'No se pudo cargar el negocio');return}negocio=r.data;$('negocioNombre').textContent=negocio.nombre||'Negocio de comida';$('pagina').href='https://lmv-studio.github.io/Nova-shop/comida.html?negocio='+encodeURIComponent(id);$('bnombre').value=negocio.nombre||'';$('btelefono').value=negocio.telefono||'';$('bdireccion').value=negocio.dirección||'';$('binstagram').value=negocio.instagram||'';$('blogo').value=negocio.logo||'';$('bdescripcion').value=negocio.descripcion||'';await cargarProductos();await cargarPedidos()}$('negocioForm').onsubmit=async e=>{e.preventDefault();const p={nombre:$('bnombre').value.trim(),telefono:$('btelefono').value.trim()||null,dirección:$('bdireccion').value.trim()||null,instagram:$('binstagram').value.trim()||null,logo:$('blogo').value.trim()||null,descripcion:$('bdescripcion').value.trim()||null};const r=await s.from('negocios').update(p).eq('id',id);msg(r.error?r.error.message:'Datos del negocio actualizados');if(!r.error){negocio={...negocio,...p};$('negocioNombre').textContent=p.nombre}};async function cargarProductos(){const r=await s.from('productos').select('*').eq('negocio_id',id).order('created_at',{ascending:false});if(r.error){$('productos').textContent=r.error.message;return}productosData=r.data||[];$('productos').innerHTML=productosData.map(p=>`<div class="item"><b>${esc(p.nombre)}</b><div class="muted">${esc(p.categoria||'Sin categoría')} · $${Number(p.precio||0).toLocaleString('es-AR')} · ${p.activo?'Disponible':'Oculto'}</div><div class="row"><button class="btn" onclick="editar(${p.id})">Editar</button><button class="btn red" onclick="borrar(${p.id})">Eliminar</button></div></div>`).join('')||'<div class="muted">Sin productos.</div>'}function editar(pid){const p=productosData.find(x=>x.id===pid);if(!p)return;edit=pid;$('nombre').value=p.nombre||'';$('categoria').value=p.categoria||'';$('precio').value=p.precio||0;$('descripcion').value=p.descripcion||'';$('imagen').value=p.imagen||'';$('activo').value=String(p.activo!==false);window.scrollTo({top:0,behavior:'smooth'})}async function borrar(pid){if(!confirm('¿Eliminar producto?'))return;const r=await s.from('productos').delete().eq('id',pid).eq('negocio_id',id);msg(r.error?r.error.message:'Producto eliminado');if(!r.error)await cargarProductos()}$('productoForm').onsubmit=async e=>{e.preventDefault();const p={nombre:$('nombre').value.trim(),categoria:$('categoria').value.trim()||null,precio:Number($('precio').value),descripcion:$('descripcion').value.trim()||null,imagen:$('imagen').value.trim()||null,activo:$('activo').value==='true',negocio_id:id};const r=edit?await s.from('productos').update(p).eq('id',edit).eq('negocio_id',id):await s.from('productos').insert(p);if(r.error)msg(r.error.message);else{msg(edit?'Producto actualizado':'Producto creado');limpiar();await cargarProductos()}};async function cargarPedidos(){const r=await s.from('pedidos').select('*').eq('negocio_id',id).order('created_at',{ascending:false}).limit(30);if(r.error){$('pedidos').textContent=r.error.message;return}const data=r.data||[];$('pedidos').innerHTML=data.map(p=>`<div class="item"><b>#${p.id} · ${esc(p.cliente||'Cliente')}</b><div class="muted">${esc(p.telefono||'')} · $${Number(p.total||0).toLocaleString('es-AR')} · ${esc(p.estado||'pendiente')}</div><div class="row"><button class="btn" onclick="estado(${p.id},'preparando')">Preparando</button><button class="btn" onclick="estado(${p.id},'listo')">Listo</button><button class="btn red" onclick="estado(${p.id},'cancelado')">Cancelar</button></div></div>`).join('')||'<div class="muted">Sin pedidos.</div>'}async function estado(pid,e){const r=await s.from('pedidos').update({estado:e}).eq('id',pid).eq('negocio_id',id);msg(r.error?r.error.message:'Estado actualizado');if(!r.error)await cargarPedidos()}init();</script></body></html>
