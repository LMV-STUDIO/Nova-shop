name: Fix errores en demos cliente
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir referencias de menú inexistentes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          files=['nails.html','lashes.html','estetica.html','depilacion-laser.html','barberia.html','comida.html','ferreteria.html']
          for fn in files:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              # Algunas páginas conservaron listeners del menú anterior aunque
              # sus elementos HTML ya no existen. Eliminarlos evita null.addEventListener.
              s=re.sub(r"\$\(['\"]mobileClose['\"]\)\.addEventListener\([^;]+;",'',s)
              s=re.sub(r"\$\(['\"]mobileShade['\"]\)\.addEventListener\([^;]+;",'',s)
              s=re.sub(r"document\.querySelectorAll\(['\"]\.mobileLinks a['\"]\)\.forEach\([^;]+;",'',s)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit si hubo cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nails.html lashes.html estetica.html depilacion-laser.html barberia.html comida.html ferreteria.html
          git diff --cached --quiet || git commit -m 'fix: corregir listeners inexistentes en paginas cliente'
          git push
