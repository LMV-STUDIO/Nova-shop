name: Ajuste puntual admins cosmetologia y ferreteria
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Aplicar ajustes
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re
          p=Path('admins/originales/admin.estetica.html'); t=p.read_text(encoding='utf-8')
          marker='<div class="card priority"><div class="cardHead"><div><h2>📅 Turnos</h2>'
          start=t.find(marker)
          if start<0: raise SystemExit('No se encontró Turnos')
          depth=0; end=None
          for m in re.finditer(r'<div\b|</div\s*>',t[start:],re.I):
              depth += 1 if m.group(0).lower().startswith('<div') else -1
              if depth==0: end=start+m.end(); break
          if end is None: raise SystemExit('No se pudo cerrar Turnos')
          card=t[start:end]; t=t[:start]+t[end:]
          gm='<div class="grid"><section>'; g=t.find(gm)
          if g<0: raise SystemExit('No se encontró grid')
          at=g+len(gm); t=t[:at]+'\n'+card+t[at:]; p.write_text(t,encoding='utf-8')
          p=Path('admins/originales/admin.ferreteria.html'); t=p.read_text(encoding='utf-8')
          css='''\n/* Ajuste móvil vertical LMV Studio */\n@media(max-width:760px){body{overflow-x:hidden}.layout{display:block;min-height:100vh}.side{position:relative;top:auto;height:auto;padding:14px 12px;box-shadow:0 6px 20px rgba(8,45,120,.12)}.brand{padding:3px 8px 12px;font-size:16px}.demo{margin:0 5px 12px;font-size:10px}.nav{display:flex;flex-direction:column;gap:4px;overflow:visible}.nav button{width:100%;min-width:0;margin:0;padding:11px 12px;text-align:left}.main{padding:14px 12px 35px;max-width:100%}.top{margin-bottom:14px;gap:10px}.top h1{font-size:24px;line-height:1.2}.badge{font-size:10px;line-height:1.35;white-space:normal}.cards{grid-template-columns:1fr;gap:10px}.card,.panel{border-radius:17px;padding:15px}.grid2{grid-template-columns:1fr;gap:0}.toolbar{align-items:stretch;flex-direction:column;gap:10px}.toolbar .btn{width:100%}.filters{display:grid;grid-template-columns:1fr 1fr;gap:7px}.filters button,.filters select,.filters input{width:100%;min-width:0}.filters input{grid-column:1/-1}.formgrid{grid-template-columns:1fr}.controlConfig{grid-template-columns:1fr}.metricRow{grid-template-columns:1fr}.tablewrap{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch}table{min-width:680px}.chart{height:170px;overflow-x:auto;padding-bottom:28px}.modal{padding:10px}.modalbox{width:100%;max-height:92vh;padding:17px}.modalActions{flex-direction:column}.modalActions .btn{width:100%}}\n@media(max-width:480px){.side{padding:12px 10px}.nav button{padding:12px;font-size:13px}.main{padding:11px 9px 30px}.top h1{font-size:22px}.badge{width:100%;text-align:center}.panel{padding:13px}.filters{grid-template-columns:1fr}.filters input{grid-column:auto}.filters button,.filters select,.filters input{font-size:12px}.card b{font-size:24px}.modalbox h3{font-size:19px}}\n'''
          if '/* Ajuste móvil vertical LMV Studio */' not in t: t=t.replace('</style>',css+'</style>',1); p.write_text(t,encoding='utf-8')
          PY
      - name: Verificar cambios
        run: |
          grep -q '📅 Turnos' admins/originales/admin.estetica.html
          grep -q 'Ajuste móvil vertical LMV Studio' admins/originales/admin.ferreteria.html
      - name: Commit y eliminar workflow temporal
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admins/originales/admin.estetica.html admins/originales/admin.ferreteria.html .github/workflows/ajuste-puntual-admins.yml
          git rm .github/workflows/ajuste-puntual-admins.yml
          git commit -m 'Ajustar orden de turnos y vista movil de admins' || exit 0
          git push
