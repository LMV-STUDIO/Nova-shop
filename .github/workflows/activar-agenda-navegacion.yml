name: Activar navegación de agenda

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  activar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insertar script de navegación en Admin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('admin.barberia_reutilizable.html')
          text = path.read_text(encoding='utf-8')
          marker = '<!-- AGENDA-NAVEGACION-ACTIVA -->'

          if marker in text:
              print('La navegación ya está activa.')
              raise SystemExit(0)

          target = '</body>'
          addition = '''\n<!-- AGENDA-NAVEGACION-ACTIVA -->\n<script src="agenda-navegacion.js"></script>\n'''

          if target not in text:
              raise SystemExit('No se encontró </body> en admin.barberia_reutilizable.html')

          path.write_text(text.replace(target, addition + target, 1), encoding='utf-8')
          print('Script de navegación agregado.')
          PY

      - name: Commit del cambio
        run: |
          if git diff --quiet; then
            echo "Sin cambios para guardar."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.barberia_reutilizable.html
          git commit -m "Agregar flechas para navegar días en agenda"
          git push
