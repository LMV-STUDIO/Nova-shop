name: Ajustar barberos móvil Admin

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mejorar horarios de barberos en móvil
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.barberia_reutilizable.html')
          s = p.read_text(encoding='utf-8')
          marker = '/* AJUSTE-MOVIL-BARBEROS-V1 */'
          if marker in s:
              print('El ajuste ya está aplicado.')
              raise SystemExit(0)
          css = '''\n<style id="ajuste-mobile-barberos">\n/* AJUSTE-MOVIL-BARBEROS-V1 */\n@media(max-width:750px){\n  .agenda-barbero{\n    margin-bottom:16px;\n    border-radius:14px;\n  }\n  .agenda-barbero-header{\n    padding:14px 15px;\n    display:block;\n  }\n  .agenda-barbero-header h3{\n    font-size:17px;\n    margin-bottom:5px;\n  }\n  .agenda-barbero-header span{\n    display:block;\n    font-size:12px;\n  }\n  .horarios-grid{\n    grid-template-columns:1fr 1fr!important;\n    gap:8px!important;\n    padding:10px!important;\n  }\n  .horario{\n    min-height:82px!important;\n    padding:10px!important;\n    border-radius:10px!important;\n  }\n  .horario-hora{\n    font-size:16px!important;\n    margin-bottom:5px!important;\n  }\n  .horario-cliente{\n    font-size:12px!important;\n  }\n  .horario-servicio{\n    font-size:10px!important;\n  }\n  .horario-estado{\n    font-size:9px!important;\n  }\n}\n@media(max-width:390px){\n  .horarios-grid{\n    grid-template-columns:1fr!important;\n  }\n}\n</style>\n'''
          if '</head>' not in s:
              raise SystemExit('No se encontró </head>')
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.barberia_reutilizable.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Mejorar horarios de barberos en móvil"
            git push
          fi
