name: Limpiar menus duplicados en paginas cliente
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar paginas cliente y modo demo
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          client_files=['nails.html','lashes.html','estetica.html','depilacion-laser.html','barberia.html','comida.html','ferreteria.html','ropa.html']
          demo_tag='<script src="demo-client-mode.js"></script>'

          for fn in client_files:
              p=Path(fn)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')

              # El modo demo se activa únicamente con ?demo=true y se coloca
              # después de cargar Supabase pero antes del JavaScript de la página.
              if demo_tag not in s:
                  marker='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
                  if marker in s:
                      s=s.replace(marker,marker+demo_tag,1)
                  else:
                      # Algunas páginas pueden tener el CDN con otra capitalización.
                      m=re.search(r'<script[^>]+src=["\']https://cdn\.jsdelivr\.net/npm/@supabase/supabase-js@2[^>]*></script>',s,re.I)
                      if m:
                          s=s[:m.end()]+demo_tag+s[m.end():]
              p.write_text(s,encoding='utf-8')

          # LMV muestra las paginas cliente reales en modo demo, sin crear copias.
          p=Path('lmv-studio.html')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              replacements={
                'demo-cliente.html?rubro=barberia':'barberia.html?demo=true',
                'demo-cliente.html?rubro=nails':'nails.html?demo=true',
                'demo-cliente.html?rubro=lashes':'lashes.html?demo=true',
                'demo-cliente.html?rubro=cosmetologia':'estetica.html?demo=true',
                'demo-cliente.html?rubro=depilacion-laser':'depilacion-laser.html?demo=true',
                'demo-cliente.html?rubro=comida':'comida.html?demo=true',
                'ferreteria.html">🌐 Ver demo':'ferreteria.html?demo=true">🌐 Ver demo'
              }
              for old,new in replacements.items():
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nails.html lashes.html estetica.html depilacion-laser.html barberia.html comida.html ferreteria.html ropa.html lmv-studio.html
          git diff --cached --quiet || git commit -m 'feat: separar modo demo de paginas cliente reales'
          git push
