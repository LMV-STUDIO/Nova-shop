name: Limpiar menus duplicados en paginas cliente
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar paginas cliente y modo demo
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          client_files=['nails.html','lashes.html','estetica.html','depilacion-laser.html','barberia.html','comida.html','ferreteria.html','ropa.html']
          demo_tag='<script src="demo-client-mode.js"></script>'
          premium_css='<link rel="stylesheet" href="lmv-premium-clientes.css">'
          load_fix='''<script>/* LMV: reintento de carga inicial */\n(function(){\n  function retryLoad(){\n    try{\n      var n=document.getElementById('nombre');\n      if(n && String(n.textContent||'').trim()==='Cargando...' && typeof loadBusiness==='function') loadBusiness();\n      var p=document.getElementById('principales');\n      if(p && String(p.textContent||'').trim()==='Cargando...' && typeof loadServices==='function') loadServices();\n      var d=document.getElementById('days');\n      if(d && !d.children.length && typeof loadHours==='function') loadHours();\n    }catch(e){}\n  }\n  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',function(){setTimeout(retryLoad,700);});\n  else setTimeout(retryLoad,700);\n  setTimeout(retryLoad,1800);\n})();</script>'''

          for fn in client_files:
              p=Path(fn)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')

              # Quitar boton movil antiguo si existe el drawer LMV.
              s=re.sub(r'<button[^>]*class="(?:menuBtn|menu)"[^>]*>.*?</button>','',s,count=1,flags=re.S)
              marker='<div class="mobileMenu"'
              start=s.find(marker)
              if start>=0:
                  depth=0
                  for m in re.finditer(r'<div\b[^>]*>|</div>',s[start:],re.I):
                      tag=m.group(0)
                      if tag.lower().startswith('<div') and not tag.rstrip().endswith('/>'):
                          depth+=1
                      elif tag.lower()=='</div>':
                          depth-=1
                          if depth==0:
                              s=s[:start]+s[start+m.end():]
                              break

              # Eliminar listeners del menu antiguo.
              s=re.sub(r'function openMenu\(\)\{.*?\}\s*function closeMenu\(\)\{.*?\}\$\([\'\"]menuBtn[\'\"]\)\.addEventListener\([\s\S]*?\);', '', s, count=1)
              s=re.sub(r'function abrirMenu\(\)\{.*?\}\s*function cerrarMenu\(\)\{.*?\}\s*menuBtn\.onclick=abrirMenu;mobileClose\.onclick=cerrarMenu;mobileShade\.onclick=cerrarMenu;', '', s, count=1)
              s=re.sub(r'\$\([\'\"]menuBtn[\'\"]\)\.onclick=.*?;\$\([\'\"]mobileClose[\'\"]\)\.onclick=.*?;\$\([\'\"]mobileShade[\'\"]\)\.onclick=.*?;', '', s, count=1)

              # Capa visual premium. Se agrega despues de los estilos propios para que solo sobreescriba apariencia.
              if premium_css not in s:
                  if '</head>' in s:
                      s=s.replace('</head>',premium_css+'</head>',1)

              # Identidad visual por rubro sin tocar IDs ni logica.
              rubro=fn[:-5]
              s=re.sub(r'<html([^>]*)>', lambda m: '<html'+re.sub(r'\sdata-lmv-rubro="[^"]*"|\sdata-lmv-premium="[^"]*"','',m.group(1))+' data-lmv-rubro="'+rubro+'" data-lmv-premium="1">', s, count=1, flags=re.I)

              # Insertar modo demo despues de Supabase.
              if demo_tag not in s:
                  marker2='<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>'
                  if marker2 in s:
                      s=s.replace(marker2,marker2+demo_tag,1)
                  else:
                      m=re.search(r'<script[^>]+src=["\']https://cdn\.jsdelivr\.net/npm/supabase-js@2[^>]*></script>',s,re.I)
                      if m:
                          s=s[:m.end()]+demo_tag+s[m.end():]

              # Reintento de carga inicial.
              if 'LMV: reintento de carga inicial' not in s:
                  s=s.replace('</body>',load_fix+'</body>')
              p.write_text(s,encoding='utf-8')

          # LMV muestra las paginas cliente reales en modo demo.
          p=Path('lmv-studio.html')
          if p.exists():
              s=p.read_text(encoding='utf-8')
              replacements={
                'demo-cliente.html?rubro=barberia':'barberia.html?demo=true',
                'demo-cliente.html?rubro=nails':'nails.html?demo=true',
                'demo-cliente.html?rubro=lashes':'lashes.html?demo=true',
                'demo-cliente.html?rubro=cosmetologia':'estetica.html?demo=true',
                'demo-cliente.html?rubro=depilacion-laser':'depilacion-laser.html?demo=true',
                'demo-cliente.html?rubro=comida':'comida.html?demo=true',
                'ferreteria.html">🌐 Ver demo':'ferreteria.html?demo=true">🌐 Ver demo'
              }
              for old,new in replacements.items():
                  s=s.replace(old,new)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nails.html lashes.html estetica.html depilacion-laser.html barberia.html comida.html ferreteria.html ropa.html lmv-studio.html
          git diff --cached --quiet || git commit -m 'feat: aplicar diseño premium a paginas cliente'
          git push