name: Fix Admin Google Redirect

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch admin redirect
        shell: python
        run: |
          from pathlib import Path
          p = Path("admin.barberia_reutilizable.html")
          text = p.read_text(encoding="utf-8")
          old = """redirectTo:\n                    window.location.origin +\n                    window.location.pathname +\n                    window.location.search"""
          new = """redirectTo:\n                    \"https://lmv-studio.github.io/Nova-shop/admin.barberia_reutilizable.html\" +\n                    window.location.search"""
          if old not in text:
              raise SystemExit("Redirect pattern not found; no changes made.")
          p.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.barberia_reutilizable.html
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Fix Admin Google redirect for GitHub Pages"
          git push
