name: Mejorar demos comerciales
on:
  push:
    paths:
      - '.github/workflows/mejorar-demos-comerciales.yml'
  workflow_dispatch:
jobs:
  mejorar:
    if: ${{ !startsWith(github.event.head_commit.message, '[auto-demo]') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Mejorar Ferretería y Comida
        shell: python
        run: |
          from pathlib import Path

          def patch(path, marker, css, js):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if marker in s: return False
              s=s.replace('</head>', f'<style id="{marker}">{css}</style></head>', 1)
              s=s.replace('</body>', f'<script id="{marker}-js">{js}</script></body>', 1)
              p.write_text(s, encoding='utf-8')
              return True

          fer_css='''
          .tablewrap{border:1px solid #dbe5f3;border-radius:16px;background:#fff;overflow:auto;box-shadow:0 8px 24px rgba(20,55,110,.06)}
          #stock table{min-width:1050px}
          #stock th{background:#f5f8fd;padding:14px 12px;position:sticky;top:0;z-index:1}
          #stock td{padding:14px 12px;vertical-align:middle}
          #stock tbody tr{transition:.18s}
          #stock tbody tr:hover{background:#f7faff;transform:translateX(2px)}
          #stock td:nth-child(1){font-weight:900;color:#1769ff}
          #stock td:nth-child(2){font-weight:800;color:#12213b;white-space:normal;min-width:220px}
          #stock td:nth-child(4),#stock td:nth-child(5){font-weight:750}
          .stock-good,.stock-low{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:11px;font-weight:900;white-space:nowrap}
          .stock-good{background:#def7e9;color:#08784a}.stock-low{background:#fff1cf;color:#8b6200}
          .stock-margin{font-weight:900;color:#1769ff}
          .stock-action{border:0;border-radius:9px;padding:7px 10px;background:#eaf2ff;color:#082d78;font-weight:900;cursor:pointer}
          .stock-action:hover{background:#d8e7ff}
          '''
          fer_js='''
          (()=>{const t=document.getElementById('stock');if(!t)return;const rows=[['FT-001','Taladro percutor 650W','Herramientas','$48.000','$69.900','14','5','31%','Disponible'],['FT-014','Tornillo 8x2 caja x100','Fijaciones','$3.800','$6.200','42','20','39%','Disponible'],['FT-031','Cemento rápido 5kg','Construcción','$5.900','$9.500','6','10','38%','Stock bajo'],['FT-044','Disco corte 115mm','Herramientas','$1.700','$3.200','3','12','47%','Stock bajo'],['FT-052','Llave francesa 10"','Herramientas','$8.200','$13.900','18','6','41%','Disponible'],['FT-078','Pintura látex 20L','Pinturas','$32.000','$49.900','9','5','36%','Disponible']];const render=a=>t.innerHTML=a.map(r=>'<tr>'+r.slice(0,8).map((x,i)=>'<td class="'+(i===7?'stock-margin':'')+'">'+x+'</td>').join('')+'<td><span class="'+(r[8]==='Stock bajo'?'stock-low':'stock-good')+'">● '+r[8]+'</span></td><td><button class="stock-action" onclick="window.lmvDemoToast&&window.lmvDemoToast()">Editar</button></td></tr>').join('');render(rows);})();
          '''

          food_css='''
          :root{--gold:#d4af37;--food:#151515;--food2:#1d1d1d;--soft:#f5f1e6}
          body{background:radial-gradient(circle at 90% 0,#252018,transparent 32%),#090909!important}
          #app{min-height:100vh}
          #app .wrap{max-width:1250px;padding:28px 22px}
          .top{padding:18px 20px;border:1px solid #302d26;border-radius:22px;background:linear-gradient(135deg,#151515,#111);box-shadow:0 18px 50px rgba(0,0,0,.25)}
          .brand{letter-spacing:1px;font-size:25px!important}.card{border-color:#302d26!important;border-radius:20px!important;background:linear-gradient(145deg,#181818,#111)!important;box-shadow:0 15px 40px rgba(0,0,0,.18)!important}
          .card h2{color:#f4e8c3}.campo input,.campo textarea,.campo select{border-color:#3b382f!important;background:#0b0b0b!important}.btn{border-radius:12px!important;transition:.18s}.btn:hover{transform:translateY(-2px);box-shadow:0 10px 25px rgba(212,175,55,.14)}
          .item{border-color:#38352e!important;background:#111!important;transition:.18s}.item:hover{border-color:#6b5a2b!important;transform:translateY(-2px)}
          #pedidos,#productos{display:grid;gap:10px}.demo-food-card{border:1px solid #37332b;border-radius:16px;padding:15px;background:linear-gradient(145deg,#1a1a1a,#101010);display:flex;justify-content:space-between;align-items:center;gap:14px}.demo-food-card strong{color:#f4e8c3}.demo-food-price{color:#d4af37;font-weight:900}.demo-food-status{font-size:11px;color:#9be0bd;font-weight:900}
          #login{display:none!important}#app{display:block!important}
          .food-demo-badge{display:inline-flex;align-items:center;gap:7px;margin:0 0 18px;padding:8px 12px;border:1px solid #4a3e20;border-radius:999px;background:#211b0d;color:#e6c95f;font:800 11px system-ui}
          '''
          food_js='''
          (()=>{const app=document.getElementById('app');if(!app)return;const badge=document.createElement('div');badge.className='food-demo-badge';badge.textContent='🎬 DEMO INTERACTIVA · DATOS FICTICIOS · SIN LOGIN';const wrap=app.querySelector('.wrap');if(wrap&&!wrap.querySelector('.food-demo-badge'))wrap.prepend(badge);const products=[['🍔 Hamburguesa LMV','Carne, cheddar, panceta y salsa de la casa','$9.500'],['🍕 Pizza Especial','Mozzarella, jamón, morrón y aceitunas','$12.500'],['🍟 Papas Cheddar','Papas crocantes con cheddar y verdeo','$6.500'],['🌯 Wrap Completo','Pollo grillado, vegetales y salsa especial','$8.900'],['🥤 Combo Bebida','Gaseosa fría 500 ml','$2.500'],['🍰 Cheesecake','Porción casera con frutos rojos','$5.500']];const box=document.getElementById('productos');if(box){box.innerHTML=products.map(p=>'<div class="demo-food-card"><div><strong>'+p[0]+'</strong><div class="muted" style="margin-top:5px">'+p[1]+'</div><div class="food-demo-price" style="margin-top:7px">'+p[2]+'</div></div><button class="btn" type="button" onclick="window.lmvDemoToast()">Probar</button></div>').join('')}const orders=[['#1042','Juan Pérez','2× Hamburguesa LMV','$19.000','En preparación'],['#1043','Camila Torres','1× Pizza Especial','$12.500','Confirmado'],['#1044','Martín López','1× Combo + Papas','$9.000','Listo']];const ob=document.getElementById('pedidos');if(ob)ob.innerHTML=orders.map(o=>'<div class="demo-food-card"><div><strong>'+o[0]+' · '+o[1]+'</strong><div class="muted" style="margin-top:5px">'+o[2]+'</div></div><div><div class="demo-food-price">'+o[3]+'</div><div class="demo-food-status">● '+o[4]+'</div></div></div>').join('');window.lmvDemoToast=()=>{let t=document.getElementById('lmv-food-toast');if(!t){t=document.createElement('div');t.id='lmv-food-toast';t.style='position:fixed;right:20px;bottom:20px;z-index:99999;background:#d4af37;color:#111;padding:13px 17px;border-radius:13px;font:900 13px system-ui;box-shadow:0 12px 35px #0008';document.body.appendChild(t)}t.textContent='🎬 Esto es una demo visual. Los cambios no se pueden guardar.';t.style.display='block';clearTimeout(window.__ft);window.__ft=setTimeout(()=>t.style.display='none',2600)};document.querySelectorAll('#login button').forEach(b=>b.onclick=e=>{e.preventDefault();window.lmvDemoToast()});})();
          '''
          patch('admin.demo-publico-ferreteria.html','lmv-ferreteria-polish',fer_css,fer_js)
          patch('admin.demo-publico-comida.html','lmv-comida-polish',food_css,food_js)
      - name: Commit cambios
        run: |
          git config user.name 'LMV Studio Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.demo-publico-ferreteria.html admin.demo-publico-comida.html
          git diff --cached --quiet || git commit -m '[auto-demo] Mejorar demos de ferreteria y comida'
          git push
