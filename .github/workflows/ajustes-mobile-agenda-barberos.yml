name: Ajustar agenda y barberos en móvil

on:
  push:
    paths:
      - '.github/workflows/ajustes-mobile-agenda-barberos.yml'
    branches: [main]

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Aplicar ajustes móviles
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.barberia_reutilizable.html')
          text = p.read_text(encoding='utf-8')
          marker = '/* LMV MOBILE AGENDA BARBEROS V3 */'
          if marker in text:
              print('Los ajustes ya están aplicados.')
              raise SystemExit(0)

          css = '''
<style id="lmv-mobile-agenda-barberos-v3">
/* LMV MOBILE AGENDA BARBEROS V3 */
@media(max-width:750px){
  /* Navegación grande debajo de la fecha */
  .agenda-cabecera .agenda-fecha{width:100%!important}
  .agenda-cabecera #agenda-navegacion{width:100%!important;display:grid!important;grid-template-columns:1fr 1.25fr 1fr!important;gap:9px!important;margin-top:12px!important}
  .agenda-cabecera #agenda-navegacion button{width:100%!important;min-width:0!important;height:52px!important;padding:10px 8px!important;border-radius:10px!important;font-size:17px!important;font-weight:800!important}
  .agenda-cabecera #agenda-navegacion .agenda-nav-hoy{font-size:16px!important}

  /* Quitar texto explicativo innecesario de Fijos semanales */
  #fijos-recurrentes-card>p{display:none!important}

  /* Barberos: compacto pero legible */
  #seccion-barberos .card{padding:12px!important;margin-bottom:12px!important}
  #seccion-barberos .card h3{font-size:15px!important;margin-bottom:9px!important}
  #seccion-barberos .card>p{font-size:11px!important;margin-bottom:10px!important;line-height:1.3!important}
  #horariosBarberos{display:grid!important;grid-template-columns:1fr!important;gap:8px!important}
  #horariosBarberos>.card{margin:0!important;padding:10px!important;border-radius:10px!important}
  #horariosBarberos>.card h3{font-size:14px!important;margin-bottom:7px!important}
  #horariosBarberos>.card>div[style*="grid-template-columns"]{grid-template-columns:58px minmax(0,1fr) minmax(0,1fr) 58px!important;gap:5px!important;margin-bottom:5px!important;padding:0!important}
  #horariosBarberos>.card>div[style*="grid-template-columns"] strong{font-size:9px!important;white-space:nowrap!important;overflow:hidden!important;text-overflow:ellipsis!important}
  #horariosBarberos>.card>div[style*="grid-template-columns"] input[type="time"]{height:34px!important;padding:6px 4px!important;font-size:12px!important;min-width:0!important}
  #horariosBarberos>.card>div[style*="grid-template-columns"] label{font-size:8px!important;gap:2px!important;justify-content:center!important;white-space:nowrap!important}
  #horariosBarberos>.card>div[style*="grid-template-columns"] label input{width:13px!important;height:13px!important;margin:0!important}
  #horariosBarberos>.card>.btn{width:100%!important;min-height:35px!important;margin-top:4px!important;padding:7px 9px!important;font-size:11px!important}
}
@media(max-width:390px){
  .agenda-cabecera #agenda-navegacion{gap:7px!important}
  .agenda-cabecera #agenda-navegacion button{height:50px!important;font-size:16px!important}
  #horariosBarberos>.card{padding:9px!important}
  #horariosBarberos>.card>div[style*="grid-template-columns"]{grid-template-columns:53px minmax(0,1fr) minmax(0,1fr) 53px!important;gap:4px!important}
  #horariosBarberos>.card>div[style*="grid-template-columns"] strong{font-size:8px!important}
  #horariosBarberos>.card>div[style*="grid-template-columns"] label{font-size:7px!important}
}
</style>
'''
          if '</head>' not in text:
              raise SystemExit('No se encontró </head>')
          p.write_text(text.replace('</head>', css + '\n</head>', 1), encoding='utf-8')

      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.barberia_reutilizable.html
          if git diff --cached --quiet; then
            echo 'Sin cambios.'
            exit 0
          fi
          git commit -m 'Mejorar navegación y compactar barberos en móvil'
          git push
