name: Patch Admin Agenda
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject agenda colors script
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('admin.barberia_reutilizable.html')
          s=p.read_text(encoding='utf-8')
          tag='<script src="./admin-fijos.js"></script>'
          if tag not in s:
              marker='</body>'
              if marker not in s:
                  raise SystemExit('No se encontró </body>')
              s=s.replace(marker, tag+'\n'+marker, 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit patched HTML
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.barberia_reutilizable.html
          git diff --cached --quiet || git commit -m 'Conectar colores y fijos a la agenda'
          git push