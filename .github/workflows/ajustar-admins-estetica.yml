name: ajustar-admins-estetica
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  ajustar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Quitar barra fija y Salir
        shell: bash
        run: |
          set -e
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
              Path('admins/originales/admin.nails.html'),
              Path('admins/originales/admin.lashes.html'),
              Path('admins/originales/admin.estetica.html'),
          ]
          for p in files:
              s = p.read_text(encoding='utf-8')
              s = re.sub(r'\\.top\\{position:sticky;', '.top{', s, count=1)
              s = re.sub(r'<button\\s+id=["\\\']logout["\\\'][^>]*>Salir</button>', '', s, count=1)
              s = re.sub(r"\\$\\(['\"]logout['\"]\\)\\.[^;]*(?:\\}\\);|\\};)", '', s, count=1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit changes and remove temporary workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admins/originales/admin.nails.html admins/originales/admin.lashes.html admins/originales/admin.estetica.html
          if git diff --cached --quiet; then
            git rm .github/workflows/ajustar-admins-estetica.yml
            git commit -m "Eliminar workflow temporal de ajuste"
            git push
            exit 0
          fi
          git commit -m "Ajustar admins estetica sin barra fija ni salir"
          git rm .github/workflows/ajustar-admins-estetica.yml
          git commit -m "Eliminar workflow temporal de ajuste"
          git push
