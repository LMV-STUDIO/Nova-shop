name: Aplicar diseño editorial al resto
on:
  push:
    paths:
      - '.github/workflows/aplicar-diseno-editorial-resto.yml'
      - 'trigger-editorial.txt'
permissions:
  contents: write
jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reemplazar páginas por versiones editoriales
        run: |
          cp lashes-kora.html lashes.html
          cp estetica-kora.html estetica.html
          cp barberia-kora.html barberia.html
          cp comida-kora.html comida.html
          cp ferreteria-kora.html ferreteria.html
      - name: Publicar cambios
        run: |
          git config user.name "LMV Studio Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lashes.html estetica.html barberia.html comida.html ferreteria.html ropa.html
          git diff --cached --quiet && exit 0
          git commit -m "Aplicar diseño editorial premium a páginas restantes"
          git push
