name: Ajustar enlaces de demos públicas

on:
  push:
    paths:
      - '.github/workflows/aislar-demos-publicas.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir enlaces
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('lmv-studio.html')
          s = p.read_text(encoding='utf-8')
          fixes = {
            'admin.demo-cliente.html?rubro=nails': 'admin.demo-publico-nails.html',
            'admin.demo-cliente.html?rubro=lashes': 'admin.demo-publico-lashes.html',
            'admin.demo-cliente.html?rubro=cosmetologia': 'admin.demo-publico-cosmetologia.html',
            'admin.demo-cliente.html?rubro=depilacion-laser': 'admin.demo-publico-depilacion-laser.html',
            'admin.demo-cliente.html?rubro=comida': 'admin.demo-publico-comida.html',
            'ferreteria.html': 'demo-cliente.html?rubro=ferreteria',
            'admin.ferreteria.html': 'admin.demo-publico-ferreteria.html',
          }
          for old, new in fixes.items():
            s = s.replace(old, new)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lmv-studio.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Corregir enlaces de demos públicas'
          git push