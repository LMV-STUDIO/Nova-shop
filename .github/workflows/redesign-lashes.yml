name: Redesign Lashes
on:
  push:
    paths:
      - 'trigger-lashes-visual-2.txt'
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply
        shell: python
        run: |
          from pathlib import Path
          p=Path('lashes.html')
          s=p.read_text(encoding='utf-8')
          css='''<style id="lmv-lashes-premium-2">html{scroll-behavior:smooth}body{background:#f7f3ef!important;color:#191519!important;font-family:Manrope,system-ui,sans-serif!important}.nav{position:fixed!important;top:0!important;left:0!important;right:0!important;height:78px!important;padding:0 5vw!important;background:rgba(247,243,239,.9)!important;border-bottom:1px solid rgba(25,21,25,.1)!important;backdrop-filter:blur(16px);z-index:20!important}.links a{padding:9px 13px;border-radius:999px;transition:.25s}.links a:hover{background:#e9e0e3}.hero{min-height:auto!important;padding:108px 5vw 78px!important;grid-template-columns:1fr .92fr!important;gap:5vw!important;background:#f7f3ef!important}.hero h1{font-size:clamp(64px,10vw,136px)!important;line-height:.82!important;font-weight:700!important;margin:25px 0 30px!important}.heroimg{height:650px!important;border-radius:2px 2px 110px 2px!important;box-shadow:0 24px 60px rgba(55,37,45,.12)}.hero .btn,.contact .btn,.box .btn{border-radius:999px!important;background:#191519!important;color:#fff!important;border-color:#191519!important;font-family:Manrope,sans-serif!important;font-weight:800!important}.section{padding:110px 5vw!important}.section h2{font-size:clamp(45px,6.5vw,84px)!important;line-height:.9!important;font-weight:700!important}.dark{background:#211d25!important;color:#f7f3ef!important}.services{grid-template-columns:repeat(2,1fr)!important;gap:12px!important}.service{height:410px!important;border-radius:0!important}.serviceInfo{left:16px!important;right:16px!important;bottom:16px!important;background:linear-gradient(180deg,transparent,rgba(22,17,22,.92))!important;padding:55px 15px 14px!important}.service:after{background:#c6a4b1!important;color:#211d25!important}.price{color:#f1dce4!important}.steps{border-top:1px solid #d8d0ca!important}.gallery{grid-template-columns:1.35fr .65fr!important;gap:12px!important}.gallery div{height:450px!important;filter:saturate(.86)}.contact{background:#c8a5b2!important;padding:110px 5vw!important}.contact h2{font-size:clamp(60px,9.5vw,128px)!important;line-height:.84!important}.modal{background:rgba(24,19,24,.72)!important;backdrop-filter:blur(8px)}.box{background:#f7f3ef!important;box-shadow:0 30px 80px rgba(0,0,0,.25)!important}.close{width:36px!important;height:36px!important;border-radius:50%!important;background:#211d25!important;color:#fff!important}@media(max-width:800px){.hero{grid-template-columns:1fr!important;padding:85px 6vw 65px!important}.heroimg{height:500px!important;border-radius:2px 2px 70px 2px!important}.section{padding:80px 6vw!important}.services{grid-template-columns:1fr!important}.service{height:380px!important}.facts,.steps{grid-template-columns:1fr!important}.fact,.step{border-right:0!important;border-bottom:1px solid #d8d0ca!important}.gallery{grid-template-columns:1fr!important}.gallery div{height:360px!important}.contact{padding:80px 6vw!important}}@media(max-width:480px){.heroimg{height:430px!important}.service{height:350px!important}}</style>'''
          import re
          s=re.sub(r'<style id="lmv-lashes-premium-2">.*?</style>','',s,flags=re.S)
          s=s.replace('</style>',css+'</style>',1)
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lashes.html
          git commit -m 'feat: premium lashes visual'
          git push
