name: restaurar-admins-estetica
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  restaurar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar archivos originales
        shell: bash
        run: |
          set -e
          git checkout 7bdd9d3e730e765753ea191a79387f80ac72a8f1 -- \
            admins/originales/admin.nails.html \
            admins/originales/admin.lashes.html \
            admins/originales/admin.estetica.html
          python3 - <<'PY'
          from pathlib import Path
          import re
          files = [
              Path('admins/originales/admin.nails.html'),
              Path('admins/originales/admin.lashes.html'),
              Path('admins/originales/admin.estetica.html'),
          ]
          for p in files:
              s = p.read_text(encoding='utf-8')
              # Quitar solamente la fijación de la barra superior.
              s = s.replace('.top{position:sticky;', '.top{', 1)
              # Quitar solamente el botón Salir del HTML.
              s = re.sub(r'<button\s+id=["\']logout["\'][^>]*>Salir</button>', '', s, count=1)
              # Quitar solamente el listener de logout, sin tocar el resto del JS.
              s = re.sub(r"\$\(['\"]logout['\"]\)\.addEventListener\('click',async\(\)=>\{await s\.auth\.signOut\(\);location\.reload\(\)\);?", '', s, count=1)
              s = re.sub(r"\$\(['\"]logout['\"]\)\.onclick=async\(\)=>\{await s\.auth\.signOut\(\);location\.reload\(\)\};?", '', s, count=1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit y eliminar workflow temporal
        shell: bash
        run: |
          set -e
          git config user.name "LMV-STUDIO"
          git config user.email "matiasvitaleimm@gmail.com"
          git add admins/originales/admin.nails.html admins/originales/admin.lashes.html admins/originales/admin.estetica.html
          git commit -m "Restaurar admins y quitar solo barra fija y Salir"
          git rm .github/workflows/restaurar-admins-estetica.yml
          git commit -m "Eliminar workflow temporal de restauracion"
          git push
