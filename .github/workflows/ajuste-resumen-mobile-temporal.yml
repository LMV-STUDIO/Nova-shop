name: Ajuste temporal resumen mobile
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/ajuste-resumen-mobile-temporal.yml'
      - 'admins/originales/admin.estetica.html'
      - 'admins/originales/admin.nails.html'
      - 'admins/originales/admin.lashes.html'
      - 'admins/originales/admin.depilacion-laser.html'
      - 'admins/originales/admin.comida.html'
      - 'admins/originales/admin.ferreteria.html'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ajustar resumen móvil vertical
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files = [
            'admins/originales/admin.estetica.html',
            'admins/originales/admin.nails.html',
            'admins/originales/admin.lashes.html',
            'admins/originales/admin.depilacion-laser.html',
            'admins/originales/admin.comida.html',
            'admins/originales/admin.ferreteria.html',
          ]
          css = '''\n/* Ajuste LMV Studio: resumen cómodo en celular vertical */\n@media(max-width:600px){\n  .stats{grid-template-columns:1fr!important;gap:8px!important;margin:8px 0 18px!important}\n  .stat{min-height:64px!important;padding:12px 15px!important;display:flex!important;align-items:center!important;justify-content:space-between!important;gap:12px!important}\n  .stat strong{font-size:25px!important;line-height:1!important;margin:0!important}\n  .stat span{font-size:12px!important;text-align:right!important}\n}\n'''
          for name in files:
              p=Path(name)
              if not p.exists():
                  continue
              s=p.read_text(encoding='utf-8')
              if 'Ajuste LMV Studio: resumen cómodo en celular vertical' not in s:
                  s=s.replace('</style>', css+'</style>', 1)
                  p.write_text(s, encoding='utf-8')
          PY
          rm -f .github/workflows/ajuste-resumen-mobile-temporal.yml
      - name: Commit cambios
        run: |
          git config user.name 'LMV Studio Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admins/originales .github/workflows/ajuste-resumen-mobile-temporal.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Mejorar resumen de admins en celular vertical'
          git push
