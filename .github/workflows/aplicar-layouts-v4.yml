name: Aplicar layouts V4 clientes
on: push
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inyectar V4 en las 8 páginas
        run: |
          python3 <<'PY'
          from pathlib import Path
          files=['nails.html','lashes.html','estetica.html','depilacion-laser.html','barberia.html','comida.html','ferreteria.html','ropa.html']
          for name in files:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              for href in ['lmv-layouts-v4.css','lmv-layouts-v4-ui.css']:
                  if href not in s:
                      s=s.replace('</head>', f'<link rel="stylesheet" href="{href}"></head>', 1)
              if 'lmv-layouts-v4.js' not in s:
                  s=s.replace('</body>', '<script src="lmv-layouts-v4.js"></script></body>', 1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Guardar cambios
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nails.html lashes.html estetica.html depilacion-laser.html barberia.html comida.html ferreteria.html ropa.html
          git diff --cached --quiet || git commit -m 'feat: layouts V4 radicalmente distintos por rubro'
          git push
