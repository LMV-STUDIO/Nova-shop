name: Repair Lashes HTML
on:
  push:
    paths:
      - 'trigger-lashes-repair.txt'
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Repair nested style
        shell: python
        run: |
          from pathlib import Path
          import re
          p=Path('lashes.html')
          s=p.read_text(encoding='utf-8')
          s=re.sub(r'<style id="lmv-lashes-premium">.*?</style>\s*', '', s, flags=re.S)
          s=re.sub(r'<style id="lmv-lashes-premium-2">(.*?)</style>', lambda m:m.group(1), s, flags=re.S)
          s=s.replace('</style>\n</style>', '</style>')
          p.write_text(s,encoding='utf-8')
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lashes.html
          git commit -m 'fix: repair lashes premium HTML'
          git push
