name: Fix Nails visual
on:
  push:
    paths:
      - trigger-nails-visual.txt
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild Nails from Lashes visual template
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          lashes = Path('lashes.html').read_text(encoding='utf-8')
          nails = Path('nails.html').read_text(encoding='utf-8')
          style = re.search(r'<style>(.*?)</style>', lashes, re.S).group(1)
          nails_script = re.search(r'<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>(.*?)</script>', nails, re.S).group(1)

          extra = r'''
          /* Nails uses the same LMV/Lashes visual system, with a rose accent and the existing Nails booking logic. */
          :root{--rose:#c98ea8;--rose2:#ead2dc}
          .nailsServices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
          .nailsColumn{background:var(--cream);border:1px solid var(--line)}
          .nailsColumnHead{padding:18px 22px;border-bottom:1px solid var(--line);font:500 10px var(--mono);letter-spacing:.15em;color:var(--rose)}
          .nailsColumnBody{display:grid;gap:12px;padding:12px}
          .serviceBox{background:var(--cream);border:1px solid var(--line);min-height:250px;padding:24px;display:flex;flex-direction:column;justify-content:space-between;transition:.3s}
          .serviceBox:hover{transform:translateY(-5px);border-color:#c9aab4;box-shadow:0 18px 40px rgba(50,43,61,.08)}
          .serviceNo{font:500 10px var(--mono);color:#aaa19a}.serviceName{font-size:20px;line-height:1.2;font-weight:600;margin:26px 0 8px}.serviceDesc{font-size:12px;color:var(--muted);line-height:1.65;margin:0;max-width:520px}.serviceBottom{display:flex;justify-content:space-between;align-items:end;gap:15px;margin-top:24px}.servicePrice{font-size:15px;font-weight:800;color:var(--rose)}.serviceMeta{font:500 10px var(--mono);color:#918a82;margin-top:7px}.serviceBtn{border:1px solid var(--ink);background:transparent;color:var(--ink);padding:11px 15px;border-radius:999px;font:800 11px var(--sans);cursor:pointer;transition:.25s}.serviceBtn:hover,.serviceBtn.active{background:var(--rose);border-color:var(--rose);color:#fff;transform:translateY(-2px)}
          .servicePicks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.pick{border:1px solid var(--line);background:#fff;padding:14px;text-align:left;cursor:pointer;transition:.2s;border-radius:0}.pick strong{display:block;font-size:12px}.pick small{display:block;color:var(--muted);margin-top:6px;font-size:10px}.pick.active{background:var(--ink);color:#fff;border-color:var(--ink)}.pick.active small{color:#ddd}
          .selected{padding:13px 15px;background:var(--rose2);font-size:12px;font-weight:800;margin-top:12px}.label{display:block;font:500 10px var(--mono);text-transform:uppercase;letter-spacing:.1em;color:#77706c;margin-bottom:8px}.input{width:100%;padding:13px 14px;border:1px solid #d7d0c7;background:#fff;font:500 13px var(--sans);outline:0}.input:focus{border-color:var(--rose);box-shadow:0 0 0 3px rgba(201,142,168,.1)}.total{margin:18px 0;padding:17px 0;border-top:1px solid var(--ink);border-bottom:1px solid var(--ink);display:flex;justify-content:space-between;font:500 10px var(--mono);text-transform:uppercase}.msg{font-size:11px;font-weight:700;margin-top:10px;min-height:16px}.empty{color:var(--muted);padding:20px}
          @media(max-width:900px){.nailsServices{grid-template-columns:1fr}.servicePicks{grid-template-columns:1fr}}
          @media(max-width:600px){.serviceBottom{align-items:flex-start;flex-direction:column}.serviceBtn{width:100%}}
          '''
          style = style + extra

          body = r'''
          <body>
          <header class="wrap"><nav class="nav"><a class="brand" href="#top"><span>LMV</span> / NAILS</a><div class="navlinks"><a href="#servicios">Servicios</a><a href="#inspiracion">Inspiración</a><a href="#reservar">Reservar</a><a href="#contacto">Contacto</a></div><button class="menu" onclick="document.getElementById('drawer').style.display='block'">☰</button></nav></header>
          <main id="top">
          <section class="hero wrap"><div class="heroGrid"><div class="heroCopy"><div class="eyebrow">Nails · diseño y cuidado personalizado</div><h1 id="nombre">Tu próxima<br><em>manicura.</em></h1><p class="lead" id="descripcion">Un espacio para cuidar tus manos, elegir tu diseño y reservar tu turno de forma simple.</p><div class="heroActions"><a class="btn rose" href="#reservar">Reservar turno ↗</a><a class="btn light" href="#servicios">Ver servicios</a></div><div class="heroFacts"><div class="fact"><b>01 · Cuidado</b><span>Manos cuidadas</span></div><div class="fact"><b>02 · Diseño</b><span>Tu estilo</span></div><div class="fact"><b>03 · Agenda</b><span>Reserva online</span></div></div></div><div class="heroVisual"><div class="heroImage" style="background-image:linear-gradient(145deg,rgba(26,21,35,.03),rgba(201,142,168,.18)),url('https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=1500&q=90');background-size:cover;background-position:center"></div><div class="orbit">✦</div><div class="stamp"><div><strong>LMV</strong><br>NAIL STUDIO<br>—<br>BOOK ONLINE</div></div><div class="vertical">CUIDADO · DISEÑO · EXPERIENCIA</div></div></div></section>
          <div class="marquee"><div class="track"><span>NAIL STUDIO <i>✦</i> DISEÑOS ÚNICOS <i>✦</i> CUIDADO PERSONALIZADO <i>✦</i> LMV STUDIO <i>✦</i></span><span>NAIL STUDIO <i>✦</i> DISEÑOS ÚNICOS <i>✦</i> CUIDADO PERSONALIZADO <i>✦</i> LMV STUDIO <i>✦</i></span></div></div>
          <section class="section wrap reveal"><div class="sectionHead"><div><div class="kicker">01 / Nails</div><h2>Un estudio<br><em>pensado para vos.</em></h2></div><p id="info">Cada detalle importa: desde la elección del servicio hasta el momento de reservar. Conocé las opciones disponibles y armá tu turno.</p></div><div class="zones"><div class="zone" style="--img:url('https://images.unsplash.com/photo-1610992015732-2449b76344bc?auto=format&fit=crop&w=900&q=85')"><div class="zoneContent"><span class="zoneNum">01</span><h3>Manicura</h3><p>Preparación y cuidado para tus manos.</p></div></div><div class="zone" style="--img:url('https://images.unsplash.com/photo-1632345031435-8727f6897d53?auto=format&fit=crop&w=900&q=85')"><div class="zoneContent"><span class="zoneNum">02</span><h3>Nail art</h3><p>Detalles y diseños para tu estilo.</p></div></div><div class="zone" style="--img:url('https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=900&q=85')"><div class="zoneContent"><span class="zoneNum">03</span><h3>Extensiones</h3><p>Opciones para transformar tu look.</p></div></div><div class="zone" style="--img:url('https://images.unsplash.com/photo-1519014816548-bf5fe059798b?auto=format&fit=crop&w=900&q=85')"><div class="zoneContent"><span class="zoneNum">04</span><h3>Diseño</h3><p>Una propuesta pensada especialmente para vos.</p></div></div></div></section>
          <section class="section wrap reveal" id="servicios"><div class="serviceIntro"><div><div class="kicker">02 / Servicios</div><h2>Elegí tu<br><em>servicio.</em></h2></div><p>Los servicios, precios y duración se cargan desde la configuración del negocio. Podés combinar un principal con complementarios.</p></div><div class="nailsServices"><div class="nailsColumn"><div class="nailsColumnHead">01 / PRINCIPALES</div><div class="nailsColumnBody" id="principales"></div></div><div class="nailsColumn"><div class="nailsColumnHead">02 / COMPLEMENTARIOS</div><div class="nailsColumnBody" id="complementarios"></div></div></div></section>
          <section class="section wrap reveal" id="inspiracion"><div class="sectionHead"><div><div class="kicker">03 / Inspiración</div><h2>Ideas para<br><em>elegir.</em></h2></div><p>Una selección visual para imaginar tu próximo turno. El resultado final se adapta al servicio que elijas.</p></div><div class="zones"><div class="zone" style="--img:url('https://images.unsplash.com/photo-1610992015732-2449b76344bc?auto=format&fit=crop&w=900&q=85')"><div class="zoneContent"><span class="zoneNum">01</span><h3>Detalle</h3><p>Pequeños detalles que cambian todo.</p></div></div><div class="zone" style="--img:url('https://images.unsplash.com/photo-1632345031435-8727f6897d53?auto=format&fit=crop&w=900&q=85')"><div class="zoneContent"><span class="zoneNum">02</span><h3>Color</h3><p>Elegí una paleta que vaya con vos.</p></div></div><div class="zone" style="--img:url('https://images.unsplash.com/photo-1604654894610-df63bc536371?auto=format&fit=crop&w=900&q=85')"><div class="zoneContent"><span class="zoneNum">03</span><h3>Forma</h3><p>Encontrá el acabado que buscás.</p></div></div><div class="zone" style="--img:url('https://images.unsplash.com/photo-1519014816548-bf5fe059798b?auto=format&fit=crop&w=900&q=85')"><div class="zoneContent"><span class="zoneNum">04</span><h3>Tu estilo</h3><p>Una combinación pensada para vos.</p></div></div></div></section>
          <section class="section wrap reveal" id="reservar"><div class="booking"><div class="bookingGrid"><div class="bookingCopy"><div class="kicker">04 / Reserva online</div><h2>Elegí tu<br><em>momento.</em></h2><p>Seleccioná un servicio principal, sumá complementarios si querés, elegí un día y encontrá un horario disponible.</p><div class="bookingNote">La disponibilidad se calcula con los horarios configurados para el negocio y los turnos ya reservados.</div></div><div class="form"><div class="selectedBox" id="selection">Elegí un servicio principal.</div><div class="field"><div class="label">01 — Servicios</div><div class="servicePicks" id="picks"></div></div><div class="field"><label class="label" for="cliente">02 — Tu nombre</label><input class="input" id="cliente" autocomplete="name" placeholder="Tu nombre"></div><div class="field"><div class="label">03 — Día</div><div class="days" id="days"></div></div><div class="field"><div class="label">04 — Horario</div><div class="slots" id="slots"></div></div><div class="total"><span>Total</span><strong id="total">$0 · 0 min</strong></div><button class="btn rose" id="reserve">Confirmar turno ↗</button><div class="msg" id="msg"></div></div></div></div></section>
          <section class="contact wrap reveal" id="contacto"><div class="contactGrid"><article class="contactCard"><div class="kicker">05 / Studio</div><h2>Encontranos<br><em>fácil.</em></h2><p>Todos los datos del negocio se muestran automáticamente desde LMV Studio.</p><div class="contactInfo"><div><b>DIRECCIÓN</b><span id="direccion">Cargando...</span></div><div><b>TELÉFONO</b><span id="telefono">Cargando...</span></div><div><b>INSTAGRAM</b><span id="instagram">Cargando...</span></div></div></article><article class="contactCard dark"><div class="kicker">Hablemos</div><h2>¿Tenés<br><em>una consulta?</em></h2><p>Escribinos antes de reservar si querés consultar por un servicio o diseño.</p><div class="contactLinks"><a id="ig" href="#" target="_blank">Instagram ↗</a><a id="wa" href="#" target="_blank">WhatsApp ↗</a><a id="map" href="#" target="_blank">Cómo llegar ↗</a></div></article></div></section>
          </main>
          <footer class="wrap footer"><span id="foot">LMV Studio · Nails</span><span>Diseñado por LMV Studio · 2026</span></footer>
          <div id="drawer" class="mobileDrawer"><div style="position:absolute;inset:0;background:rgba(20,17,24,.5)" onclick="document.getElementById('drawer').style.display='none'"></div><div style="position:absolute;left:0;top:0;height:100%;width:min(330px,88vw);background:var(--cream);padding:25px"><div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:35px;font-weight:800">LMV · NAILS <button onclick="document.getElementById('drawer').style.display='none'" style="border:0;border-radius:50%;width:40px;height:40px;background:#e8e3db;font-size:20px">×</button></div><div style="display:grid;gap:8px"><a href="#servicios" style="padding:12px 0">01 · Servicios</a><a href="#inspiracion" style="padding:12px 0">02 · Inspiración</a><a href="#reservar" style="padding:12px 0">03 · Reservar</a><a href="#contacto" style="padding:12px 0">04 · Contacto</a></div></div></div>
          <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
          ''' + nails_script + r'''
          </script></body></html>
          '''

          # Make the existing Nails JS work with the new visual structure.
          html = '<!doctype html><html lang="es" data-lmv-rubro="nails"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nails — LMV Studio</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&display=swap" rel="stylesheet"><style>' + style + '</style></head>' + body
          Path('nails.html').write_text(html, encoding='utf-8')
          PY
          git config user.name "LMV-STUDIO"
          git config user.email "matiasvitaleimm@gmail.com"
          git add nails.html
          git commit -m "Unificar Nails con el diseño de Lashes" || exit 0
          git push
