name: Crear admin exclusivo Prueba 3
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  crear:
    if: ${{ !contains(github.event.head_commit.message, 'Crear admin exclusivo Prueba 3') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Crear copia y compactar Barberos
        shell: bash
        run: |
          if [ -f admin.barberia_prueba3.html ]; then
            echo 'La copia ya existe. No se modifica.'
            exit 0
          fi
          cp admin.barberia_reutilizable.html admin.barberia_prueba3.html
          python3 - <<'PY'
          from pathlib import Path
          p = Path('admin.barberia_prueba3.html')
          s = p.read_text(encoding='utf-8')

          old = '''redirectTo:\n                    "https://lmv-studio.github.io/Nova-shop/admin.barberia_reutilizable.html" +\n                    window.location.search'''
          new = '''redirectTo:\n                    "https://lmv-studio.github.io/Nova-shop/admin.barberia_prueba3.html" +\n                    window.location.search'''
          s = s.replace(old, new)

          old = '''                    <p\n                        style="\n                            color:var(--gris);\n                            font-size:13px;\n                            margin-bottom:20px;\n                        ">\n                        Estos horarios son los que utiliza la agenda para mostrar\n                        los turnos disponibles.\n                    </p>\n'''
          s = s.replace(old, '')

          css = r'''
<style id="prueba3-barberos-compacto">
/* PRUEBA 3 - BARBEROS / HORARIOS COMPACTOS */
@media(max-width:750px){
  #seccion-barberos .card{
    padding:14px!important;
    margin-bottom:12px!important;
    border-radius:12px!important;
  }
  #seccion-barberos .card h3{
    font-size:17px!important;
    margin-bottom:12px!important;
  }
  #seccion-barberos #horariosBarberos > .card{
    background:#141414!important;
  }
  #seccion-barberos #horariosBarberos > .card > div[style*="display:grid"]{
    grid-template-columns:72px minmax(0,1fr) minmax(0,1fr) 54px!important;
    gap:6px!important;
    margin-bottom:7px!important;
    padding:6px 0!important;
    border-bottom:1px solid #242424;
  }
  #seccion-barberos #horariosBarberos > .card > div[style*="display:grid"] > strong{
    font-size:11px!important;
    color:#ddd!important;
    line-height:1.1!important;
  }
  #seccion-barberos #horariosBarberos input[type="time"]{
    min-width:0!important;
    padding:8px 5px!important;
    font-size:12px!important;
    height:36px!important;
  }
  #seccion-barberos #horariosBarberos label{
    justify-content:center!important;
    font-size:0!important;
    color:#777!important;
    white-space:nowrap!important;
  }
  #seccion-barberos #horariosBarberos label input[type="checkbox"]{
    width:18px!important;
    height:18px!important;
    margin:0!important;
    accent-color:#d4af37;
  }
  #seccion-barberos #horariosBarberos .btn{
    width:100%!important;
    min-height:42px!important;
    margin-top:8px!important;
  }
}
@media(max-width:390px){
  #seccion-barberos #horariosBarberos > .card > div[style*="display:grid"]{
    grid-template-columns:62px minmax(0,1fr) minmax(0,1fr) 44px!important;
    gap:5px!important;
  }
  #seccion-barberos #horariosBarberos > .card > div[style*="display:grid"] > strong{
    font-size:10px!important;
  }
}
</style>
'''
          s = s.replace('</head>', css + '</head>', 1)
          p.write_text(s, encoding='utf-8')
          PY
          git config user.name 'LMV-STUDIO'
          git config user.email 'matiasvitaleimm@gmail.com'
          git add admin.barberia_prueba3.html
          git commit -m 'Crear admin exclusivo Prueba 3' || exit 0
          git push
