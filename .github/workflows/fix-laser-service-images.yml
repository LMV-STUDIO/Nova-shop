name: Fix laser service images

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[laser-image-fix]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Patch laser service images
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('depilacion-laser.html')
          s = p.read_text(encoding='utf-8')

          new_maps = r'''const SERVICE_IMAGES={
          piernas:'https://images.pexels.com/photos/19239109/pexels-photo-19239109.jpeg?auto=compress&cs=tinysrgb&w=1200',
          pierna:'https://images.pexels.com/photos/19239109/pexels-photo-19239109.jpeg?auto=compress&cs=tinysrgb&w=1200',
          axilas:'https://images.pexels.com/photos/29021129/pexels-photo-29021129.jpeg?auto=compress&cs=tinysrgb&w=1200',
          axila:'https://images.pexels.com/photos/29021129/pexels-photo-29021129.jpeg?auto=compress&cs=tinysrgb&w=1200',
          axilar:'https://images.pexels.com/photos/29021129/pexels-photo-29021129.jpeg?auto=compress&cs=tinysrgb&w=1200',
          bozo:'https://images.pexels.com/photos/29021128/pexels-photo-29021128.jpeg?auto=compress&cs=tinysrgb&w=1200',
          menton:'https://images.pexels.com/photos/29021128/pexels-photo-29021128.jpeg?auto=compress&cs=tinysrgb&w=1200',
          labio:'https://images.pexels.com/photos/29021128/pexels-photo-29021128.jpeg?auto=compress&cs=tinysrgb&w=1200',
          rostro:'https://images.pexels.com/photos/29021128/pexels-photo-29021128.jpeg?auto=compress&cs=tinysrgb&w=1200',
          facial:'https://images.pexels.com/photos/29021128/pexels-photo-29021128.jpeg?auto=compress&cs=tinysrgb&w=1200',
          cara:'https://images.pexels.com/photos/29021128/pexels-photo-29021128.jpeg?auto=compress&cs=tinysrgb&w=1200',
          cuerpo:'https://images.pexels.com/photos/29021130/pexels-photo-29021130.jpeg?auto=compress&cs=tinysrgb&w=1200',
          brazos:'https://images.pexels.com/photos/29021130/pexels-photo-29021130.jpeg?auto=compress&cs=tinysrgb&w=1200',
          brazo:'https://images.pexels.com/photos/29021130/pexels-photo-29021130.jpeg?auto=compress&cs=tinysrgb&w=1200',
          espalda:'https://images.pexels.com/photos/29021130/pexels-photo-29021130.jpeg?auto=compress&cs=tinysrgb&w=1200',
          abdomen:'https://images.pexels.com/photos/29021130/pexels-photo-29021130.jpeg?auto=compress&cs=tinysrgb&w=1200',
          torso:'https://images.pexels.com/photos/29021130/pexels-photo-29021130.jpeg?auto=compress&cs=tinysrgb&w=1200',
          cavado:'https://images.pexels.com/photos/16032366/pexels-photo-16032366.jpeg?auto=compress&cs=tinysrgb&w=1200'
          };
          const SERVICE_IMAGE_BY_ID={
          'ecdd222d-716f-428e-9997-00079f2848b7':'https://images.pexels.com/photos/29021129/pexels-photo-29021129.jpeg?auto=compress&cs=tinysrgb&w=1200',
          '896b3c5e-32e5-4dea-86ec-74e047038cb4':'https://images.pexels.com/photos/29021128/pexels-photo-29021128.jpeg?auto=compress&cs=tinysrgb&w=1200',
          '801dcdc5-ea7b-4eaf-b610-9921be9b9433':'https://images.pexels.com/photos/29021130/pexels-photo-29021130.jpeg?auto=compress&cs=tinysrgb&w=1200',
          '4395b0a6-3573-427c-9f91-fba19bce2c1f':'https://images.pexels.com/photos/16032366/pexels-photo-16032366.jpeg?auto=compress&cs=tinysrgb&w=1200',
          'a1f487d4-5a9c-428d-91de-013ca7c2f3be':'https://images.pexels.com/photos/29021130/pexels-photo-29021130.jpeg?auto=compress&cs=tinysrgb&w=1200',
          '6335b18c-4a0d-4dc6-bcf6-479d4793af96':'https://images.pexels.com/photos/19239109/pexels-photo-19239109.jpeg?auto=compress&cs=tinysrgb&w=1200',
          '04db6b97-07c7-43dc-ad1a-f5588140f6aa':'https://images.pexels.com/photos/29021128/pexels-photo-29021128.jpeg?auto=compress&cs=tinysrgb&w=1200',
          '6cbfebd8-0413-4b60-a354-4ddf283d947c':'https://images.pexels.com/photos/19239109/pexels-photo-19239109.jpeg?auto=compress&cs=tinysrgb&w=1200'
          };
          const DEFAULT_SERVICE_IMAGE='https://images.pexels.com/photos/29021130/pexels-photo-29021130.jpeg?auto=compress&cs=tinysrgb&w=1200';'''

          s, n = re.subn(r"const SERVICE_IMAGES=.*?;const SERVICE_IMAGE_BY_ID=.*?;const DEFAULT_SERVICE_IMAGE=.*?;", new_maps, s, count=1, flags=re.S)
          if n != 1:
              raise SystemExit('SERVICE image maps not found')

          new_fn = "function serviceImage(x){if(x?.id&&SERVICE_IMAGE_BY_ID[x.id])return SERVICE_IMAGE_BY_ID[x.id];const text=normalize([x?.nombre,x?.categoria,x?.tipo_servicio].filter(Boolean).join(' '));for(const key of Object.keys(SERVICE_IMAGES))if(text.includes(normalize(key)))return SERVICE_IMAGES[key];return DEFAULT_SERVICE_IMAGE}"
          s, n = re.subn(r"function serviceImage\(x\)\{.*?\}", new_fn, s, count=1)
          if n != 1:
              raise SystemExit('serviceImage function not found')

          s = s.replace('loading="lazy"', 'loading="eager"')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit fix and remove one-shot workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add depilacion-laser.html
          git rm .github/workflows/fix-laser-service-images.yml
          git commit -m "fix: laser service images [laser-image-fix]"
          git push
