name: Fix laser service images
on:
  push:
    branches: [main]
    paths:
      - 'laser-fix-trigger.txt'
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Force service images like zone images
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('depilacion-laser.html')
          s=p.read_text(encoding='utf-8')
          marker='<!-- LMV LASER SERVICE IMAGE PATCH -->'
          if marker not in s:
              patch=r'''<!-- LMV LASER SERVICE IMAGE PATCH -->
<style>
.serviceImage.lmvServiceBg{background-position:center;background-size:cover;background-repeat:no-repeat}
.serviceImage.lmvServiceBg img{display:none!important}
</style>
<script>
(function(){
  const IMG={
    'ecdd222d-716f-428e-9997-00079f2848b7':'https://images.pexels.com/photos/29021129/pexels-photo-29021129.jpeg?auto=compress&cs=tinysrgb&w=900',
    '896b3c5e-32e5-4dea-86ec-74e047038cb4':'https://images.pexels.com/photos/29021128/pexels-photo-29021128.jpeg?auto=compress&cs=tinysrgb&w=900',
    '801dcdc5-ea7b-4eaf-b610-9921be9b9433':'https://images.pexels.com/photos/29021130/pexels-photo-29021130.jpeg?auto=compress&cs=tinysrgb&w=900',
    '4395b0a6-3573-427c-9f91-fba19bce2c1f':'https://images.pexels.com/photos/16032366/pexels-photo-16032366.jpeg?auto=compress&cs=tinysrgb&w=900',
    'a1f487d4-5a9c-428d-91de-013ca7c2f3be':'https://images.pexels.com/photos/29021130/pexels-photo-29021130.jpeg?auto=compress&cs=tinysrgb&w=900',
    '6335b18c-4a0d-4dc6-bcf6-479d4793af96':'https://images.pexels.com/photos/19239109/pexels-photo-19239109.jpeg?auto=compress&cs=tinysrgb&w=900',
    '04db6b97-07c7-43dc-ad1a-f5588140f6aa':'https://images.pexels.com/photos/29021128/pexels-photo-29021128.jpeg?auto=compress&cs=tinysrgb&w=900',
    '6cbfebd8-0413-4b60-a354-4ddf283d947c':'https://images.pexels.com/photos/19239109/pexels-photo-19239109.jpeg?auto=compress&cs=tinysrgb&w=900'
  };
  function apply(){
    document.querySelectorAll('.service').forEach(function(card,i){
      let box=card.querySelector('.serviceImage');
      if(!box){box=document.createElement('div');box.className='serviceImage';card.insertBefore(box,card.firstChild)}
      const btn=card.querySelector('button[onclick*="toggleService"]');
      const m=btn&&btn.getAttribute('onclick').match(/toggleService\(['\"]([^'\"]+)/);
      const fallback=['29021129','29021128','29021130','16032366','29021130','19239109','29021128','19239109'][i]||'29021130';
      const url=(m&&IMG[m[1]])||('https://images.pexels.com/photos/'+fallback+'/pexels-photo-'+fallback+'.jpeg?auto=compress&cs=tinysrgb&w=900');
      box.classList.add('lmvServiceBg');
      box.style.backgroundImage="url('"+url+"')";
      const old=box.querySelector('img'); if(old) old.remove();
    });
  }
  const ob=new MutationObserver(apply);
  ob.observe(document.body,{childList:true,subtree:true});
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',apply); else apply();
  setTimeout(apply,500);setTimeout(apply,1500);
})();
</script>
'''
              s=s.replace('</body>',patch+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add depilacion-laser.html
          git diff --cached --quiet || git commit -m 'make laser service photos use zone-style backgrounds'
          git push
