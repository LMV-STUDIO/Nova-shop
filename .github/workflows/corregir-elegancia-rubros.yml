name: Corregir elegancia rubros
on:
  push:
    paths:
      - trigger-elegancia.txt
jobs:
  fix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restaurar rubros que no debían cambiar
        run: |
          PARENT=644c4e9ebf678fb26cc03c46a550f4eb82096929
          for f in barberia.html comida.html ferreteria.html ropa.html; do
            git show "$PARENT:$f" > "$f"
          done
      - name: Agregar elegancia sin cambiar funcionalidad
        run: |
          python3 - <<'PY'
          from pathlib import Path
          css = {
          'nails.html': '''\n/* LMV ELEGANCE — solo visual */\n:root{--ink:#171416!important;--paper:#f7f3ee!important;--pink:#c98ea8!important;--pink2:#ead2dc!important;--line:#ddd2d7!important}\nbody{background:var(--paper)!important;color:var(--ink)!important}\n.heroVisual{box-shadow:0 30px 80px rgba(23,20,22,.12);filter:saturate(.88)}\nh1,h2{letter-spacing:-.055em!important}h1 em,h2 em{font-family:'Playfair Display',serif!important}\n.sectionHead h2,.serviceIntro h2,.bookingCopy h2{font-weight:500!important}\n.btn{border-radius:0!important;letter-spacing:.12em;box-shadow:none!important}\n.btn:hover{background:var(--pink)!important;border-color:var(--pink)!important}\n.servicesWrap{background:#1b1819!important}\n.serviceBox{background:#1b1819!important}\n.serviceBox:hover{background:#252122!important}\n.gallery img{filter:saturate(.86);transition:transform .6s ease,filter .6s ease}.gallery img:hover{transform:scale(1.015);filter:saturate(1)}\n.quote{background:var(--pink)!important}\n.form{box-shadow:0 25px 70px rgba(23,20,22,.08)}\n''',
          'lashes.html': '''\n/* LMV ELEGANCE — solo visual */\n@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');\nbody{font-family:Manrope,system-ui,sans-serif!important;background:#fbf7f9!important}\nh1,h2,h3{letter-spacing:-.035em}.hero h1{font-family:Manrope,sans-serif!important;font-weight:600!important}.hero{border-radius:0 0 4px 4px!important;background:linear-gradient(110deg,rgba(255,248,252,.94),rgba(255,232,245,.58)),url('https://images.unsplash.com/photo-1583001931096-959e9a1a6223?auto=format&fit=crop&w=1800&q=90') center/cover!important}.pill{border-radius:2px!important;letter-spacing:.1em;text-transform:uppercase;font-family:'DM Mono',monospace!important}.btn{border-radius:2px!important;letter-spacing:.08em;text-transform:uppercase}.btn.sec{border-radius:2px!important}.card,.serviceBox,.summary,.contact{border-radius:3px!important;box-shadow:0 22px 60px rgba(77,39,64,.07)!important}.card:hover,.serviceBox:hover,.contact:hover{transform:translateY(-3px)!important}.section{padding:90px 0}.booking{border-radius:4px!important;background:#211b20!important}.form{border-radius:3px!important}.day,.slot{border-radius:2px!important}.contactBtn{border-radius:2px!important;text-transform:uppercase;letter-spacing:.05em;font-size:11px}.serviceBox #services{gap:14px}.service{border-radius:3px!important}.heroIn{padding:80px 0}.hero p{max-width:650px}\n''',
          'estetica.html': '''\n/* LMV ELEGANCE — solo visual */\n@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Manrope:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');\nbody{font-family:Manrope,system-ui,sans-serif!important;background:#f3f0e9!important;color:#171817!important}.nav{background:#f3f0e9ee!important;backdrop-filter:blur(12px)}\n.hero h1{font-family:Manrope,sans-serif!important;font-weight:600!important;letter-spacing:-.065em}.hero i,h2 i{font-family:'Playfair Display',serif!important}.heroimg{filter:saturate(.78);box-shadow:0 30px 80px rgba(21,24,23,.12)}\n.btn{border-radius:0!important;letter-spacing:.12em}.section{padding-top:120px;padding-bottom:120px}.dark{background:#171817!important}.service{border-radius:2px!important}.serviceInfo{backdrop-filter:blur(8px)}.contact{padding-top:125px;padding-bottom:125px}.contact h2{letter-spacing:-.065em}.box{border-radius:0!important;box-shadow:0 30px 90px #0003}.box input,.box select{border-radius:0!important}\n'''
          }
          for f, block in css.items():
              p=Path(f); s=p.read_text(); marker='</style>'
              if 'LMV ELEGANCE — solo visual' not in s:
                  s=s.replace(marker, block+'\n'+marker, 1)
                  p.write_text(s)
          PY
      - name: Commit cambios
        run: |
          git config user.name 'LMV Studio Bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add barberia.html comida.html ferreteria.html ropa.html nails.html lashes.html estetica.html
          git commit -m 'Corregir elegancia: solo cosmetologia, lashes y nails' || exit 0
          git push
