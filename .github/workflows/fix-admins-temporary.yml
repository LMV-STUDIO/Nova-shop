name: Fix admin pages

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply surgical admin fixes
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          # Nails: the logout button was already removed from the HTML,
          # but its JS listener remained and crashed the whole script on load.
          p = Path('admins/originales/admin.nails.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("$('loginBtn').addEventListener('click',login);$('logout').addEventListener('click',async()=>{await s.auth.signOut();location.reload()});", "$('loginBtn').addEventListener('click',login);")
          p.write_text(s, encoding='utf-8')

          # Estética/Cosmetología: same leftover listener caused a JS error.
          p = Path('admins/originales/admin.estetica.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace("$('loginBtn').addEventListener('click',login);$('logout').addEventListener('click',async()=>{await s.auth.signOut();location.reload()});", "$('loginBtn').addEventListener('click',login);")
          p.write_text(s, encoding='utf-8')

          # Comida: remove the visible logout control while keeping the
          # existing Supabase auth/session logic intact.
          p = Path('admins/originales/admin.comida.html')
          s = p.read_text(encoding='utf-8')
          s = s.replace('<button class="btn red" onclick="salir()">Cerrar sesión</button>', '')
          s = s.replace('async function salir(){await s.auth.signOut();location.reload()}', '')
          s = s.replace('🌐 Página</a>', '🌐 Ver página</a>')
          p.write_text(s, encoding='utf-8')
          PY

          git diff -- admins/originales/admin.nails.html admins/originales/admin.comida.html admins/originales/admin.estetica.html

          if git diff --quiet -- admins/originales/admin.nails.html admins/originales/admin.comida.html admins/originales/admin.estetica.html; then
            echo "No changes required"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admins/originales/admin.nails.html admins/originales/admin.comida.html admins/originales/admin.estetica.html
          git commit -m "fix: repair demo admin refresh and controls"
          git push origin HEAD:main
