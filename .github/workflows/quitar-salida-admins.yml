name: Quitar salida de admins

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  ajustar:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar cambios
        shell: python
        run: |
          from pathlib import Path
          import re

          for path in Path('.').glob('admin.*.html'):
              text = path.read_text(encoding='utf-8')
              original = text

              # Quitar el botón de cerrar sesión, tanto en variantes #logout como .btn-salir.
              text = re.sub(r'\s*<button[^>]*(?:id=["\']logout["\'][^>]*|class=["\'][^"\']*btn-salir[^"\']*["\'][^>]*)[^>]*>.*?</button>', '', text, flags=re.I|re.S)
              text = re.sub(r'\s*<a[^>]*class=["\'][^"\']*btn-salir[^"\']*["\'][^>]*>.*?</a>', '', text, flags=re.I|re.S)

              # Quitar la barra superior fija/sticky al hacer scroll.
              text = text.replace('position:sticky;top:0;', '')
              text = text.replace('position:sticky;\n    top:0;', '')
              text = text.replace('position:fixed;\n    left:0;\n    top:0;\n    bottom:0;', 'position:absolute;\n    left:0;\n    top:0;')
              text = text.replace('position:fixed;left:0;top:0;bottom:0;', 'position:absolute;left:0;top:0;')

              if text != original:
                  path.write_text(text, encoding='utf-8')
                  print(f'Actualizado: {path}')

          Path('.github/workflows/quitar-salida-admins.yml').unlink(missing_ok=True)
      - name: Commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.*.html .github/workflows/quitar-salida-admins.yml
          git diff --cached --quiet && exit 0
          git commit -m 'Quitar salir y barra fija de admins'
          git push