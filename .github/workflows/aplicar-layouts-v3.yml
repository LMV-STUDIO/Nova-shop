name: Aplicar layouts V3 a clientes
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inyectar CSS V3
        run: |
          python3 - <<'PY'
          from pathlib import Path
          files=['nails.html','lashes.html','estetica.html','depilacion-laser.html','barberia.html','comida.html','ferreteria.html','ropa.html']
          tag='<link rel="stylesheet" href="lmv-layouts-v3.css">'
          for name in files:
              p=Path(name)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              if tag not in s:
                  s=s.replace('</head>',tag+'</head>',1)
                  p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nails.html lashes.html estetica.html depilacion-laser.html barberia.html comida.html ferreteria.html ropa.html
          git diff --cached --quiet || git commit -m 'feat: aplicar layouts V3 por rubro'
          git push
