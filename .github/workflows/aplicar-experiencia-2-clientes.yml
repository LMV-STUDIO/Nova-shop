name: Aplicar experiencia 2.0 a paginas cliente
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  redesign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inyectar experiencia y layouts V4
        run: |
          python3 <<'PY'
          from pathlib import Path
          files=['nails.html','lashes.html','estetica.html','depilacion-laser.html','barberia.html','comida.html','ferreteria.html','ropa.html']
          for fn in files:
              p=Path(fn)
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8')
              for href in ['lmv-experiencia-clientes.css','lmv-layouts-v3.css','lmv-layouts-v4.css','lmv-layouts-v4-ui.css']:
                  tag=f'<link rel="stylesheet" href="{href}">'
                  if tag not in s: s=s.replace('</head>',tag+'</head>',1)
              for src in ['lmv-experiencia-clientes.js','lmv-layouts-v4.js']:
                  tag=f'<script src="{src}"></script>'
                  if tag not in s: s=s.replace('</body>',tag+'</body>',1)
              p.write_text(s,encoding='utf-8')
          PY
      - name: Publicar
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add nails.html lashes.html estetica.html depilacion-laser.html barberia.html comida.html ferreteria.html ropa.html
          git diff --cached --quiet || git commit -m 'feat: layouts V4 radicalmente distintos por rubro'
          git push
