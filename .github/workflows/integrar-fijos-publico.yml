name: Integrar fijos semanales en página cliente

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  integrar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inyectar script público
        shell: python
        run: |
          from pathlib import Path
          p = Path('barberia.html')
          t = p.read_text(encoding='utf-8')
          tag = '<script src="./public-fijos.js"></script>'
          if tag not in t:
              marker = '</body>'
              if marker not in t:
                  raise SystemExit('No se encontró </body> en barberia.html')
              t = t.replace(marker, tag + '\n' + marker, 1)
              p.write_text(t, encoding='utf-8')

      - name: Commit cambios
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add barberia.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
            exit 0
          fi
          git commit -m "Integrar bloqueo de fijos en página cliente"
          git push
