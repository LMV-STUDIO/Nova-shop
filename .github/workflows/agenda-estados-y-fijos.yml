name: Wire agenda states and recurring fixed blocks

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inject reusable scripts
        shell: python
        run: |
          from pathlib import Path

          changes = []
          files = [
              ('admin.barberia_reutilizable.html', 'admin-fijos.js'),
              ('plantilla-barberia_reutilizable.html', 'public-fijos.js'),
          ]

          for html_name, js_name in files:
              p = Path(html_name)
              if not p.exists():
                  raise SystemExit(f'Missing {html_name}')
              t = p.read_text(encoding='utf-8')
              tag = f'<script src="./{js_name}"></script>'
              if tag not in t:
                  marker='</body>'
                  if marker not in t:
                      raise SystemExit(f'No </body> in {html_name}')
                  t=t.replace(marker, f'{tag}\n{marker}', 1)
                  p.write_text(t, encoding='utf-8')
                  changes.append(html_name)

          if not changes:
              print('Scripts already wired.')
              raise SystemExit(0)

      - name: Commit generated wiring
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.barberia_reutilizable.html plantilla-barberia_reutilizable.html
          git commit -m "Enable recurring fixed blocks and agenda colors"
          git push