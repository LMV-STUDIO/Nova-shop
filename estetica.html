<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Estética — LMV Studio</title><style>body{margin:0;font-family:Arial,sans-serif;background:#faf7f8;color:#241f22}.wrap{max-width:1050px;margin:auto;padding:22px}.hero{padding:28px;border-radius:22px;background:linear-gradient(135deg,#fff,#f3e7ec);border:1px solid #eadce2}.marca{font-size:14px;font-weight:800;letter-spacing:2px;color:#9b6178}.hero h1{margin:8px 0;font-size:38px}.muted{color:#766b71}.grid{display:grid;grid-template-columns:1.6fr 1fr;gap:18px;margin-top:18px}.card{background:#fff;border:1px solid #eadfe3;border-radius:18px;padding:20px;box-shadow:0 8px 25px rgba(50,30,40,.06)}.grupo{margin-bottom:24px}.grupo h2{margin-bottom:10px}.serv{border:1px solid #eee1e6;border-radius:14px;padding:15px;margin:10px 0}.serv h3{margin:0 0 6px}.precio{font-weight:800;font-size:18px}.btn{border:0;border-radius:10px;padding:11px 14px;background:#9b6178;color:#fff;font-weight:800;cursor:pointer}.campo{margin:10px 0}.campo label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.campo input{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd0d7;border-radius:9px;background:#fff}.msg{margin-top:10px;font-weight:700}.ok{color:#3c7b52}.err{color:#a33b4b}@media(max-width:760px){.grid{grid-template-columns:1fr}.hero h1{font-size:30px}}</style></head><body><div class="wrap"><section class="hero"><div class="marca" id="rubro">LMV STUDIO · ESTÉTICA</div><h1 id="nombre">Cargando...</h1><div class="muted" id="info"></div></section><div class="grid"><main class="card"><div id="catalogo">Cargando servicios...</div></main><aside class="card"><h2>Reservar turno</h2><div id="seleccion">Elegí un servicio.</div><div class="campo"><label>Fecha y hora</label><input id="fecha" type="datetime-local"></div><div class="campo"><label>Tu nombre</label><input id="cliente"></div><button id="reservarBtn" class="btn">Reservar turno</button><div id="msg" class="msg"></div></aside></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const s=window.supabase.createClient('https://cqelidpshitntewsktwx.supabase.co','sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD');const p=new URLSearchParams(location.search),id=p.get('negocio'),rubro=p.get('rubro')||'cosmetologia';const labels={cosmetologia:'✨ COSMETOLOGÍA',depilacion_laser:'⚡ DEPILACIÓN LÁSER',lashes_nails:'💅 LASHES & NAILS'};let servicios=[],seleccion=null;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));async function init(){if(!id)return;$('rubro').textContent='LMV STUDIO · '+(labels[rubro]||'ESTÉTICA');const b=await s.from('negocios').select('nombre,telefono,dirección,instagram,descripcion,estetica_secciones').eq('id',id).single();if(b.error){$('nombre').textContent='No se pudo cargar';return}$('nombre').textContent=b.data.nombre;$('info').textContent=[b.data.descripcion,b.data.dirección,b.data.telefono].filter(Boolean).join(' · ');const sec=b.data.estetica_secciones||{nails:true,lashes:true};const r=await s.from('servicios').select('id,nombre,descripcion,precio,duracion_minutos,categoria').eq('negocio_id',id).eq('activo',true).order('nombre');if(r.error){$('catalogo').textContent=r.error.message;return}servicios=r.data||[];const visible=x=>x.categoria==='nails'?sec.nails!==false:x.categoria==='lashes'?sec.lashes!==false:true;const grupos=[['nails','💅 Nails'],['lashes','👁️ Lashes'],['general','✨ Servicios']].map(([cat,titulo])=>{const arr=servicios.filter(x=>x.categoria===cat&&visible(x));if(!arr.length)return '';return `<section class="grupo"><h2>${titulo}</h2>${arr.map(x=>`<div class="serv"><h3>${esc(x.nombre)}</h3><div class="muted">${esc(x.descripcion||'')} · ${Number(x.duracion_minutos||0)} min</div><div class="precio">$${Number(x.precio||0).toLocaleString('es-AR')}</div><button class="btn elegir" data-id="${x.id}">Elegir</button></div>`).join('')}</section>`}).join('');$('catalogo').innerHTML=grupos||'<div class="muted">No hay servicios activos.</div>';document.querySelectorAll('.elegir').forEach(b=>b.onclick=()=>elegir(b.dataset.id))}function elegir(sid){seleccion=servicios.find(x=>x.id===sid);$('seleccion').innerHTML=seleccion?`<b>${esc(seleccion.nombre)}</b> · $${Number(seleccion.precio||0).toLocaleString('es-AR')}`:'Elegí un servicio.'}async function reservar(){if(!seleccion){$('msg').textContent='Elegí un servicio.';return}const fecha=$('fecha').value,cliente=$('cliente').value.trim();if(!fecha||!cliente){$('msg').textContent='Completá fecha, hora y nombre.';return}const{data:{session}}=await s.auth.getSession();if(!session){const r=await s.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(r.error)$('msg').textContent=r.error.message;else $('msg').textContent='Iniciá sesión con Google y volvé a confirmar el turno.';return}const inicio=new Date(fecha),fin=new Date(inicio.getTime()+Number(seleccion.duracion_minutos||30)*60000);const q=await s.from('turnos').select('id').eq('negocios_id',id).lt('fecha_hora_inicio',fin.toISOString()).gt('fecha_hora_fin',inicio.toISOString()).neq('estado','cancelado');if(q.error){$('msg').textContent=q.error.message;return}if((q.data||[]).length){$('msg').textContent='Ese horario ya está ocupado. Elegí otro.';return}const t=await s.from('turnos').insert({negocios_id:id,cliente_id:session.user.id,fecha_hora_inicio:inicio.toISOString(),fecha_hora_fin:fin.toISOString(),precio_reservado_total:Number(seleccion.precio||0),estado:'pendiente',nombre_cliente:cliente,cliente_nombre:cliente}).select('id').single();if(t.error){$('msg').textContent=t.error.message;return}const ts=await s.from('turno_servicios').insert({turno_id:t.data.id,servicio_id:seleccion.id,precio_reservado:Number(seleccion.precio||0),duracion_minutos:Number(seleccion.duracion_minutos||30)});if(ts.error){$('msg').textContent=ts.error.message;return}$('msg').className='msg ok';$('msg').textContent='Turno reservado correctamente.'}$('reservarBtn').onclick=reservar;init();</script></body></html>
