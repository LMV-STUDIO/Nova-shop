<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Servicios — LMV Studio</title>
<style>
:root{--bg:#faf7f8;--surface:#fff;--surface2:#f5edf1;--text:#251f23;--muted:#756a70;--primary:#a45f7c;--primary2:#7d4560;--line:#eadde3;--shadow:0 18px 50px rgba(52,28,40,.10)}
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}.page{max-width:1180px;margin:auto;padding:18px}.hero{position:relative;overflow:hidden;min-height:430px;border-radius:32px;padding:48px;display:flex;align-items:flex-end;background:linear-gradient(135deg,var(--surface),var(--surface2));border:1px solid var(--line);box-shadow:var(--shadow)}.hero:before,.hero:after{content:"";position:absolute;border-radius:50%;filter:blur(2px);opacity:.25;pointer-events:none}.hero:before{width:360px;height:360px;right:-90px;top:-120px;background:var(--primary)}.hero:after{width:220px;height:220px;left:-70px;bottom:-110px;background:var(--primary2)}.decor{position:absolute;inset:0;pointer-events:none;opacity:.10;background-image:radial-gradient(circle at 15% 25%,var(--primary) 0 2px,transparent 3px),radial-gradient(circle at 85% 35%,var(--primary2) 0 2px,transparent 3px);background-size:42px 42px}.heroContent{position:relative;z-index:2;max-width:760px}.eyebrow{font-size:13px;font-weight:900;letter-spacing:2.5px;color:var(--primary);text-transform:uppercase}.hero h1{font-size:clamp(38px,6vw,72px);line-height:.98;margin:12px 0 16px;letter-spacing:-2px}.hero p{max-width:650px;font-size:17px;line-height:1.6;color:var(--muted);margin:0}.heroActions{display:flex;gap:10px;flex-wrap:wrap;margin-top:25px}.btn{border:0;border-radius:14px;padding:12px 17px;background:var(--primary);color:#fff;font-weight:850;cursor:pointer;box-shadow:0 8px 18px rgba(100,40,65,.16);transition:.2s}.btn:hover{transform:translateY(-2px);background:var(--primary2)}.btn.ghost{background:transparent;color:var(--primary2);border:1px solid var(--line);box-shadow:none}.layout{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(310px,.75fr);gap:22px;margin-top:22px}.panel{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;padding:24px;box-shadow:0 12px 35px rgba(52,28,40,.07)}.panelTitle{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.panel h2{margin:0;font-size:22px}.badge{font-size:12px;font-weight:800;padding:7px 10px;border-radius:99px;background:var(--surface2);color:var(--primary2)}.grupo{margin:25px 0 0}.grupo:first-child{margin-top:0}.grupo h2{font-size:19px;margin:0 0 12px}.serv{position:relative;border:1px solid var(--line);border-radius:18px;padding:17px;margin:10px 0;background:linear-gradient(135deg,#fff,#fffafb);display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;transition:.2s}.serv:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(52,28,40,.08);border-color:#d9c2cc}.serv h3{margin:0 0 5px;font-size:17px}.desc{color:var(--muted);font-size:13px;line-height:1.45}.precio{font-weight:900;font-size:19px;margin-top:8px}.campo{margin:12px 0}.campo label{display:block;font-size:12px;font-weight:850;margin-bottom:6px;color:var(--muted)}.campo input{width:100%;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff;color:var(--text);outline:none}.campo input:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(164,95,124,.12)}.selected{padding:13px;border-radius:14px;background:var(--surface2);min-height:22px;margin-bottom:15px}.msg{margin-top:12px;font-weight:750;font-size:14px}.ok{color:#3c7b52}.err{color:#a33b4b}.empty{text-align:center;padding:35px 15px;color:var(--muted)}.info{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.chip{padding:8px 11px;border-radius:99px;background:rgba(255,255,255,.75);border:1px solid var(--line);font-size:12px;color:var(--muted)}
/* Identidad visual automática por rubro */
body.comida{--bg:#101112;--surface:#181a1c;--surface2:#222528;--text:#fff;--muted:#c4c6c8;--primary:#f29a3b;--primary2:#d86d25;--line:#36393d}.comida .hero{background:radial-gradient(circle at 85% 20%,rgba(242,154,59,.28),transparent 32%),linear-gradient(135deg,#141516,#25211d)}
body.ropa{--bg:#101113;--surface:#17181b;--surface2:#22242a;--text:#fff;--muted:#bfc1c7;--primary:#c9a36a;--primary2:#9d7746;--line:#35363b}.ropa .hero{background:linear-gradient(120deg,#111214,#29251f)}
body.depilacion_laser{--bg:#0c1017;--surface:#121923;--surface2:#192536;--text:#f7fbff;--muted:#aebdca;--primary:#63c8e8;--primary2:#3e8eaf;--line:#263746}.depilacion_laser .hero{background:radial-gradient(circle at 80% 25%,rgba(99,200,232,.22),transparent 35%),linear-gradient(135deg,#0d1219,#182936)}
body.nails,body.lashes_nails{--bg:#fff5fa;--surface:#fff;--surface2:#fce5f0;--text:#30202a;--muted:#806875;--primary:#d35b99;--primary2:#a93770;--line:#efd2df}.nails .hero,.lashes_nails .hero{background:radial-gradient(circle at 80% 20%,rgba(211,91,153,.25),transparent 34%),linear-gradient(135deg,#fff,#f9e3ee)}
body.lashes_nails .hero:before{background:#c58adf}body.lashes_nails .hero:after{background:#e7a0c1}
body.cosmetologia{--bg:#faf8f4;--surface:#fff;--surface2:#f1ebe2;--text:#29231f;--muted:#766e67;--primary:#a98262;--primary2:#806149;--line:#e7ddd1}.cosmetologia .hero{background:radial-gradient(circle at 82% 22%,rgba(169,130,98,.20),transparent 35%),linear-gradient(135deg,#fff,#f1e9df)}
@media(max-width:800px){.page{padding:10px}.hero{min-height:390px;padding:30px 24px;border-radius:25px}.layout{grid-template-columns:1fr}.panel{padding:18px}.serv{grid-template-columns:1fr}.serv .btn{justify-self:start}.hero h1{letter-spacing:-1px}}
</style>
</head>
<body>
<div class="page"><section class="hero"><div class="decor"></div><div class="heroContent"><div class="eyebrow" id="rubro">LMV STUDIO · SERVICIOS</div><h1 id="nombre">Cargando...</h1><p id="descripcion">Un espacio pensado para mostrar tus servicios y facilitar tus reservas.</p><div class="info" id="info"></div></div></section>
<div class="layout"><main class="panel"><div class="panelTitle"><h2>Servicios</h2><span class="badge" id="badge">Disponible para reservar</span></div><div id="catalogo"><div class="empty">Cargando servicios...</div></div></main>
<aside class="panel"><div class="panelTitle"><h2>Reservar turno</h2><span class="badge">Online</span></div><div id="seleccion" class="selected">Elegí un servicio.</div><div class="campo"><label>Fecha y hora</label><input id="fecha" type="datetime-local"></div><div class="campo"><label>Tu nombre</label><input id="cliente" autocomplete="name" placeholder="¿Cómo te llamás?"></div><button id="reservarBtn" class="btn" style="width:100%">Reservar turno</button><div id="msg" class="msg"></div></aside></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const s=window.supabase.createClient('https://cqelidpshitntewsktwx.supabase.co','sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD');
const p=new URLSearchParams(location.search),id=p.get('negocio'),rubro=p.get('rubro')||'cosmetologia';
const labels={cosmetologia:'✨ COSMETOLOGÍA',depilacion_laser:'⚡ DEPILACIÓN LÁSER',lashes_nails:'💅 LASHES & LASHES',nails:'💅 NAILS',lashes:'👁️ LASHES',comida:'🍔 COMIDA',ropa:'👕 ROPA'};
let servicios=[],seleccion=null;const $=x=>document.getElementById(x),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function theme(){document.body.classList.add(rubro);if(rubro==='nails'||rubro==='lashes')document.body.classList.add(rubro)}
async function init(){theme();if(!id)return;$('rubro').textContent='LMV STUDIO · '+(labels[rubro]||'SERVICIOS');const b=await s.from('negocios').select('nombre,telefono,dirección,instagram,descripcion,estetica_secciones').eq('id',id).single();if(b.error){$('nombre').textContent='No se pudo cargar';return}const negocio=b.data;$('nombre').textContent=negocio.nombre;$('descripcion').textContent=negocio.descripcion||'Servicios profesionales y reservas online.';$('info').innerHTML=[negocio.dirección,negocio.telefono,negocio.instagram].filter(Boolean).map(x=>`<span class="chip">${esc(x)}</span>`).join('');const sec=negocio.estetica_secciones||{nails:true,lashes:true};const r=await s.from('servicios').select('id,nombre,descripcion,precio,duracion_minutos,categoria').eq('negocio_id',id).eq('activo',true).order('nombre');if(r.error){$('catalogo').innerHTML=`<div class="empty">${esc(r.error.message)}</div>`;return}servicios=r.data||[];const visible=x=>x.categoria==='nails'?sec.nails!==false:x.categoria==='lashes'?sec.lashes!==false:true;const grupos=[['nails','💅 Nails'],['lashes','👁️ Lashes'],['general','✨ Servicios']].map(([cat,titulo])=>{const arr=servicios.filter(x=>x.categoria===cat&&visible(x));if(!arr.length)return '';return `<section class="grupo"><h2>${titulo}</h2>${arr.map(x=>`<article class="serv"><div><h3>${esc(x.nombre)}</h3><div class="desc">${esc(x.descripcion||'Servicio profesional')} · ${Number(x.duracion_minutos||0)} min</div><div class="precio">$${Number(x.precio||0).toLocaleString('es-AR')}</div></div><button class="btn elegir" data-id="${x.id}">Elegir</button></article>`).join('')}</section>`}).join('');$('catalogo').innerHTML=grupos||'<div class="empty">No hay servicios activos en este momento.</div>';document.querySelectorAll('.elegir').forEach(b=>b.onclick=()=>elegir(b.dataset.id))}
function elegir(sid){seleccion=servicios.find(x=>x.id===sid);$('seleccion').innerHTML=seleccion?`<b>${esc(seleccion.nombre)}</b><br><span class="desc">$${Number(seleccion.precio||0).toLocaleString('es-AR')} · ${Number(seleccion.duracion_minutos||0)} min</span>`:'Elegí un servicio.';document.getElementById('fecha').focus()}
async function reservar(){if(!seleccion){$('msg').textContent='Elegí un servicio.';return}const fecha=$('fecha').value,cliente=$('cliente').value.trim();if(!fecha||!cliente){$('msg').textContent='Completá fecha, hora y nombre.';return}const{data:{session}}=await s.auth.getSession();if(!session){const r=await s.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(r.error)$('msg').textContent=r.error.message;else $('msg').textContent='Iniciá sesión con Google y volvé a confirmar el turno.';return}const inicio=new Date(fecha),fin=new Date(inicio.getTime()+Number(seleccion.duracion_minutos||30)*60000);const q=await s.from('turnos').select('id').eq('negocios_id',id).lt('fecha_hora_inicio',fin.toISOString()).gt('fecha_hora_fin',inicio.toISOString()).neq('estado','cancelado');if(q.error){$('msg').textContent=q.error.message;return}if((q.data||[]).length){$('msg').textContent='Ese horario ya está ocupado. Elegí otro.';return}const t=await s.from('turnos').insert({negocios_id:id,cliente_id:session.user.id,fecha_hora_inicio:inicio.toISOString(),fecha_hora_fin:fin.toISOString(),precio_reservado_total:Number(seleccion.precio||0),estado:'pendiente',nombre_cliente:cliente,cliente_nombre:cliente}).select('id').single();if(t.error){$('msg').textContent=t.error.message;return}const ts=await s.from('turno_servicios').insert({turno_id:t.data.id,servicio_id:seleccion.id,precio_reservado:Number(seleccion.precio||0),duracion_minutos:Number(seleccion.duracion_minutos||30)});if(ts.error){$('msg').textContent=ts.error.message;return}$('msg').className='msg ok';$('msg').textContent='Turno reservado correctamente.'}
$('reservarBtn').onclick=reservar;init();
</script></body></html>
