<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LMV Studio — Demo</title>
<meta http-equiv="refresh" content="3">
</head>
<body>
<p>Abriendo la demo...</p>
<script>
(() => {
  const rubro = new URLSearchParams(location.search).get('rubro') || '';
  const destinos = {
    barberia: 'barberia.html',
    nails: 'nails.html',
    lashes: 'lashes.html',
    cosmetologia: 'estetica.html',
    'depilacion-laser': 'depilacion-laser.html',
    comida: 'comida.html'
  };
  const destino = destinos[rubro];
  if (destino) {
    location.replace(destino);
  } else {
    document.body.innerHTML = '<p>No se encontró la demo solicitada.</p><p><a href="lmv-studio.html#rubros">Volver a rubros</a></p>';
  }
})();
</script>
</body>
</html>
