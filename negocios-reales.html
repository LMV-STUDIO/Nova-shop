<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#071a35">
<title>LMV Studio · Negocios reales</title>
<style>
:root{--bg:#07111f;--panel:#0d1b2e;--panel2:#12243b;--line:#203653;--text:#f4f7fb;--muted:#9eb0c8;--accent:#39a0ff;--green:#31d18b;--danger:#ff6875;--shadow:0 22px 60px rgba(0,0,0,.28)}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 15% 0%,#12365b 0,#07111f 38%);color:var(--text);font-family:Inter,system-ui,Segoe UI,Arial;min-height:100vh}.wrap{max-width:1500px;margin:auto;padding:26px}.head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:24px}.brand{font-size:20px;font-weight:950;letter-spacing:1.4px}.tag{font-size:11px;font-weight:900;padding:9px 13px;border:1px solid #315172;border-radius:999px;background:#0d2036;color:#b9d8f8}.hero{margin-bottom:22px}.hero h1{font-size:36px;margin:0 0 7px}.hero p{margin:0;color:var(--muted);font-size:14px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin:22px 0}.stat,.panel,.business{background:linear-gradient(145deg,#0e1e32,#0a1728);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow)}.stat{padding:18px}.stat span{display:block;color:var(--muted);font-size:11px;font-weight:800}.stat b{display:block;font-size:28px;margin-top:6px}.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:16px}.toolbar h2{margin:0;font-size:21px}.btn{border:0;border-radius:12px;padding:11px 15px;background:var(--accent);color:#04101d;font-weight:950;cursor:pointer}.btn.sec{background:#162b44;color:#d9e8f7}.btn.green{background:var(--green);color:#052016}.btn.danger{background:#3a1820;color:#ff9da5}.search{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:#091727;color:#fff;outline:0}.search:focus{border-color:var(--accent)}.panel{padding:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.business{padding:19px;box-shadow:none}.businessTop{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.name{font-size:19px;font-weight:950}.rub{color:#83c7ff;font-size:11px;font-weight:900;margin-top:5px}.status{font-size:10px;font-weight:950;color:#7ff0ba;background:#103827;border:1px solid #1e6547;border-radius:999px;padding:7px 9px}.meta{margin-top:15px;padding-top:13px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}.id{font-family:ui-monospace,Consolas,monospace;color:#c8d6e8;word-break:break-all;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.actions .btn{font-size:12px;padding:9px 11px}.empty{text-align:center;padding:50px 20px;color:var(--muted);border:1px dashed #29415e;border-radius:18px}.empty strong{display:block;color:#e7eef7;font-size:18px;margin-bottom:7px}.modal{position:fixed;inset:0;background:rgba(1,7,14,.78);display:none;align-items:center;justify-content:center;padding:18px;z-index:10}.modal.show{display:flex}.box{width:min(720px,100%);background:#0d1b2e;border:1px solid #29435f;border-radius:22px;padding:22px;box-shadow:0 35px 100px rgba(0,0,0,.5)}.box h2{margin:0 0 18px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:flex;flex-direction:column;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:10px;color:var(--muted);font-weight:950}.field input,.field select{padding:11px;border:1px solid var(--line);border-radius:11px;background:#091727;color:#fff;font:inherit}.modalActions{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}.toast{position:fixed;right:18px;bottom:18px;background:#eef7ff;color:#061524;padding:13px 16px;border-radius:13px;font-weight:900;display:none;z-index:20}
@media(max-width:800px){.wrap{padding:16px}.head{align-items:flex-start;flex-direction:column}.hero h1{font-size:29px}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.form{grid-template-columns:1fr}.field.full{grid-column:auto}.actions .btn{flex:1;min-width:120px}}
@media(max-width:430px){.stats{grid-template-columns:1fr}.toolbar{align-items:flex-start;flex-direction:column}.toolbar .btn{width:100%}}
</style>
</head>
<body>
<div class="wrap">
<header class="head"><div class="brand">LMV STUDIO</div><div class="tag">🔒 NEGOCIOS REALES · PANEL INTERNO</div></header>
<section class="hero"><h1>🏢 Negocios reales</h1><p>Accesos de clientes activos. Separado de las demos para que puedas vender, entregar y administrar cada negocio sin confundirte.</p></section>
<section class="stats"><div class="stat"><span>CLIENTES REALES</span><b id="total">0</b></div><div class="stat"><span>CON PÁGINA</span><b id="withClient">0</b></div><div class="stat"><span>CON ADMIN</span><b id="withAdmin">0</b></div><div class="stat"><span>ACTIVOS</span><b id="active">0</b></div></section>
<section class="panel"><div class="toolbar"><h2>Mis clientes</h2><button class="btn green" onclick="openModal()">＋ Nuevo negocio</button></div><input class="search" id="search" placeholder="Buscar por nombre, rubro o ID..."><div id="list" style="margin-top:15px"></div></section>
</div>
<div class="modal" id="modal"><div class="box"><h2>＋ Agregar negocio real</h2><div class="form"><div class="field"><label>NOMBRE DEL NEGOCIO</label><input id="name" placeholder="Ej. Ferretería Marquitos"></div><div class="field"><label>RUBRO</label><select id="category"><option>Barbería</option><option>Gastronomía</option><option>Ferretería</option><option>Nails</option><option>Lashes</option><option>Cosmetología</option><option>Depilación láser</option><option>Estética</option><option>Ropa</option><option>Distribuidora</option><option>Servicios</option><option>Otro</option></select></div><div class="field full"><label>ID DEL NEGOCIO · SUPABASE</label><input id="id" placeholder="UUID del negocio"></div><div class="field full"><label>PÁGINA CLIENTE ORIGINAL</label><input id="client" placeholder="https://..."></div><div class="field full"><label>ADMIN ORIGINAL</label><input id="admin" placeholder="https://..."></div></div><div class="modalActions"><button class="btn sec" onclick="closeModal()">Cancelar</button><button class="btn green" onclick="save()">Guardar negocio</button></div></div></div>
<div class="toast" id="toast"></div>
<script>
const KEY='lmv_negocios_reales_v1';
let businesses=JSON.parse(localStorage.getItem(KEY)||'[]');
function persist(){localStorage.setItem(KEY,JSON.stringify(businesses))}
function esc(v){return String(v??'').replace(/[&<>'\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','\"':'&quot;'}[c]))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.style.display='block';clearTimeout(window.__toast);window.__toast=setTimeout(()=>e.style.display='none',2200)}
function openModal(){['name','id','client','admin'].forEach(x=>document.getElementById(x).value='');document.getElementById('category').selectedIndex=0;document.getElementById('modal').classList.add('show');setTimeout(()=>document.getElementById('name').focus(),50)}
function closeModal(){document.getElementById('modal').classList.remove('show')}
function openLink(u){if(u)window.open(u,'_blank','noopener,noreferrer');else toast('No hay link cargado')}
function copyLink(u){if(!u)return toast('No hay link cargado');navigator.clipboard?.writeText(u).then(()=>toast('Link copiado')).catch(()=>prompt('Copiá el link:',u))}
function removeBusiness(id){if(!confirm('¿Eliminar este negocio del panel? Esto NO elimina nada de Supabase.'))return;businesses=businesses.filter(b=>b.id!==id);persist();render();toast('Negocio quitado del panel')}
function save(){const b={name:document.getElementById('name').value.trim(),category:document.getElementById('category').value,id:document.getElementById('id').value.trim(),client:document.getElementById('client').value.trim(),admin:document.getElementById('admin').value.trim(),active:true};if(!b.name||!b.id)return toast('Completá nombre e ID del negocio');if(businesses.some(x=>x.id===b.id))return toast('Ese ID ya está cargado');businesses.unshift(b);persist();closeModal();render();toast('Negocio real agregado')}
function render(){const q=document.getElementById('search').value.toLowerCase().trim();const rows=businesses.filter(b=>(b.name+' '+b.category+' '+b.id).toLowerCase().includes(q));document.getElementById('total').textContent=businesses.length;document.getElementById('withClient').textContent=businesses.filter(b=>b.client).length;document.getElementById('withAdmin').textContent=businesses.filter(b=>b.admin).length;document.getElementById('active').textContent=businesses.filter(b=>b.active!==false).length;const list=document.getElementById('list');if(!rows.length){list.innerHTML='<div class="empty"><strong>📂 Todavía no hay negocios reales cargados</strong>Cuando vendas el primero, tocá “Nuevo negocio” y guardá sus accesos.</div>';return}list.innerHTML='<div class="grid">'+rows.map(b=>`<article class="business"><div class="businessTop"><div><div class="name">${esc(b.name)}</div><div class="rub">${esc(b.category)}</div></div><span class="status">● ACTIVO</span></div><div class="meta">ID DEL NEGOCIO<div class="id">${esc(b.id)}</div></div><div class="actions"><button class="btn green" onclick="openLink(${JSON.stringify(b.client)})">🌐 Página cliente</button><button class="btn" onclick="openLink(${JSON.stringify(b.admin)})">⚙️ Admin</button><button class="btn sec" onclick="copyLink(${JSON.stringify(b.client)})">📋 Copiar cliente</button><button class="btn sec" onclick="copyLink(${JSON.stringify(b.admin)})">📋 Copiar admin</button><button class="btn danger" onclick="removeBusiness(${JSON.stringify(b.id)})">Eliminar del panel</button></div></article>`).join('')+'</div>'}
document.getElementById('search').addEventListener('input',render);document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});render();
</script>
</body>
</html>
