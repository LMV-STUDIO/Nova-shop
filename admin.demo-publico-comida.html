<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin comida — LMV Studio</title><style>body{font-family:Arial;background:#090909;color:#fff;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #292929;padding-bottom:18px;margin-bottom:20px}.brand{color:#d4af37;font-size:24px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:20px;margin-bottom:18px}.campo{margin-bottom:12px}.campo label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.campo input,.campo textarea,.campo select{width:100%;box-sizing:border-box;padding:11px;background:#0d0d0d;color:#fff;border:1px solid #333;border-radius:8px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#d4af37;color:#111;font-weight:800;cursor:pointer}.btn.red{background:#351515;color:#ffaaa0}.btn.sec{background:#252525;color:#fff;border:1px solid #333}.item{border:1px solid #292929;border-radius:10px;padding:12px;margin:8px 0}.muted{color:#aaa;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{max-width:420px;width:100%;text-align:center;background:#151515;border:1px solid #292929;border-radius:15px;padding:30px}.msg{margin-bottom:15px;color:#aaa}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{padding:15px}.top{flex-direction:column;align-items:flex-start}}</style></head><body><div id="login" class="login" style="display:none!important"><div class="loginbox"><h1>🍔 LMV STUDIO</h1><p>Administración de comida</p><button class="btn" onclick="loginGoogle()">🔐 Entrar con Google</button><div id="loginMsg" class="muted"></div></div></div><div id="app" style="display:block!important"><div class="wrap"><div class="top"><div><div class="brand">LMV STUDIO · 🍔 COMIDA</div><div class="muted" id="negocioNombre">Cargando negocio...</div></div><div class="row"><a id="pagina" class="btn sec" target="_blank">🌐 Página</a><button class="btn red" onclick="salir()">Cerrar sesión</button></div></div><div id="msg" class="msg"></div><div class="grid"><section><div class="card"><h2>🏪 Datos del negocio</h2><form id="negocioForm"><div class="campo"><label>Nombre</label><input id="bnombre" required></div><div class="campo"><label>Teléfono</label><input id="btelefono"></div><div class="campo"><label>Dirección</label><input id="bdireccion"></div><div class="campo"><label>Instagram</label><input id="binstagram"></div><div class="campo"><label>Logo URL</label><input id="blogo" type="url"></div><div class="campo"><label>Descripción</label><textarea id="bdescripcion"></textarea></div><button class="btn">Guardar datos</button></form></div><div class="card"><h2>🍔 Producto</h2><form id="productoForm"><div class="campo"><label>Nombre</label><input id="nombre" required></div><div class="campo"><label>Categoría</label><input id="categoria" placeholder="Hamburguesas, pizzas..."></div><div class="campo"><label>Precio</label><input id="precio" type="number" min="0" step="0.01" required></div><div class="campo"><label>Descripción</label><textarea id="descripcion"></textarea></div><div class="campo"><label>Imagen URL</label><input id="imagen" type="url"></div><div class="campo"><label>Disponible</label><select id="activo"><option value="true">Sí</option><option value="false">No</option></select></div><button class="btn">Guardar producto</button></form></div><div class="card"><h2>📦 Pedidos</h2><div id="pedidos">Cargando...</div></div></section><section><div class="card"><h2>📋 Catálogo</h2><div id="productos">Cargando...</div></div></section></div></div></div></body></html>
