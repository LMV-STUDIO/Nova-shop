<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin ropa — LMV Studio</title><style>body{font-family:Arial;background:#090909;color:#fff;margin:0}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;gap:15px;align-items:center;border-bottom:1px solid #292929;padding-bottom:18px;margin-bottom:20px}.brand{color:#d4af37;font-size:24px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:20px;margin-bottom:18px}.campo{margin-bottom:12px}.campo label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.campo input,.campo textarea,.campo select{width:100%;box-sizing:border-box;padding:11px;background:#0d0d0d;color:#fff;border:1px solid #333;border-radius:8px}.btn{padding:10px 14px;border:0;border-radius:8px;background:#d4af37;color:#111;font-weight:800;cursor:pointer}.btn.red{background:#351515;color:#ffaaa0}.btn.sec{background:#252525;color:#fff;border:1px solid #333}.item{border:1px solid #292929;border-radius:10px;padding:12px;margin:8px 0}.muted{color:#aaa;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{max-width:420px;width:100%;text-align:center;background:#151515;border:1px solid #292929;border-radius:15px;padding:30px}.msg{margin-bottom:15px;color:#aaa}@media(max-width:750px){.grid{grid-template-columns:1fr}.wrap{padding:15px}.top{flex-direction:column;align-items:flex-start}}</style></head><body><div id="login" class="login"><div class="loginbox"><h1>👕 LMV STUDIO</h1><p>Administración de ropa</p><button class="btn" onclick="loginGoogle()">🔐 Entrar con Google</button><div id="loginMsg" class="muted"></div></div></div><div id="app" style="display:none"><div class="wrap"><div class="top"><div><div class="brand">LMV STUDIO · 👕 ROPA</div><div class="muted" id="negocioNombre">Cargando negocio...</div></div><div class="row"><a id="pagina" class="btn sec" target="_blank">🌐 Página</a><button class="btn red" onclick="salir()">Cerrar sesión</button></div></div><div id="msg" class="msg"></div><div class="grid"><section><div class="card"><h2>🏪 Datos del negocio</h2><form id="negocioForm"><div class="campo"><label>Nombre</label><input id="bnombre" required></div><div class="campo"><label>Teléfono</label><input id="btelefono"></div><div class="campo"><label>Dirección</label><input id="bdireccion"></div><div class="campo"><label>Instagram</label><input id="binstagram"></div><div class="campo"><label>Logo URL</label><input id="blogo" type="url"></div><div class="campo"><label>Descripción</label><textarea id="bdescripcion"></textarea></div><button class="btn">Guardar datos</button></form></div><div class="card"><h2>👕 Producto</h2><form id="productoForm"><div class="campo"><label>Nombre</label><input id="nombre" required></div><div class="campo"><label>Categoría</label><input id="categoria" placeholder="Remeras, pantalones..."></div><div class="campo"><label>Precio</label><input id="precio" type="number" min="0" step="0.01" required></div><div class="campo"><label>Descripción</label><textarea id="descripcion"></textarea></div><div class="campo"><label>Imagen URL</label><input id="imagen" type="url"></div><div class="campo"><label>Disponible</label><select id="activo"><option value="true">Sí</option><option value="false">No</option></select></div><h3>Variante principal</h3><div class="campo"><label>Talle</label><input id="talle" placeholder="M"></div><div class="campo"><label>Color</label><input id="color" placeholder="Negro"></div><div class="campo"><label>Stock</label><input id="stock" type="number" min="0" value="0"></div><button class="btn">Guardar producto</button></form></div><div class="card"><h2>📦 Pedidos</h2><div id="pedidos">Cargando...</div></div></section><section><div class="card"><h2>📋 Catálogo</h2><div id="productos">Cargando...</div></div></section></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const s=window.supabase.createClient('https://cqelidpshitntewsktwx.supabase.co','sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD');const id=new URLSearchParams(location.search).get('negocio');let edit=null;let negocio=null;const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function msg(t){$('msg').textContent=t;setTimeout(()=>$('msg').textContent='',3500)}async function loginGoogle(){const{error}=await s.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)$('loginMsg').textContent=error.message}async function salir(){await s.auth.signOut();location.reload()}async function init(){if(!id){$('loginMsg').textContent='Falta ?negocio=ID';return}const{data:{session}}=await s.auth.getSession();if(!session)return;const{data,error}=await s.from('negocios').select('id,nombre,telefono,dirección,instagram,logo,descripcion,tipo_negocio,dueño_id').eq('id',id).eq('dueño_id',session.user.id).single();if(error||!data){$('loginMsg').textContent='No tenés acceso a este negocio.';return}if(data.tipo_negocio&&data.tipo_negocio!=='ropa'){msg('Este negocio no está configurado como ropa.');return}negocio=data;$('login').style.display='none';$('app').style.display='block';$('negocioNombre').textContent=data.nombre;$('pagina').href='https://lmv-studio.github.io/Nova-shop/ropa.html?negocio='+encodeURIComponent(id);$('bnombre').value=data.nombre||'';$('btelefono').value=data.telefono||'';$('bdireccion').value=data.dirección||'';$('binstagram').value=data.instagram||'';$('blogo').value=data.logo||'';$('bdescripcion').value=data.descripcion||'';await cargarProductos();await cargarPedidos()}$('negocioForm').onsubmit=async e=>{e.preventDefault();const{error}=await s.from('negocios').update({nombre:$('bnombre').value.trim(),telefono:$('btelefono').value.trim()||null,dirección:$('bdireccion').value.trim()||null,instagram:$('binstagram').value.trim()||null,logo:$('blogo').value.trim()||null,descripcion:$('bdescripcion').value.trim()||null}).eq('id',id).eq('dueño_id',negocio.dueño_id);if(error)msg(error.message);else{msg('Datos del negocio actualizados');$('negocioNombre').textContent=$('bnombre').value.trim()}};async function cargarProductos(){const{data,error}=await s.from('productos').select('*,producto_variantes(*)').eq('negocio_id',id).order('created_at',{ascending:false});if(error){$('productos').textContent=error.message;return}$('productos').innerHTML=(data||[]).map(p=>`<div class="item"><b>${esc(p.nombre)}</b><div class="muted">${esc(p.categoria||'Sin categoría')} · $${Number(p.precio||0).toLocaleString('es-AR')} · ${p.activo?'Disponible':'Oculto'}</div><div class="muted">${(p.producto_variantes||[]).map(v=>esc(v.talle||'')+' '+esc(v.color||'')+' · stock '+Number(v.stock||0)).join(' | ')||'Sin variantes'}</div><div class="row"><button class="btn" onclick="editar(${p.id})">Editar</button><button class="btn red" onclick="borrar(${p.id})">Eliminar</button></div></div>`).join('')||'<div class="muted">Sin productos.</div>';window.productos=data||[]}function editar(pid){const p=window.productos.find(x=>x.id===pid);if(!p)return;edit=pid;$('nombre').value=p.nombre||'';$('categoria').value=p.categoria||'';$('precio').value=p.precio||0;$('descripcion').value=p.descripcion||'';$('imagen').value=p.imagen||'';$('activo').value=String(p.activo!==false);const v=(p.producto_variantes||[])[0];$('talle').value=v?.talle||'';$('color').value=v?.color||'';$('stock').value=v?.stock||0;window.scrollTo({top:0,behavior:'smooth'})}async function borrar(pid){if(!confirm('¿Eliminar producto?'))return;const d=await s.from('producto_variantes').delete().eq('producto_id',pid);if(d.error){msg(d.error.message);return}const{error}=await s.from('productos').delete().eq('id',pid).eq('negocio_id',id);if(error)msg(error.message);else{msg('Producto eliminado');await cargarProductos()}}$('productoForm').onsubmit=async e=>{e.preventDefault();const p={nombre:$('nombre').value.trim(),categoria:$('categoria').value.trim()||null,precio:Number($('precio').value),descripcion:$('descripcion').value.trim()||null,imagen:$('imagen').value.trim()||null,activo:$('activo').value==='true',negocio_id:id};const r=edit?await s.from('productos').update(p).eq('id',edit).eq('negocio_id',id):await s.from('productos').insert(p).select('id').single();if(r.error){msg(r.error.message);return}const pid=edit||r.data.id;const variante={producto_id:pid,nombre:[$('talle').value.trim(),$('color').value.trim()].filter(Boolean).join(' / ')||'Variante',talle:$('talle').value.trim()||null,color:$('color').value.trim()||null,stock:Number($('stock').value)||0,precio:Number($('precio').value),activo:true};const old=await s.from('producto_variantes').select('id').eq('producto_id',pid).limit(1).maybeSingle();const vr=old.data?await s.from('producto_variantes').update(variante).eq('id',old.data.id):await s.from('producto_variantes').insert(variante);if(vr.error){msg(vr.error.message);return}msg(edit?'Producto actualizado':'Producto creado');edit=null;e.target.reset();$('stock').value=0;await cargarProductos()};async function cargarPedidos(){const{data,error}=await s.from('pedidos').select('*').eq('negocio_id',id).order('created_at',{ascending:false}).limit(30);if(error){$('pedidos').textContent=error.message;return}$('pedidos').innerHTML=(data||[]).map(p=>`<div class="item"><b>#${p.id} · ${esc(p.cliente||'Cliente')}</b><div class="muted">${esc(p.telefono||'')} · $${Number(p.total||0).toLocaleString('es-AR')} · ${esc(p.estado||'pendiente')}</div><div class="row"><button class="btn" onclick="estado(${p.id},'preparando')">Preparando</button><button class="btn" onclick="estado(${p.id},'listo')">Listo</button><button class="btn red" onclick="estado(${p.id},'cancelado')">Cancelar</button></div></div>`).join('')||'<div class="muted">Sin pedidos.</div>'}async function estado(pid,e){const{error}=await s.from('pedidos').update({estado:e}).eq('id',pid).eq('negocio_id',id);if(error)msg(error.message);else{msg('Estado actualizado');await cargarPedidos()}}s.auth.onAuthStateChange(()=>init());init();</script></body></html>
