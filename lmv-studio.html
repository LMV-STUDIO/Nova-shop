<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LMV Studio — Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--gold:#d4af37;--bg:#090909;--card:#151515;--border:#292929;--muted:#aaa}*{box-sizing:border-box}body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#fff}.wrap{max-width:1100px;margin:auto;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid var(--border);padding-bottom:18px;margin-bottom:22px}.brand{color:var(--gold);font-size:24px;font-weight:800}.user{color:var(--muted);font-size:13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:20px}.card h2{margin:0 0 16px}.campo{margin-bottom:13px}.campo label{display:block;color:#ddd;font-size:13px;font-weight:700;margin-bottom:6px}.campo input,.campo select{width:100%;padding:11px;border-radius:8px;border:1px solid #333;background:#0d0d0d;color:#fff}.btn{border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer;background:var(--gold);color:#111}.btn.sec{background:#252525;color:#fff;border:1px solid #333}.btn.salir{background:#321515;color:#ff9999}.lista{display:grid;gap:10px}.negocio{border:1px solid var(--border);border-radius:10px;padding:14px}.negocio strong{display:block;margin-bottom:5px}.meta{font-size:12px;color:var(--muted);margin-bottom:10px;word-break:break-all}.acciones{display:flex;gap:8px;flex-wrap:wrap}.msg{display:none;padding:11px;border-radius:8px;margin-bottom:15px}.msg.ok{display:block;background:#142514;color:#8be58b;border:1px solid #365d36}.msg.err{display:block;background:#241212;color:#ff9999;border:1px solid #633}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{max-width:430px;width:100%;text-align:center;background:var(--card);border:1px solid var(--border);border-radius:15px;padding:30px}.loginbox h1{color:var(--gold)}@media(max-width:750px){.wrap{padding:15px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}.btn{min-height:42px}}
</style>
</head>
<body>
<div id="login" class="login"><div class="loginbox"><h1>LMV STUDIO</h1><p>Panel privado de gestión de barberías.</p><button class="btn" onclick="loginGoogle()">🔐 Entrar con Google</button></div></div>
<div id="app" style="display:none"><div class="wrap"><div class="top"><div><div class="brand">LMV STUDIO</div><div class="user" id="userInfo"></div></div><button class="btn salir" onclick="salir()">Cerrar sesión</button></div><div id="msg" class="msg"></div><div class="grid"><section class="card"><h2>➕ Crear barbería</h2><form id="form"><div class="campo"><label>Nombre</label><input id="nombre" required placeholder="Ej. Barbería Los Pibes"></div><div class="campo"><label>Teléfono</label><input id="telefono" placeholder="Ej. 11 1234-5678"></div><div class="campo"><label>Dirección</label><input id="direccion" placeholder="Ej. Av. ..."></div><div class="campo"><label>Instagram</label><input id="instagram" placeholder="@barberia"></div><div class="campo"><label>Dueño existente</label><select id="dueno"><option value="">Usar mi usuario</option></select></div><button class="btn" type="submit">Crear barbería</button></form></section><section class="card"><h2>🏪 Barberías</h2><div id="lista" class="lista">Cargando...</div></section></div></div></div>
<script>
const SUPABASE_URL='https://cqelidpshitntewsktwx.supabase.co';
const SUPABASE_KEY='sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD';
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const MI_ID='61237a18-0393-4308-98ba-a9891f1d5582';
const PUBLICA='https://lmv-studio.github.io/Nova-shop/barberia.html';
const ADMIN='https://lmv-studio.github.io/Nova-shop/admin.barberia_reutilizable.html';
let usuario=null;
function mostrarMsg(text,ok=false){const m=document.getElementById('msg');m.textContent=text;m.className='msg '+(ok?'ok':'err');setTimeout(()=>m.className='msg',4000)}
async function loginGoogle(){await supabase.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}})}
async function salir(){await supabase.auth.signOut();location.reload()}
async function iniciar(){const {data:{session}}=await supabase.auth.getSession();if(!session){document.getElementById('login').style.display='flex';return}usuario=session.user;if(usuario.id!==MI_ID){document.getElementById('login').innerHTML='<div class="loginbox"><h1>Acceso denegado</h1><p>Este panel es privado de LMV Studio.</p><button class="btn" onclick="salir()">Salir</button></div>';return}document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('userInfo').textContent=usuario.email||usuario.id;await cargarDuenos();await cargarNegocios()}
async function cargarDuenos(){const {data,error}=await supabase.from('usuarios').select('id,nombre,email').order('nombre');if(error)return;const s=document.getElementById('dueno');data.forEach(u=>{const o=document.createElement('option');o.value=u.id;o.textContent=(u.nombre||'Sin nombre')+' — '+(u.email||u.id);s.appendChild(o)})}
async function cargarNegocios(){const {data,error}=await supabase.from('negocios').select('id,nombre,dueño_id,telefono').order('created_at',{ascending:false});const l=document.getElementById('lista');if(error){l.textContent='No se pudieron cargar las barberías: '+error.message;return}if(!data.length){l.textContent='Todavía no hay barberías.';return}l.innerHTML=data.map(n=>{const q=encodeURIComponent(n.id);return `<div class="negocio"><strong>${esc(n.nombre)}</strong><div class="meta">ID: ${n.id}<br>Dueño: ${n.dueño_id||'sin asignar'}${n.telefono?'<br>Tel: '+esc(n.telefono):''}</div><div class="acciones"><a class="btn" href="${PUBLICA}?negocio=${q}" target="_blank">🌐 Página</a><a class="btn sec" href="${ADMIN}?negocio=${q}" target="_blank">⚙️ Admin</a></div></div>`}).join('')}
document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const dueño=document.getElementById('dueno').value||MI_ID;const payload={nombre:document.getElementById('nombre').value.trim(),telefono:document.getElementById('telefono').value.trim()||null,'dirección':document.getElementById('direccion').value.trim()||null,instagram:document.getElementById('instagram').value.trim()||null,dueño_id:dueño};const {error}=await supabase.from('negocios').insert(payload);if(error){mostrarMsg('No se pudo crear: '+error.message);return}mostrarMsg('Barbería creada correctamente.',true);e.target.reset();await cargarNegocios()});
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
supabase.auth.onAuthStateChange(()=>iniciar());iniciar();
</script></body></html>
