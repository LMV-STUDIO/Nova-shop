<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>LMV Studio — Panel</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
body{margin:0;font-family:Arial;background:#090909;color:#fff}
.wrap{max-width:1100px;margin:auto;padding:24px}
.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #292929;padding-bottom:18px;margin-bottom:22px}
.brand{color:#d4af37;font-size:24px;font-weight:800}.user{color:#aaa;font-size:13px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{background:#151515;border:1px solid #292929;border-radius:14px;padding:20px}.card h2{margin:0 0 16px}
.campo{margin-bottom:13px}.campo label{display:block;color:#ddd;font-size:13px;font-weight:700;margin-bottom:6px}
.campo input,.campo select{width:100%;padding:11px;border-radius:8px;border:1px solid #333;background:#0d0d0d;color:#fff;box-sizing:border-box}
.btn{display:inline-block;border:0;border-radius:8px;padding:11px 15px;font-weight:700;cursor:pointer;background:#d4af37;color:#111;text-decoration:none}
.btn.sec{background:#252525;color:#fff;border:1px solid #333}.btn.salir{background:#321515;color:#ff9999}.btn.danger{background:#321515;color:#ff9999;border:1px solid #542222}
.lista{display:grid;gap:10px}.negocio{border:1px solid #292929;border-radius:10px;padding:14px}.negocio strong{display:block;margin-bottom:5px}
.meta{font-size:12px;color:#aaa;margin-bottom:10px;word-break:break-all}.acciones{display:flex;gap:8px;flex-wrap:wrap}
.msg{display:none;padding:11px;border-radius:8px;margin-bottom:15px}.msg.ok{display:block;background:#142514;color:#8be58b}.msg.err{display:block;background:#241212;color:#ff9999}
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{max-width:430px;width:100%;text-align:center;background:#151515;border:1px solid #292929;border-radius:15px;padding:30px}.loginbox h1{color:#d4af37}
.manual{margin-top:18px}.manual small{display:block;color:#aaa;margin:-8px 0 14px}
@media(max-width:750px){.wrap{padding:15px}.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column;gap:15px}.btn{min-height:42px}.acciones{display:grid;grid-template-columns:1fr 1fr}.acciones .btn{text-align:center}}
</style>
</head>
<body>
<div id="login" class="login">
<div class="loginbox">
<h1>LMV STUDIO</h1>
<p>Panel privado de gestión de barberías.</p>
<button class="btn" onclick="loginGoogle()">🔐 Entrar con Google</button>
</div>
</div>
<div id="app" style="display:none">
<div class="wrap">
<div class="top"><div><div class="brand">LMV STUDIO</div><div class="user" id="userInfo"></div></div><button class="btn salir" onclick="salir()">Cerrar sesión</button></div>
<div id="msg" class="msg"></div>
<div class="grid">
<section class="card">
<h2>➕ Crear barbería</h2>
<form id="form">
<div class="campo"><label>Nombre</label><input id="nombre" required placeholder="Ej. Barbería Los Pibes"></div>
<div class="campo"><label>Teléfono</label><input id="telefono" placeholder="Ej. 11 1234-5678"></div>
<div class="campo"><label>Dirección</label><input id="direccion" placeholder="Ej. Av. ..."></div>
<div class="campo"><label>Instagram</label><input id="instagram" placeholder="@barberia"></div>
<div class="campo"><label>Correo Google del dueño</label><input id="duenoEmail" type="email" required placeholder="dueño@gmail.com"></div>
<button class="btn" type="submit">Crear barbería</button>
</form>

<div class="manual">
<h2>🔗 Agregar acceso manual</h2>
<small>Sirve para crear una entrada visual usando una barbería existente. No crea ni modifica nada en Supabase.</small>
<form id="manualForm">
<div class="campo"><label>Nombre que aparecerá</label><input id="manualNombre" required placeholder="Ej. Barbería Prueba 3 — Nueva"></div>
<div class="campo"><label>Link de la página</label><input id="manualPagina" type="url" required placeholder="https://.../barberia.html?negocio=..."></div>
<div class="campo"><label>Link del Admin</label><input id="manualAdmin" type="url" required placeholder="https://.../admin.barberia_reutilizable.html?negocio=..."></div>
<button class="btn" type="submit">➕ Agregar acceso</button>
</form>
</div>
</section>
<section class="card">
<h2>🏪 Barberías</h2>
<div id="lista" class="lista">Cargando...</div>
</section>
</div>
</div>
</div>
<script>
const SUPABASE_URL='https://cqelidpshitntewsktwx.supabase.co';
const SUPABASE_KEY='sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD';
const supabaseClient=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
const MI_ID='61237a18-0393-4308-98ba-a9891f1d5582';
const PUBLICA='https://lmv-studio.github.io/Nova-shop/barberia.html';
const ADMIN='https://lmv-studio.github.io/Nova-shop/admin.barberia_reutilizable.html';
const MANUALES_KEY='lmv_los_accesos_manuales_v1';
let usuario=null;
function mostrarMsg(t,ok=false){const m=document.getElementById('msg');m.textContent=t;m.className='msg '+(ok?'ok':'err');setTimeout(()=>m.className='msg',4000)}
async function loginGoogle(){const{error}=await supabaseClient.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)mostrarMsg(error.message)}
async function salir(){await supabaseClient.auth.signOut();location.reload()}
async function iniciar(){
const{data:{session}}=await supabaseClient.auth.getSession();
if(!session){document.getElementById('login').style.display='flex';return}
usuario=session.user;
if(usuario.id!==MI_ID){document.getElementById('login').innerHTML='<div class="loginbox"><h1>Acceso denegado</h1><p>Este panel es privado de LMV Studio.</p><button class="btn" onclick="salir()">Salir</button></div>';return}
document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';document.getElementById('userInfo').textContent=usuario.email||usuario.id;await cargarNegocios()
}
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function leerManuales(){try{return JSON.parse(localStorage.getItem(MANUALES_KEY)||'[]')}catch{return[]}}
function guardarManuales(items){localStorage.setItem(MANUALES_KEY,JSON.stringify(items))}
function tarjeta(n){
const q=encodeURIComponent(n.id);
return `<div class="negocio"><strong>${esc(n.nombre)}</strong><div class="meta">ID: ${esc(n.id)}<br>Dueño: ${esc(n.dueño_email||'pendiente')}${n.telefono?'<br>Tel: '+esc(n.telefono):''}</div><div class="acciones"><a class="btn" href="${PUBLICA}?negocio=${q}" target="_blank">🌐 Página</a><a class="btn sec" href="${ADMIN}?negocio=${q}" target="_blank">⚙️ Admin</a></div></div>`
}
function tarjetaManual(item,index){
return `<div class="negocio"><strong>${esc(item.nombre)}</strong><div class="meta">Acceso manual · no modifica Supabase</div><div class="acciones"><a class="btn" href="${esc(item.pagina)}" target="_blank" rel="noopener">🌐 Página</a><a class="btn sec" href="${esc(item.admin)}" target="_blank" rel="noopener">⚙️ Admin</a><button class="btn danger" type="button" onclick="eliminarManual(${index})">🗑️ Eliminar</button></div></div>`
}
async function cargarNegocios(){
const{data,error}=await supabaseClient.from('negocios').select('id,nombre,dueño_id,dueño_email,telefono').order('created_at',{ascending:false});
const l=document.getElementById('lista');
if(error){l.textContent='No se pudieron cargar: '+error.message;return}
const html=[];
for(const n of (data||[])) html.push(tarjeta(n));
for(const [i,item] of leerManuales().entries()) html.push(tarjetaManual(item,i));
if(!html.length){l.textContent='Todavía no hay barberías.';return}
l.innerHTML=html.join('')
}
document.getElementById('manualForm').addEventListener('submit',e=>{
e.preventDefault();
const item={nombre:document.getElementById('manualNombre').value.trim(),pagina:document.getElementById('manualPagina').value.trim(),admin:document.getElementById('manualAdmin').value.trim()};
const items=leerManuales();items.push(item);guardarManuales(items);e.target.reset();mostrarMsg('Acceso agregado. No se modificó Supabase.',true);cargarNegocios()
});
function eliminarManual(index){const items=leerManuales();items.splice(index,1);guardarManuales(items);mostrarMsg('Acceso manual eliminado.',true);cargarNegocios()}
document.getElementById('form').addEventListener('submit',async e=>{
e.preventDefault();
const email=document.getElementById('duenoEmail').value.trim().toLowerCase();
const payload={nombre:document.getElementById('nombre').value.trim(),telefono:document.getElementById('telefono').value.trim()||null,'dirección':document.getElementById('direccion').value.trim()||null,instagram:document.getElementById('instagram').value.trim()||null,dueño_id:null,dueño_email:email};
const{error}=await supabaseClient.from('negocios').insert(payload);
if(error){mostrarMsg('No se pudo crear: '+error.message);return}
mostrarMsg('Barbería creada. El dueño podrá entrar con ese Google.',true);e.target.reset();await cargarNegocios()
});
supabaseClient.auth.onAuthStateChange(()=>iniciar());
iniciar();
</script>
</body>
</html>
