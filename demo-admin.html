<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Demo Admin — LMV Studio</title>
<meta name="description" content="Demo pública e interactiva del panel de administración de LMV Studio.">
<style>
:root{--blue:#1769ff;--deep:#082d78;--ink:#10213d;--muted:#66758d;--bg:#f5f9ff;--card:#fff;--line:#dce8f8;--soft:#eaf2ff;--green:#18a66a;--orange:#e89b32;--shadow:0 18px 50px rgba(24,73,150,.1)}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:radial-gradient(circle at 90% 0,#e6f0ff,transparent 28%),var(--bg);color:var(--ink)}button{font:inherit}a{text-decoration:none;color:inherit}.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.92);backdrop-filter:blur(18px);border-bottom:1px solid var(--line)}.topin{max-width:1280px;margin:auto;padding:13px 22px;display:flex;align-items:center;justify-content:space-between;gap:15px}.brand{font-weight:950;color:var(--blue);letter-spacing:1.5px}.demo{font-size:11px;font-weight:900;color:var(--muted);background:var(--soft);padding:7px 10px;border-radius:999px;display:inline-block;margin-top:5px}.layout{max-width:1280px;margin:auto;padding:22px;display:grid;grid-template-columns:235px 1fr;gap:20px}.side{background:#fff;border:1px solid var(--line);border-radius:24px;padding:15px;height:max-content;position:sticky;top:79px;box-shadow:var(--shadow)}.side h3{font-size:12px;color:var(--muted);margin:9px 10px 12px;text-transform:uppercase;letter-spacing:1px}.nav{width:100%;border:0;background:transparent;text-align:left;padding:12px;border-radius:13px;font-weight:850;color:var(--muted);cursor:pointer;margin:2px 0;transition:.2s}.nav:hover,.nav.active{background:var(--soft);color:var(--deep);transform:translateX(2px)}.content{min-width:0}.hero{background:linear-gradient(135deg,var(--deep),var(--blue));color:#fff;border-radius:28px;padding:28px;box-shadow:0 25px 65px rgba(23,105,255,.18);animation:up .4s ease}.hero small{opacity:.78;font-weight:800}.hero h1{font-size:34px;margin:7px 0}.hero p{margin:0;color:#dbe8ff;line-height:1.5}.cta{margin-top:18px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:16px;padding:13px;display:flex;align-items:center;justify-content:space-between;gap:15px}.cta span{font-size:12px;color:#e6efff}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin:17px 0}.stat,.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:19px;box-shadow:var(--shadow)}.stat strong{display:block;font-size:28px}.stat span{font-size:12px;color:var(--muted)}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:17px}.card{animation:up .45s ease}.card h2{margin:0 0 5px;font-size:20px}.muted{color:var(--muted);font-size:13px;line-height:1.5}.row{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:999px;padding:10px 15px;background:var(--blue);color:#fff;font-weight:900;cursor:pointer;transition:.2s}.btn:hover{transform:translateY(-2px);box-shadow:0 9px 22px rgba(23,105,255,.2)}.btn.sec{background:var(--soft);color:var(--deep)}.btn.light{background:#fff;color:var(--deep)}.list{margin-top:15px}.item{border:1px solid var(--line);border-radius:16px;padding:14px;margin:9px 0;transition:.2s}.item:hover{transform:translateY(-2px);box-shadow:0 9px 25px rgba(24,73,150,.07)}.itemtop{display:flex;justify-content:space-between;gap:10px}.pill{padding:5px 9px;border-radius:999px;font-size:10px;font-weight:950;background:#e5f7ef;color:#168454;white-space:nowrap}.pill.pending{background:#fff1d9;color:#9a6415}.bars{display:grid;gap:11px;margin-top:15px}.barline{display:grid;grid-template-columns:85px 1fr 42px;align-items:center;gap:8px;font-size:12px}.bar{height:9px;background:#edf3fb;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue);border-radius:99px}.table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}.table th,.table td{text-align:left;padding:11px 8px;border-bottom:1px solid #edf2f8}.feature{display:grid;grid-template-columns:1fr auto;align-items:center;gap:12px;border:1px solid var(--line);border-radius:16px;padding:14px;margin:9px 0}.lock{font-size:11px;font-weight:900;color:var(--muted);background:var(--soft);padding:7px 9px;border-radius:999px}.note{margin-top:12px;padding:12px 14px;border-radius:14px;background:#f8fbff;border:1px dashed #bfd2eb;color:var(--muted);font-size:12px;line-height:1.5}.toast{position:fixed;right:20px;bottom:20px;background:var(--ink);color:#fff;padding:12px 15px;border-radius:14px;box-shadow:var(--shadow);animation:up .2s ease;z-index:50}@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:900px){.layout{grid-template-columns:1fr}.side{position:static;display:flex;gap:6px;overflow:auto;padding:9px}.side h3{display:none}.nav{min-width:max-content}.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}}@media(max-width:600px){.topin{padding:11px 14px;align-items:flex-start;flex-direction:column}.layout{padding:13px}.hero{padding:22px;border-radius:22px}.hero h1{font-size:28px}.cta{align-items:flex-start;flex-direction:column}.stats{gap:8px}.stat{padding:14px}.stat strong{font-size:24px}.card{padding:16px;border-radius:19px}.table{display:block;overflow:auto;white-space:nowrap}.actions{width:100%}.actions .btn{flex:1}}
</style>
</head>
<body>
<header class="top"><div class="topin"><div><div class="brand">LMV STUDIO</div><div class="demo">DEMO · SIN LOGIN · DATOS DE EJEMPLO</div></div><div class="actions"><a class="btn sec" href="lmv-studio.html">← Volver a LMV Studio</a></div></div></header>
<div class="layout">
<aside class="side"><h3>Administración</h3><button class="nav active" data-view="inicio">🏠 Inicio</button><button class="nav" data-view="turnos">📅 Turnos</button><button class="nav" data-view="catalogo">🛍️ Catálogo</button><button class="nav" data-view="horarios">🕐 Horarios</button><button class="nav" data-view="negocio">🏪 Negocio</button><button class="nav" data-view="config">⚙️ Configuración</button></aside>
<main class="content" id="content"></main>
</div>
<script>
const data={barberia:{nombre:'Barbería Demo',icon:'💈',turnos:28,pend:5,items:7,label:'Servicios',color:'Barbería',desc:'Servicios, barberos, horarios y agenda online.'},nails:{nombre:'Nails Studio Demo',icon:'💅',turnos:34,pend:4,items:12,label:'Servicios',color:'Nails',desc:'Catálogo de uñas, horarios y reservas.'},lashes:{nombre:'Lashes Demo',icon:'👁️',turnos:31,pend:6,items:9,label:'Servicios',color:'Lashes',desc:'Pestañas, cejas, agenda y gestión.'},cosmetologia:{nombre:'Cosmetología Demo',icon:'✨',turnos:24,pend:3,items:10,label:'Tratamientos',color:'Cosmetología',desc:'Tratamientos, servicios y turnos.'},'depilacion-laser':{nombre:'Depilación Láser Demo',icon:'🔦',turnos:42,pend:7,items:14,label:'Servicios',color:'Depilación Láser',desc:'Zonas, sesiones, horarios y agenda.'},comida:{nombre:'Gastronomía & Delivery Demo',icon:'🍔',turnos:86,pend:12,items:25,label:'Productos',color:'Gastronomía & Delivery',desc:'Productos, pedidos, delivery y gestión.'},ferreteria:{nombre:'Ferretería Demo',icon:'🧰',turnos:63,pend:9,items:180,label:'Productos',color:'Ferretería',desc:'Productos, stock, ventas, clientes y caja.'}};
const samples={barberia:['Corte clásico','Corte + barba','Barba','Fade','Perfilado'],nails:['Manicura semipermanente','Soft gel','Kapping','Nail art','Esculpidas'],lashes:['Lifting de pestañas','Lifting + tinte','Extensiones clásicas','Volumen','Perfilado de cejas'],cosmetologia:['Limpieza facial','Peeling','Hidratación','Radiofrecuencia','Tratamiento facial'],'depilacion-laser':['Piernas completas','Axilas','Ingles','Medias piernas','Combo cuerpo'],comida:['Hamburguesa completa','Papas','Pizza muzzarella','Combo familiar','Empanadas'],ferreteria:['Tornillos','Taladro','Amoladora','Pintura','Tarugos']};
const key=new URLSearchParams(location.search).get('rubro')||'barberia',d=data[key]||data.barberia,names=samples[key]||samples.barberia;document.title='Demo Admin — '+d.nombre;
function demoToast(t){const e=document.createElement('div');e.className='toast';e.textContent='✓ '+t;e.onclick=()=>e.remove();document.body.appendChild(e);setTimeout(()=>e.remove(),2400)}
function locked(action){demoToast(action+' — disponible al contratar LMV Studio')}
function render(view='inicio'){let html='';if(view==='inicio')html=`<section class="hero"><small>${d.icon} ${d.color.toUpperCase()} · PANEL DE DEMOSTRACIÓN</small><h1>Administración de ${d.nombre}</h1><p>${d.desc} Esta demo permite conocer la experiencia real del panel sin iniciar sesión.</p><div class="cta"><span>🔒 Los cambios de datos, servicios, horarios y estados están bloqueados en la demo.</span><button class="btn light" onclick="locked('Edición')">Consultar servicio</button></div></section><div class="stats"><div class="stat"><strong>${d.turnos}</strong><span>Turnos / pedidos</span></div><div class="stat"><strong>${d.pend}</strong><span>Pendientes</span></div><div class="stat"><strong>${d.items}</strong><span>${d.label}</span></div><div class="stat"><strong>98%</strong><span>Disponibilidad</span></div></div><div class="grid"><div class="card"><h2>📅 Próximos turnos</h2><div class="muted">Vista rápida de la agenda.</div><div class="list">${names.slice(0,4).map((n,i)=>`<div class="item"><div class="itemtop"><div><b>${['Sofía','Martina','Lucas','Valentina'][i]} · ${n}</b><div class="muted">Hoy · ${10+i}:00 · ${i%2?'Pendiente':'Confirmado'}</div></div><span class="pill ${i%2?'pending':''}">${i%2?'PENDIENTE':'CONFIRMADO'}</span></div></div>`).join('')}</div><button class="btn sec" onclick="render('turnos')">Ver agenda completa</button></div><div class="card"><h2>📊 Resumen</h2><div class="muted">Actividad semanal de ejemplo.</div><div class="bars">${[['Lun',72],['Mar',88],['Mié',64],['Jue',92],['Vie',81],['Sáb',96]].map(x=>`<div class="barline"><span>${x[0]}</span><div class="bar"><i style="width:${x[1]}%"></i></div><b>${x[1]}%</b></div>`).join('')}</div></div></div>`;
if(view==='turnos')html=`<div class="card"><h2>📅 Turnos</h2><p class="muted">Agenda y gestión de reservas. Los botones son demostrativos.</p><table class="table"><thead><tr><th>Cliente</th><th>Servicio</th><th>Fecha</th><th>Estado</th><th></th></tr></thead><tbody>${Array.from({length:8},(_,i)=>`<tr><td>${['Sofía Pérez','Martina López','Lucas Gómez','Valentina Díaz','Agustina Ruiz','Tomás Silva','Camila Torres','Mateo Castro'][i]}</td><td>${names[i%names.length]}</td><td>27/08 · ${10+i}:00</td><td><span class="pill ${i%3?'pending':''}">${i%3?'PENDIENTE':'CONFIRMADO'}</span></td><td><button class="btn sec" onclick="locked('Cambio de estado')">Gestionar</button></td></tr>`).join('')}</tbody></table><div class="note">En el sistema contratado, el dueño puede confirmar, finalizar o cancelar turnos y la información queda conectada a su negocio.</div></div>`;
if(view==='catalogo')html=`<div class="card"><h2>🛍️ ${d.label}</h2><p class="muted">Así se puede administrar el catálogo. Los cambios están bloqueados en esta demo.</p><div class="list">${names.concat(['Servicio premium','Servicio express']).map((n,i)=>`<div class="item"><div class="itemtop"><div><b>${n}</b><div class="muted">${i%2?'60':'90'} min · $${(8000+i*2500).toLocaleString('es-AR')}</div></div><span class="pill ${i===5?'pending':''}">${i===5?'INACTIVO':'ACTIVO'}</span></div><div class="row" style="margin-top:10px"><button class="btn sec" onclick="locked('Editar servicio')">Editar</button><button class="btn" onclick="locked('Cambiar estado')">${i===5?'Activar':'Desactivar'}</button></div></div>`).join('')}<button class="btn" onclick="locked('Nuevo servicio')">+ Agregar servicio</button></div></div>`;
if(view==='horarios')html=`<div class="card"><h2>🕐 Horarios</h2><p class="muted">Configuración de atención y disponibilidad.</p><div class="list">${['Lunes','Martes','Miércoles','Jueves','Viernes','Sábado','Domingo'].map((n,i)=>`<div class="item"><div class="itemtop"><b>${n}</b><span class="pill ${i===6?'pending':''}">${i===6?'CERRADO':'ABIERTO'}</span></div><div class="muted" style="margin-top:7px">${i===6?'Sin atención':'09:00 — 18:00'}</div><div class="row" style="margin-top:10px"><button class="btn sec" onclick="locked('Editar horario')">Editar</button></div></div>`).join('')}</div><button class="btn" onclick="locked('Guardar horarios')">Guardar horarios</button></div>`;
if(view==='negocio')html=`<div class="card"><h2>🏪 Datos del negocio</h2><p class="muted">En el sistema contratado el dueño puede editar esta información sin tocar código.</p><div class="list"><div class="feature"><div><b>Nombre</b><div class="muted">${d.nombre}</div></div><span class="lock">EDITABLE</span></div><div class="feature"><div><b>Teléfono</b><div class="muted">11 5555-5555</div></div><span class="lock">EDITABLE</span></div><div class="feature"><div><b>Dirección</b><div class="muted">Av. Demo 1234</div></div><span class="lock">EDITABLE</span></div><div class="feature"><div><b>Instagram</b><div class="muted">@negociodemo</div></div><span class="lock">EDITABLE</span></div></div><button class="btn" onclick="locked('Editar datos del negocio')">Editar datos</button></div>`;
if(view==='config')html=`<div class="card"><h2>⚙️ Configuración</h2><p class="muted">Funciones que pueden formar parte del sistema contratado.</p><div class="list">${['Días cerrados y feriados','Disponibilidad de turnos','Notificaciones','Permisos de administración','Configuración del negocio','Historial y reportes'].map(x=>`<div class="feature"><div><b>${x}</b><div class="muted">Disponible según el servicio contratado.</div></div><span class="lock">EDITABLE</span></div>`).join('')}</div><div class="note">La demo es pública y segura: sirve para mostrar el producto. Los datos reales y las funciones de edición se habilitan únicamente para el negocio contratado.</div></div>`;
$('content').innerHTML=html;document.querySelectorAll('.nav').forEach(b=>b.classList.toggle('active',b.dataset.view===view));window.scrollTo({top:0,behavior:'smooth'})}
function $(x){return document.getElementById(x)}document.querySelectorAll('.nav').forEach(b=>b.onclick=()=>render(b.dataset.view));render();
</script>
</body>
</html>
