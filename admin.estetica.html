<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin estética — LMV Studio</title><style>body{margin:0;font-family:Arial;background:#faf7f8;color:#241f22}.wrap{max-width:1100px;margin:auto;padding:22px}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;border-bottom:1px solid #eadfe3;padding-bottom:18px}.brand{font-size:23px;font-weight:900;color:#9b6178}.grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:18px}.card{background:#fff;border:1px solid #eadfe3;border-radius:16px;padding:20px}.campo{margin:10px 0}.campo label{display:block;font-size:13px;font-weight:700;margin-bottom:5px}.campo input,.campo textarea,.campo select{width:100%;box-sizing:border-box;padding:11px;border:1px solid #ddd0d7;border-radius:9px;background:#fff}.btn{border:0;border-radius:9px;padding:10px 14px;background:#9b6178;color:#fff;font-weight:800;cursor:pointer}.btn.red{background:#6f2939}.btn.sec{background:#eee4e8;color:#35272d}.item{border:1px solid #eadfe3;border-radius:12px;padding:13px;margin:9px 0}.muted{color:#766b71;font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.loginbox{max-width:420px;width:100%;text-align:center;background:#fff;border:1px solid #eadfe3;border-radius:16px;padding:30px}.msg{margin:10px 0;color:#3c7b52}@media(max-width:760px){.grid{grid-template-columns:1fr}.top{align-items:flex-start;flex-direction:column}}</style></head><body><div id="login" class="login"><div class="loginbox"><h1>LMV STUDIO</h1><p>Administración de estética</p><button class="btn" onclick="loginGoogle()">🔐 Entrar con Google</button><div id="loginMsg" class="muted"></div></div></div><div id="app" style="display:none"><div class="wrap"><div class="top"><div><div class="brand" id="brand">LMV STUDIO · ESTÉTICA</div><div class="muted" id="nombreNegocio">Cargando...</div></div><div class="row"><a id="pagina" class="btn sec" target="_blank">🌐 Página</a><button class="btn red" onclick="salir()">Cerrar sesión</button></div></div><div class="grid"><section><div class="card"><h2>🏪 Datos del negocio</h2><form id="negocioForm"><div class="campo"><label>Nombre</label><input id="bnombre" required></div><div class="campo"><label>Teléfono</label><input id="btelefono"></div><div class="campo"><label>Dirección</label><input id="bdireccion"></div><div class="campo"><label>Instagram</label><input id="binstagram"></div><div class="campo"><label>Descripción</label><textarea id="bdescripcion"></textarea></div><button class="btn">Guardar datos</button></form></div><div class="card"><h2>✨ Servicio</h2><form id="servForm"><div class="campo"><label>Nombre</label><input id="snombre" required></div><div class="campo"><label>Descripción</label><textarea id="sdescripcion"></textarea></div><div class="campo"><label>Precio</label><input id="sprecio" type="number" min="0" step="0.01" required></div><div class="campo"><label>Duración (minutos)</label><input id="sduracion" type="number" min="5" value="30" required></div><div class="campo"><label>Estado</label><select id="sactivo"><option value="true">Activo</option><option value="false">Inactivo</option></select></div><button class="btn">Guardar servicio</button></form></div></section><section><div class="card"><h2>📋 Servicios</h2><div id="servicios">Cargando...</div></div><div class="card"><h2>📅 Turnos</h2><div id="turnos">Cargando...</div></div></section></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const s=window.supabase.createClient('https://cqelidpshitntewsktwx.supabase.co','sb_publishable_o1q2pLVF1zIlZCzPHMaheg_KSawjVvD');const id=new URLSearchParams(location.search).get('negocio');const rubro=new URLSearchParams(location.search).get('rubro')||'cosmetologia';const labels={cosmetologia:'✨ COSMETOLOGÍA',depilacion_laser:'⚡ DEPILACIÓN LÁSER',lashes_nails:'💅 LASHES & NAILS'};let negocio=null;const $=x=>document.getElementById(x);const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));function msg(t){$('nombreNegocio').textContent=t;setTimeout(()=>{$('nombreNegocio').textContent=negocio?.nombre||''},2500)}async function loginGoogle(){const{error}=await s.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.href}});if(error)$('loginMsg').textContent=error.message}async function salir(){await s.auth.signOut();location.reload()}async function init(){if(!id)return;const{data:{session}}=await s.auth.getSession();if(!session)return;await s.rpc('vincular_mi_negocio_por_email');const r=await s.from('negocios').select('id,nombre,telefono,dirección,instagram,descripcion,tipo_negocio,dueño_id').eq('id',id).eq('dueño_id',session.user.id).maybeSingle();if(r.error||!r.data){$('loginMsg').textContent='No tenés acceso a este negocio.';return}negocio=r.data;if(r.data.tipo_negocio!==rubro){$('loginMsg').textContent='El rubro de este negocio no coincide.';return}$('login').style.display='none';$('app').style.display='block';$('brand').textContent='LMV STUDIO · '+(labels[rubro]||'ESTÉTICA');$('nombreNegocio').textContent=negocio.nombre;$('pagina').href='https://lmv-studio.github.io/Nova-shop/estetica.html?negocio='+encodeURIComponent(id)+'&rubro='+encodeURIComponent(rubro);$('bnombre').value=r.data.nombre||'';$('btelefono').value=r.data.telefono||'';$('bdireccion').value=r.data.dirección||'';$('binstagram').value=r.data.instagram||'';$('bdescripcion').value=r.data.descripcion||'';await cargarServicios();await cargarTurnos()}$('negocioForm').onsubmit=async e=>{e.preventDefault();const r=await s.from('negocios').update({nombre:$('bnombre').value.trim(),telefono:$('btelefono').value.trim()||null,dirección:$('bdireccion').value.trim()||null,instagram:$('binstagram').value.trim()||null,descripcion:$('bdescripcion').value.trim()||null}).eq('id',id).eq('dueño_id',negocio.dueño_id);msg(r.error?r.error.message:'Datos guardados')};async function cargarServicios(){const r=await s.from('servicios').select('*').eq('negocio_id',id).order('created_at',{ascending:false});if(r.error){$('servicios').textContent=r.error.message;return}$('servicios').innerHTML=(r.data||[]).map(x=>`<div class="item"><b>${esc(x.nombre)}</b><div class="muted">$${Number(x.precio||0).toLocaleString('es-AR')} · ${Number(x.duracion_minutos||0)} min · ${x.activo?'Activo':'Inactivo'}</div><p>${esc(x.descripcion||'')}</p><button class="btn" onclick="toggleServicio('${x.id}',${x.activo?'false':'true'})">${x.activo?'Desactivar':'Activar'}</button></div>`).join('')||'<div class="muted">Sin servicios.</div>'}async function toggleServicio(sid,activo){const r=await s.from('servicios').update({activo}).eq('id',sid).eq('negocio_id',id);msg(r.error?r.error.message:'Estado del servicio actualizado');await cargarServicios()}$('servForm').onsubmit=async e=>{e.preventDefault();const r=await s.from('servicios').insert({negocio_id:id,nombre:$('snombre').value.trim(),descripcion:$('sdescripcion').value.trim()||null,precio:Number($('sprecio').value),duracion_minutos:Number($('sduracion').value),activo:$('sactivo').value==='true'});if(r.error)msg(r.error.message);else{msg('Servicio creado');e.target.reset();$('sduracion').value=30;await cargarServicios()}};async function cargarTurnos(){const r=await s.from('turnos').select('id,nombre_cliente,cliente_nombre,fecha_hora_inicio,fecha_hora_fin,precio_reservado_total,estado').eq('negocios_id',id).order('fecha_hora_inicio',{ascending:false}).limit(50);if(r.error){$('turnos').textContent=r.error.message;return}$('turnos').innerHTML=(r.data||[]).map(t=>`<div class="item"><b>#${String(t.id).slice(0,8)} · ${esc(t.nombre_cliente||t.cliente_nombre||'Cliente')}</b><div class="muted">${new Date(t.fecha_hora_inicio).toLocaleString('es-AR')} · $${Number(t.precio_reservado_total||0).toLocaleString('es-AR')} · ${esc(t.estado||'pendiente')}</div><div class="row"><button class="btn" onclick="estado('${t.id}','confirmado')">Confirmar</button><button class="btn" onclick="estado('${t.id}','finalizado')">Finalizar</button><button class="btn red" onclick="estado('${t.id}','cancelado')">Cancelar</button></div></div>`).join('')||'<div class="muted">Sin turnos.</div>'}async function estado(tid,e){const r=await s.from('turnos').update({estado:e}).eq('id',tid).eq('negocios_id',id);msg(r.error?r.error.message:'Estado actualizado');await cargarTurnos()}s.auth.onAuthStateChange(()=>init());init();</script></body></html>
