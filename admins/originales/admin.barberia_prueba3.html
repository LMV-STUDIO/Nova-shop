<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin | Barbería Prueba 3</title></head><body><div style="font-family:Arial;background:#090909;color:#fff;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px">Cargando panel...</div><script>(async()=>{try{let html=await(await fetch('./admin.barberia_reutilizable.html'+location.search,{cache:'no-store'})).text();html=html.replaceAll('admin.barberia_reutilizable.html','admin.barberia_prueba3.html');const css=`
/* PRUEBA 3 - estilos visuales */
.p3-add{margin:8px 0 18px;padding:0!important;background:transparent!important;border:0!important;box-shadow:none!important}.p3-add-title{display:flex;align-items:center;gap:9px;color:#fff;font-weight:800;font-size:14px;margin-bottom:9px}.p3-add-title span{display:inline-flex;width:30px;height:30px;align-items:center;justify-content:center;border-radius:9px;background:#181818;border:1px solid #303030}.p3-add-row{display:flex;gap:8px;align-items:center;max-width:620px}.p3-add input{flex:1;min-width:0;background:#111!important;color:#fff!important;border:1px solid #303030!important;border-radius:10px!important;padding:11px 13px!important;outline:none;font-size:13px}.p3-add input:focus{border-color:#666!important;box-shadow:0 0 0 3px rgba(255,255,255,.035)}.p3-add input::placeholder{color:#777}.p3-add button{border:1px solid #3b3b3b!important;border-radius:10px!important;background:#202020!important;color:#fff!important;padding:11px 15px!important;font-size:12px!important;font-weight:800!important;cursor:pointer!important;white-space:nowrap;transition:.15s}.p3-add button:hover{background:#2b2b2b!important;border-color:#555!important;transform:translateY(-1px)}.p3-add button:disabled{opacity:.55;cursor:wait;transform:none}.p3-add-msg{min-height:16px;margin-top:6px;font-size:11px;color:#888}
/* Tabla de barberos */
#tablaBarberos{width:100%!important;border-collapse:separate!important;border-spacing:0!important;background:#101010!important;border:1px solid #292929!important;border-radius:12px!important;overflow:hidden!important}#tablaBarberos thead,#tablaBarberos thead tr{background:#151515!important}#tablaBarberos th{background:#151515!important;color:#aaa!important;border-bottom:1px solid #292929!important;padding:11px 13px!important;font-size:11px!important;font-weight:800!important;text-transform:uppercase!important;letter-spacing:.04em!important;text-align:left!important}#tablaBarberos td{background:#101010!important;color:#eee!important;border-bottom:1px solid #222!important;padding:12px 13px!important;font-size:13px!important}#tablaBarberos tr:last-child td{border-bottom:0!important}#tablaBarberos tbody tr:hover td{background:#151515!important}
/* Agenda */
#agendaFecha{background:#101010!important;color:#fff!important;border:1px solid #303030!important;border-radius:10px!important;padding:10px 12px!important;outline:none}#agendaFecha:focus{border-color:#666!important}.agenda-nav-wrap{display:flex;align-items:center;gap:7px;flex-wrap:wrap}#agenda-navegacion{display:flex!important;align-items:center;justify-content:center;gap:3px;width:max-content!important;padding:3px!important;margin:0!important;border:1px solid #2b2b2b!important;border-radius:11px!important;background:#0e0e0e!important;box-shadow:none!important}#agenda-navegacion button{height:34px!important;min-width:36px!important;padding:0 10px!important;border:1px solid transparent!important;border-radius:8px!important;background:#171717!important;color:#aaa!important;font-weight:800!important;font-size:12px!important;cursor:pointer!important;transition:.15s!important}#agenda-navegacion button:hover{background:#222!important;color:#fff!important;border-color:#363636!important;transform:none!important}#agenda-navegacion .agenda-nav-btn{font-size:17px!important;color:#ddd!important;width:36px!important;padding:0!important}.agenda-nav-hoy{min-width:52px!important;color:#fff!important;background:#242424!important;border-color:#343434!important}
/* Horarios */
#horariosBarberos{display:grid;gap:13px}#horariosBarberos>.card{margin:0;padding:16px;border:1px solid #292929;border-radius:15px;background:#121212;box-shadow:none}#horariosBarberos>.card h3{margin:0 0 12px;font-size:16px;display:flex;align-items:center;gap:8px}#horariosBarberos>.card>div[style*="grid-template-columns"]{grid-template-columns:minmax(90px,1fr) minmax(105px,1fr) minmax(105px,1fr) auto!important;gap:8px!important;margin-bottom:7px!important;padding:8px;border:1px solid #242424;border-radius:10px;background:#0d0d0d}#horariosBarberos input[type="time"]{box-sizing:border-box!important;padding:8px!important;border:1px solid #303030!important;border-radius:8px!important;background:#151515!important;color:#fff!important;font-size:12px!important;min-width:0!important}#horariosBarberos label{height:34px;padding:0 9px!important;border:1px solid #303030!important;border-radius:8px!important;background:#171717!important;color:#999!important;display:flex!important;justify-content:center;align-items:center;gap:6px!important;cursor:pointer;white-space:nowrap}#horariosBarberos label input[type="checkbox"]{appearance:none;-webkit-appearance:none;width:28px;height:16px;border-radius:999px;background:#373737;position:relative;margin:0;cursor:pointer}#horariosBarberos label input[type="checkbox"]:before{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#aaa;transition:.18s}#horariosBarberos label:has(input[type="checkbox"]:checked){border-color:#396b4a!important;background:#122018!important;color:#b7e8c6!important}#horariosBarberos label input[type="checkbox"]:checked{background:#2d8a4b}#horariosBarberos label input[type="checkbox"]:checked:before{left:14px;background:#fff}#horariosBarberos>.card>.btn{margin-top:7px;width:100%;border-radius:9px;padding:10px;font-weight:700}
@media(max-width:750px){.p3-add-row{display:grid;grid-template-columns:1fr 100px}.p3-add button{padding:11px 9px!important}.agenda-nav-wrap{width:100%;justify-content:center}#agenda-navegacion{width:100%!important}#agenda-navegacion button{height:34px!important}.agenda-nav-btn{flex:1!important}.agenda-nav-hoy{flex:1!important;min-width:0!important}#horariosBarberos{gap:10px}#horariosBarberos>.card{padding:12px;border-radius:13px}#horariosBarberos>.card h3{font-size:15px;margin-bottom:9px}#horariosBarberos>.card>div[style*="grid-template-columns"]{grid-template-columns:1fr auto!important;grid-template-areas:"dia atiende" "inicio fin"!important;align-items:center!important;padding:8px!important;gap:6px!important}#horariosBarberos>.card>div[style*="grid-template-columns"]>strong{grid-area:dia}#horariosBarberos>.card>div[style*="grid-template-columns"]>input[type="time"]:first-of-type{grid-area:inicio}#horariosBarberos>.card>div[style*="grid-template-columns"]>input[type="time"]:last-of-type{grid-area:fin}#horariosBarberos>.card>div[style*="grid-template-columns"]>label{grid-area:atiende;font-size:10px;padding:0 7px!important}}
@media(max-width:430px){.p3-add-row{grid-template-columns:1fr}.p3-add button{width:100%;height:40px}.agenda-nav-wrap{gap:5px}#agenda-navegacion button{height:33px!important;min-width:0!important;padding:0 7px!important}.agenda-nav-btn{font-size:16px!important}}
`;
const addScript=`<script>(function(){function instalar(){if(document.getElementById('p3-add'))return;const tabla=document.getElementById('tablaBarberos');if(!tabla)return;const alvo=tabla.closest('.tabla-wrapper')||tabla.parentElement;if(!alvo)return;const box=document.createElement('div');box.className='p3-add';box.id='p3-add';box.innerHTML='<div class="p3-add-title"><span>👤</span>Agregar barbero</div><div class="p3-add-row"><input id="p3-name" maxlength="80" placeholder="Nombre del barbero"><button type="button" id="p3-add-btn">+ Agregar</button></div><div class="p3-add-msg" id="p3-add-msg"></div>';alvo.parentNode.insertBefore(box,alvo);const btn=document.getElementById('p3-add-btn'),input=document.getElementById('p3-name'),msg=document.getElementById('p3-add-msg');async function agregar(){const nombre=input.value.trim();if(!nombre){msg.textContent='Escribí el nombre del barbero.';return}if(typeof supabaseClient==='undefined'){msg.textContent='Supabase todavía no está disponible.';return}const negocio=new URLSearchParams(location.search).get('negocio');if(!negocio){msg.textContent='Falta el negocio en la URL.';return}btn.disabled=true;msg.textContent='Agregando...';const {error}=await supabaseClient.from('barberos').insert({negocio_id:negocio,nombre,activo:true});if(error){msg.textContent='No se pudo agregar: '+error.message;btn.disabled=false;return}msg.textContent='Barbero agregado correctamente.';input.value='';btn.disabled=false;if(typeof cargarBarberos==='function')await cargarBarberos();if(typeof cargarHorariosBarberos==='function')await cargarHorariosBarberos()}btn.onclick=agregar;input.addEventListener('keydown',e=>{if(e.key==='Enter')agregar()})}function init(){instalar();setTimeout(instalar,300);setTimeout(instalar,1000)}if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();new MutationObserver(instalar).observe(document.body,{childList:true,subtree:true})})();<\/script>`;
html=html.replace('</head>','<style>'+css+'</style></head>');html=html.replace('</body>',addScript+'</body>');document.open();document.write(html);document.close()}catch(e){document.body.innerHTML='<pre style="color:red">No se pudo cargar el panel: '+String(e)+'</pre>'}})();</script></body></html>
