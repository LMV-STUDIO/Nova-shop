<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Demo Admin Lashes — LMV Studio</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden}iframe{display:block;width:100%;height:100%;border:0}</style></head><body><iframe id="demo" src="../originales/admin.lashes.html" title="Demo Admin Lashes"></iframe><script>const f=document.getElementById('demo');f.addEventListener('load',()=>{try{const d=f.contentDocument,s=d.createElement('style');s.textContent='#login,.login,[class*="login"]{display:none!important}#app,.app{display:block!important}';d.head.appendChild(s);const a=d.getElementById('app');if(a)a.style.display='block';const l=d.getElementById('login');if(l)l.style.display='none'}catch(e){console.error(e)}});</script></body></html>
